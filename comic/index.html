<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#0d0d12">
<title>그날, 제1과학실 — 승훈 &amp; 선주</title>
<meta property="og:title" content="그날, 제1과학실">
<meta property="og:description" content="승훈 & 선주 — 자작 소설 만화책">
<meta property="og:image" content="images/p01.png">
<style>
:root{
  --bg:#0d0d12; --panel:#17171f; --ink:#ece9f1; --dim:#9a93a8; --accent:#ff8fb3; --accent2:#8fb3ff;
  --bar:rgba(23,23,31,.92);
}
html[data-theme="light"]{
  --bg:#efe9e2; --panel:#faf6f0; --ink:#2b2630; --dim:#7a7286; --bar:rgba(250,246,240,.94);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  overflow:hidden; overscroll-behavior:none; touch-action:manipulation;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ===== 표지 ===== */
#cover{
  position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 20%, #23233a 0%, #0d0d12 70%);
  transition:opacity .7s ease, visibility .7s;
}
#cover.hidden{opacity:0;visibility:hidden;pointer-events:none}
#cover::before{
  content:"";position:absolute;inset:0;opacity:.35;
  background:url("images/thumbs/p01.jpg") center/cover no-repeat;filter:blur(3px) saturate(.9);
  mask-image:linear-gradient(to bottom, rgba(0,0,0,.9), rgba(0,0,0,.45) 55%, #000);
  -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,.9), rgba(0,0,0,.45) 55%, #000);
}
.cover-inner{position:relative;z-index:2;text-align:center;padding:0 24px;animation:rise 1.1s ease both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.cover-badge{display:inline-block;font-size:12px;letter-spacing:.32em;color:var(--accent);border:1px solid rgba(255,143,179,.45);border-radius:999px;padding:6px 16px 5px 19px;margin-bottom:22px}
.cover-title{
  font-size:clamp(30px,9vw,52px);font-weight:800;line-height:1.25;letter-spacing:.01em;color:#fff;
  text-shadow:0 2px 24px rgba(0,0,0,.6);
}
.cover-sub{margin-top:14px;font-size:clamp(14px,4vw,18px);color:#cfc7dd;letter-spacing:.14em}
.cover-sub b{color:#ffd9e6;font-weight:700}
.cover-cta{
  margin-top:38px;display:inline-flex;align-items:center;gap:10px;cursor:pointer;border:none;
  background:linear-gradient(135deg,#ff8fb3,#b57bff);color:#fff;font-size:17px;font-weight:700;font-family:inherit;
  padding:15px 42px;border-radius:999px;box-shadow:0 8px 30px rgba(255,120,170,.35);transition:transform .15s, box-shadow .15s;
}
.cover-cta:active{transform:scale(.96)}
.cover-pages{margin-top:18px;font-size:12px;color:#8d8499;letter-spacing:.2em}

/* ===== 뷰어 (페이지 모드) ===== */
#stage{position:relative;flex:1;overflow:hidden}
#pageView{position:absolute;inset:0;touch-action:pan-y}
.page{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transform:scale(.985);transition:opacity .38s ease, transform .38s ease, visibility .38s;
  will-change:opacity,transform;padding:10px;padding-bottom:74px;
}
html[data-theme="light"] .page{background:var(--bg)}
.page.active{opacity:1;visibility:visible;transform:none}
.page.prev-left{transform:translateX(-26px) scale(.985)}
.page.prev-right{transform:translateX(26px) scale(.985)}
.flip-in-r{animation:flipInR .42s cubic-bezier(.22,.9,.3,1) both}
.flip-in-l{animation:flipInL .42s cubic-bezier(.22,.9,.3,1) both}
@keyframes flipInR{from{opacity:0;transform:perspective(1400px) rotateY(-7deg) translateX(7%)}to{opacity:1;transform:none}}
@keyframes flipInL{from{opacity:0;transform:perspective(1400px) rotateY(7deg) translateX(-7%)}to{opacity:1;transform:none}}
.page-inner{position:relative;height:100%;max-width:min(94vw, calc((100vh - 84px)));display:flex;align-items:center;justify-content:center}
.page-inner img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.55);display:block}
/* 핀치줌/더블탭 확대용 래퍼 */
.zoom-wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.zoom-wrap.zoomed{position:absolute;inset:0;z-index:5;overflow:auto;touch-action:pan-x pan-y;align-items:flex-start;justify-content:flex-start}
.zoom-wrap.zoomed img{max-width:none;border-radius:0}
.page .loading{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;letter-spacing:.1em;
}
.edge-btn{
  position:absolute;top:50%;transform:translateY(-50%);z-index:10;border:none;cursor:pointer;
  width:46px;height:76px;border-radius:12px;background:rgba(20,20,28,.55);color:#fff;font-size:22px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
  transition:opacity .25s, background .2s;opacity:.75;
}
.edge-btn:hover{background:rgba(40,40,55,.8);opacity:1}
#btnPrevL{left:10px}#btnNextR{right:10px}

/* ===== 웹툰 모드 ===== */
#webView{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;background:var(--bg)}
#webView.on{display:block}
#webView .wimgs{display:flex;flex-direction:column;align-items:center;gap:0;padding-bottom:90px}
#webView img{width:min(100%, 760px);display:block}
#webView .loadbox{min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px}

/* ===== 하단 바 ===== */
#bottomBar{
  position:absolute;left:0;right:0;bottom:0;z-index:40;height:64px;display:flex;align-items:center;gap:6px;
  padding:0 10px;padding-bottom:env(safe-area-inset-bottom);
  background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.07);
}
.icon-btn{
  border:none;background:transparent;color:var(--ink);cursor:pointer;flex:0 0 auto;
  width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;
  transition:background .15s;
}
.icon-btn:active{background:rgba(128,128,150,.18)}
.icon-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#pagerBox{flex:1;display:flex;align-items:center;gap:12px;min-width:0;padding:0 6px}
.arrow-btn{
  border:none;background:rgba(128,128,150,.14);color:var(--ink);cursor:pointer;flex:0 0 auto;
  width:36px;height:36px;border-radius:10px;font-size:16px;display:flex;align-items:center;justify-content:center;
}
.arrow-btn:disabled{opacity:.25;cursor:default}
#slider{flex:1;-webkit-appearance:none;appearance:none;height:30px;background:transparent;cursor:pointer;min-width:40px}
#slider::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--fill,0%),rgba(128,128,150,.3) var(--fill,0%))}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:var(--accent);margin-top:-7px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#slider::-moz-range-track{height:5px;border-radius:3px;background:rgba(128,128,150,.3)}
#slider::-moz-range-progress{height:5px;border-radius:3px;background:var(--accent)}
#slider::-moz-range-thumb{width:19px;height:19px;border:none;border-radius:50%;background:var(--accent)}
#pageNum{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--ink);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
#pageNum small{color:var(--dim);font-weight:500}

/* ===== 목차 드로어 ===== */
#drawer{
  position:absolute;left:0;right:0;bottom:0;z-index:50;background:var(--panel);
  border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.3,.9,.3,1);
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:62%;overflow-y:auto;
  box-shadow:0 -12px 40px rgba(0,0,0,.5);
}
#drawer.open{transform:none}
#drawer h3{font-size:14px;color:var(--dim);letter-spacing:.1em;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
#drawerClose{border:none;background:transparent;color:var(--dim);font-size:18px;cursor:pointer}
.thumb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.thumb-item{cursor:pointer;border-radius:10px;overflow:hidden;position:relative;border:2px solid transparent;transition:border-color .15s;background:#000}
.thumb-item.current{border-color:var(--accent)}
.thumb-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block;opacity:.92}
.thumb-item .lbl{
  position:absolute;left:6px;bottom:5px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9);
  background:rgba(0,0,0,.35);padding:1px 7px;border-radius:6px;
}

/* 토스트 */
#toast{
  position:absolute;left:50%;top:14px;transform:translateX(-50%) translateY(-70px);z-index:55;
  background:rgba(20,20,30,.88);color:#fff;font-size:13px;padding:9px 18px;border-radius:999px;
  transition:transform .3s ease;backdrop-filter:blur(8px);pointer-events:none;white-space:nowrap;
}
#toast.show{transform:translateX(-50%) translateY(0)}
/* 모드 전환 플로팅 버튼 */
#modeFab{
  position:absolute;right:14px;bottom:80px;z-index:35;border:none;cursor:pointer;
  background:rgba(25,25,36,.85);color:var(--ink);font-size:12px;font-weight:600;font-family:inherit;
  padding:10px 15px;border-radius:999px;backdrop-filter:blur(8px);
  box-shadow:0 4px 18px rgba(0,0,0,.4);transition:opacity .3s;
}
#modeFab.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="app">

  <!-- 표지 -->
  <div id="cover">
    <div class="cover-inner">
      <span class="cover-badge">COMIC</span>
      <h1 class="cover-title">그날, 제1과학실</h1>
      <p class="cover-sub">승훈 &amp; 선주</p>
      <button class="cover-cta" id="btnStart">📖&nbsp; 읽기 시작</button>
      <p class="cover-pages">전체 5페이지</p>
    </div>
  </div>

  <!-- 뷰어 -->
  <div id="stage">
    <div id="pageView"></div>
    <button class="edge-btn" id="btnPrevL" aria-label="이전 페이지">‹</button>
    <button class="edge-btn" id="btnNextR" aria-label="다음 페이지">›</button>

    <div id="webView"><div class="wimgs" id="webImgs"><div class="loadbox">로딩 중…</div></div></div>

    <button id="modeFab">🌐 웹툰 모드</button>

    <div id="bottomBar">
      <button class="icon-btn" id="btnToc" aria-label="목차">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <button class="icon-btn" id="btnPrev" aria-label="이전 페이지">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div id="pagerBox">
        <input type="range" id="slider" min="1" max="5" value="1" step="1" aria-label="페이지 이동">
        <span id="pageNum">1 <small>/ 5</small></span>
      </div>
      <button class="icon-btn" id="btnNext" aria-label="다음 페이지">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button class="icon-btn" id="btnTheme" aria-label="배경 전환">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>

    <!-- 목차 드로어 -->
    <div id="drawer">
      <h3>목차 <button id="drawerClose">✕</button></h3>
      <div class="thumb-grid" id="thumbGrid"></div>
    </div>

    <div id="toast"></div>
  </div>
</div>

<script>
/* ============================================================
   페이지 목록 — 여기에 파일만 추가하면 전체 5 등이 자동 갱신됨
   ============================================================ */
const PAGES = [
  {src:"images/p01.png", label:"1페이지", thumb:"images/thumbs/p01.jpg"},
  {src:"images/p02.png", label:"2페이지", thumb:"images/thumbs/p02.jpg"},
  {src:"images/p03.png", label:"3페이지", thumb:"images/thumbs/p03.jpg"},
  {src:"images/p04.png", label:"4페이지", thumb:"images/thumbs/p04.jpg"},
  {src:"images/p05.png", label:"5페이지", thumb:"images/thumbs/p05.jpg"},
];
/* 예시 (추후 추가):
PAGES.push({src:"images/p06.png", label:"6페이지", thumb:"images/thumbs/p06.jpg"});
*/

const N = PAGES.length;
const $ = s => document.querySelector(s);
const slider = $("#slider"), pageNum = $("#pageNum"), toast = $("#toast");
let cur = 1, mode = "page", toastTimer = null;

/* --- 초기 세팅 --- */
slider.max = N;
pageNum.innerHTML = `1 <small>/ ${N}</small>`;

const pageView = $("#pageView");
PAGES.forEach((p, i) => {
  const d = document.createElement("div");
  d.className = "page";
  d.innerHTML = `<div class="page-inner zoom-wrap"><span class="loading">LOADING…</span></div>`;
  pageView.appendChild(d);
});
const pageEls = [...pageView.querySelectorAll(".page")];

/* --- 목차 썸네일 --- */
const grid = $("#thumbGrid");
PAGES.forEach((p, i) => {
  const t = document.createElement("div");
  t.className = "thumb-item";
  t.innerHTML = `<img src="${p.thumb}" alt="${p.label}" loading="lazy"><span class="lbl">${i+1}</span>`;
  t.onclick = () => { go(i+1); toggleDrawer(false); };
  grid.appendChild(t);
});

/* --- 로딩 --- */
const loaded = new Set();
function loadImage(i, cb){
  if (loaded.has(i)) { cb && cb(); return; }
  const el = pageEls[i].querySelector(".zoom-wrap");
  const img = new Image();
  img.src = PAGES[i].src;
  img.alt = PAGES[i].label;
  img.onload = () => {
    el.querySelector(".loading")?.remove();
    el.appendChild(img);
    loaded.add(i);
    cb && cb();
  };
  img.onerror = () => { el.querySelector(".loading").textContent = "불러오기 실패"; };
}
function loadWebView(){
  const box = $("#webImgs");
  if (box.dataset.done) return;
  box.innerHTML = "";
  PAGES.forEach(p => {
    const img = new Image();
    img.src = p.src; img.alt = p.label; img.loading = "lazy";
    box.appendChild(img);
  });
  box.dataset.done = "1";
}

/* --- 페이지 이동 --- */
function go(n, dir){
  n = Math.max(1, Math.min(N, n));
  if (mode !== "page") { $("#webView").scrollTo({top:(n-1)*$("#webView").clientWidth, behavior:"smooth"}); return; }
  const d = dir || (n > cur ? 1 : -1);
  cur = n;
  updateUI(d);
}
function updateUI(dir){
  slider.value = cur;
  slider.style.setProperty("--fill", ((cur-1)/(N-1)*100) + "%");
  pageNum.innerHTML = `${cur} <small>/ ${N}</small>`;
  $("#btnPrev").disabled = cur <= 1;
  $("#btnNext").disabled = cur >= N;
  $("#btnPrevL").style.display = cur <= 1 ? "none" : "";
  $("#btnNextR").style.display = cur >= N ? "none" : "";
  pageEls.forEach((el, i) => {
    el.classList.toggle("active", i+1 === cur);
    el.classList.remove("flip-in-r","flip-in-l");
  });
  const el = pageEls[cur-1];
  loadImage(cur, () => {
    el.classList.add(dir > 0 ? "flip-in-r" : "flip-in-l");
  });
  loadImage(cur, null);
  // 인접 페이지 미리 로드
  if (cur+1 <= N) loadImage(cur, null), loadImage(cur+1, null);
  if (cur-1 >= 1) loadImage(cur-1, null);
  grid.querySelectorAll(".thumb-item").forEach((t,i)=>t.classList.toggle("current", i+1===cur));
  const ct = grid.children[cur-1];
  ct && ct.scrollIntoView({block:"nearest", inline:"nearest"});
}
$("#slider").addEventListener("input", e => go(+e.target.value, 0));
$("#btnPrev").onclick = () => go(cur-1,-1);
$("#btnNext").onclick = () => go(cur+1, 1);
$("#btnPrevL").onclick = () => go(cur-1,-1);
$("#btnNextR").onclick = () => go(cur+1, 1);

/* --- 표지 --- */
$("#btnStart").onclick = () => {
  $("#cover").classList.add("hidden");
  go(1, 1);
  try { localStorage.setItem("comic_started","1"); } catch(e){}
};
(function(){ try { if (localStorage.getItem("comic_started")==="1") $("#cover").classList.add("hidden"); } catch(e){} })();

/* --- 좌우 스와이프 --- */
let sx=0, sy=0, swiping=false;
pageView.addEventListener("touchstart", e => {
  if (document.querySelector(".zoom-wrap.zoomed")) return;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiping = true;
}, {passive:true});
pageView.addEventListener("touchend", e => {
  if (!swiping) return; swiping = false;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)*1.4) { dx < 0 ? go(cur+1,1) : go(cur-1,-1); }
});

/* --- 키보드 --- */
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(cur+1,1);
  if (e.key === "ArrowLeft")  go(cur-1,-1);
  if (e.key === "Escape") toggleDrawer(false);
});

/* --- 더블탭/핀치 줌 (페이지 모드) --- */
let lastTap = 0;
pageView.addEventListener("touchend", e => {
  const now = Date.now();
  if (now - lastTap < 300) {
    const zw = pageEls[cur-1].querySelector(".zoom-wrap");
    if (zw.classList.contains("zoomed")) {
      zw.classList.remove("zoomed");
    } else {
      const img = zw.querySelector("img");
      if (img){ img.style.width = (img.naturalWidth * 0.9) + "px"; }
      zw.classList.add("zoomed");
    }
  }
  lastTap = now;
});

/* --- 다크/라이트 --- */
$("#btnTheme").onclick = () => {
  const r = document.documentElement;
  const next = r.dataset.theme === "light" ? "dark" : "light";
  r.dataset.theme = next;
  try { localStorage.setItem("comic_theme", next); } catch(e){}
  showToast(next === "light" ? "라이트 배경" : "다크 배경");
};
try { const t = localStorage.getItem("comic_theme"); if (t) document.documentElement.dataset.theme = t; } catch(e){}

/* --- 목차 드로어 --- */
function toggleDrawer(open){
  $("#drawer").classList.toggle("open", open ?? !$("#drawer").classList.contains("open"));
}
$("#btnToc").onclick = () => toggleDrawer();
$("#drawerClose").onclick = () => toggleDrawer(false);

/* --- 모드 전환 --- */
const fab = $("#modeFab");
fab.onclick = () => setMode(mode === "page" ? "web" : "page");
function setMode(m){
  mode = m;
  const isWeb = m === "web";
  pageView.style.display = isWeb ? "none" : "";
  $("#btnPrevL").style.display = isWeb ? "none" : "";
  $("#btnNextR").style.display = isWeb ? "none" : "";
  $("#btnPrev").style.display = isWeb ? "none" : "";
  $("#btnNext").style.display = isWeb ? "none" : "";
  slider.disabled = isWeb;
  $("#webView").classList.toggle("on", isWeb);
  fab.textContent = isWeb ? "📖 책 모드" : "🌐 웹툰 모드";
  if (isWeb) {
    loadWebView();
    requestAnimationFrame(() => {
      const w = $("#webView");
      const imgs = [...w.querySelectorAll("img")];
      const t = imgs[Math.min(cur,N)-1];
      t && t.scrollIntoView({behavior:"instant"});
    });
  } else {
    updateUI(0);
  }
  showToast(isWeb ? "웹툰 모드 (세로 스크롤)" : "책 모드 (페이지 넘김)");
  try { localStorage.setItem("comic_mode", m); } catch(e){}
}
try { const m = localStorage.getItem("comic_mode"); if (m === "web") setMode("web"); } catch(e){}

/* 웹툰 모드 스크롤 → 페이지 번호 추적 */
$("#webView").addEventListener("scroll", () => {
  if (mode !== "web") return;
  const w = $("#webView");
  const imgs = [...w.querySelectorAll("img")];
  const mid = w.scrollTop + w.clientHeight/2;
  let n = 1;
  imgs.forEach((im,i) => { if (im.offsetTop <= mid) n = i+1; });
  cur = n;
  pageNum.innerHTML = `${cur} <small>/ ${N}</small>`;
  slider.value = cur; slider.style.setProperty("--fill", ((cur-1)/(N-1)*100)+"%");
  grid.querySelectorAll(".thumb-item").forEach((t,i)=>t.classList.toggle("current", i+1===cur));
}, {passive:true});

/* --- 토스트 --- */
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
}

/* 스크롤 시 FAB 숨김 (웹툰 모드) */
$("#webView").addEventListener("scroll", () => {
  fab.classList.toggle("hide", mode === "web" && $("#webView").scrollTop > 40);
}, {passive:true});

/* 첫 페이지 미리 로드 */
loadImage(0, null); loadImage(1, null);
updateUI(0);
</script>
</body>
</html>
