<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모바일 미리보기 · 오늘도 바쁜 AI 사무실</title>
<style>
html,body{margin:0;height:100%;background:#05070d;overflow:hidden;font-family:sans-serif;}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
#phone{max-height:100vh;border:2px solid #333;border-radius:14px;overflow:hidden;background:#000;}
#phone iframe{border:0;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="phone"><iframe id="fr"></iframe></div></div>
<script>
var q = new URLSearchParams(location.search);
var w = parseInt(q.get("w") || "390", 10), h = parseInt(q.get("h") || "844", 10);
var fr = document.getElementById("fr");
fr.style.width = w + "px"; fr.style.height = h + "px";
document.getElementById("phone").style.width = (w + 4) + "px";
document.getElementById("phone").style.height = (h + 4) + "px";
fr.src = "./index.html?v=" + (q.get("v") || "1");
</script>
</body>
</html>
