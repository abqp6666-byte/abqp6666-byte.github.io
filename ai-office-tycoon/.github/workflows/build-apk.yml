# 이 파일은 프로젝트를 단독 저장소로 뺄 때 쓰는 워크플로입니다.
# 현재는 사용자 GitHub Pages 저장소(abqp6666-byte.github.io) 루트의
# .github/workflows/build-apk.yml 이 실제로 실행됩니다. (동작은 같고 경로만 다름)
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon --stacktrace
      - run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ai-office-tycoon.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ai-office-tycoon-apk
          path: out/ai-office-tycoon.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 오늘도 바쁜 AI 사무실 v1.0.0
          make_latest: true
          files: out/ai-office-tycoon.apk
