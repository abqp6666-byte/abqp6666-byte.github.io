<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#131a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>오늘도 바쁜 AI 사무실 · AI Office Tycoon</title>
<style>
:root{
  --ink:#0a0e1a; --panel:#1c2542; --panel2:#27335c; --panel3:#33406e;
  --gold:#ffd479; --green:#7be08e; --red:#ff7a7a; --blue:#5cc6e8; --violet:#a98bff;
  --txt:#eaf0ff; --dim:#93a4cf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0f1c;overscroll-behavior:none;}
body{
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--txt);user-select:none;-webkit-user-select:none;touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}
#app{
  position:fixed;inset:0;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
  background:radial-gradient(130% 70% at 50% 0%,#2a3563 0%,#171f38 48%,#0a0e1a 100%);
}

/* ---------- header ---------- */
#hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px 5px;flex:0 0 auto;}
.hdr-l{min-width:0;}
.kicker{font-size:8px;letter-spacing:2.2px;font-weight:700;color:#7f92c4;line-height:1;}
h1{margin:3px 0 0;font-size:15px;font-weight:800;letter-spacing:-.4px;color:#fff;line-height:1.1;
   text-shadow:2px 2px 0 #05070f;}
.hdr-r{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
.badge{font-size:9px;font-weight:800;letter-spacing:.6px;background:var(--panel2);color:var(--gold);
  border:2px solid var(--ink);padding:3px 6px;box-shadow:0 2px 0 var(--ink);white-space:nowrap;}
.iconbtn{width:30px;height:28px;display:grid;place-items:center;font-size:13px;background:var(--panel2);
  color:var(--txt);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);padding:0;cursor:pointer;line-height:1;}
.iconbtn:active{transform:translateY(2px);box-shadow:none;}

/* ---------- hud ---------- */
#hud{display:flex;align-items:center;gap:8px;margin:0 10px 5px;padding:5px 9px;background:var(--panel);
  border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);flex:0 0 auto;}
.hud-money{display:flex;align-items:baseline;gap:2px;min-width:0;}
.hud-money .w{font-size:11px;font-weight:800;color:var(--gold);opacity:.85;}
#money{font-size:16px;font-weight:800;color:var(--gold);letter-spacing:.3px;white-space:nowrap;
  font-variant-numeric:tabular-nums;}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.hud-line{display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
#ips{font-size:10px;font-weight:800;color:var(--green);white-space:nowrap;}
.hud-lv{font-size:9px;font-weight:800;color:var(--dim);white-space:nowrap;}
.hud-lv b{color:#fff;}
.xpbar{height:5px;background:#0f1730;border:1px solid #000;overflow:hidden;}
.xpbar i{display:block;height:100%;width:0%;background:linear-gradient(#ffe9a8,var(--gold));transition:width .25s linear;}

/* ---------- stage ---------- */
#stage{position:relative;flex:1 1 auto;margin:0 6px;min-height:0;overflow:hidden;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;
  image-rendering:crisp-edges;}
#toastLayer{position:absolute;left:0;right:0;top:6px;display:flex;flex-direction:column;align-items:center;
  gap:4px;pointer-events:none;z-index:6;}
.toast{font-size:11px;font-weight:800;padding:5px 10px;background:rgba(16,22,40,.94);color:#fff;
  border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);animation:toastIn .22s ease-out both;max-width:96%;}
.toast.good{color:var(--green);border-color:#0a1a10;background:rgba(14,34,24,.96);}
.toast.bad{color:var(--red);}
.toast.gold{color:var(--gold);background:rgba(40,32,10,.96);}
@keyframes toastIn{from{opacity:0;transform:translateY(-6px) scale(.96);}to{opacity:1;transform:none;}}
.toast.out{animation:toastOut .3s ease-in forwards;}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px);}}

/* ---------- quickbar ---------- */
#quickbar{display:flex;gap:6px;padding:6px 10px 4px;flex:0 0 auto;}
.qbtn{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:5px;
  font-family:inherit;font-size:12px;font-weight:800;letter-spacing:-.2px;color:#20160a;
  background:linear-gradient(#ffe1a0,#ffbe4d);border:2px solid var(--ink);
  box-shadow:0 4px 0 var(--ink);padding:9px 4px;cursor:pointer;}
.qbtn.alt{background:linear-gradient(#b7e7ff,#63c2ee);color:#08202c;}
.qbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.qbtn[disabled]{background:#3a4463;color:#8892b0;box-shadow:0 4px 0 #1a2136;cursor:default;transform:none;}
.qbtn .cnt{position:absolute;top:-6px;right:-4px;min-width:17px;height:16px;font-size:9px;line-height:14px;
  text-align:center;background:var(--red);color:#fff;border:2px solid var(--ink);padding:0 3px;}
.qbtn .sub{font-size:9px;font-weight:700;opacity:.75;}

/* ---------- tabs ---------- */
#tabs{display:flex;gap:5px;padding:4px 10px calc(6px + env(safe-area-inset-bottom,0px));flex:0 0 auto;}
#tabs button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;
  font-family:inherit;font-size:11px;font-weight:800;color:var(--dim);background:var(--panel);
  border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:6px 2px 5px;cursor:pointer;}
#tabs button .ico{font-size:13px;line-height:1;}
#tabs button.on{color:#20160a;background:linear-gradient(#ffe1a0,#ffc663);}
#tabs button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);}
#tabs button b{position:absolute;top:-6px;right:-3px;min-width:16px;height:16px;font-size:9px;line-height:14px;
  text-align:center;background:var(--red);color:#fff;border:2px solid var(--ink);padding:0 3px;}
.hidden{display:none !important;}

/* ---------- sheet ---------- */
#sheetWrap{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;
  background:rgba(4,7,14,.55);animation:fade .18s ease-out both;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
#sheet{background:#151d34;border-top:3px solid var(--ink);max-height:78%;
  display:flex;flex-direction:column;box-shadow:0 -4px 0 rgba(0,0,0,.5);
  padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s cubic-bezier(.2,.9,.3,1) both;}
@keyframes up{from{transform:translateY(30px);}to{transform:none;}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 8px;
  border-bottom:2px solid #0a1024;background:#1a2440;}
.sheet-head h2{margin:0;font-size:13px;font-weight:800;letter-spacing:-.3px;}
.sheet-head .sub{font-size:9px;color:var(--dim);font-weight:700;margin-top:2px;}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 14px;display:flex;
  flex-direction:column;gap:8px;}

/* ---------- cards ---------- */
.card{background:var(--panel);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:9px 10px;
  animation:cardIn .22s ease-out both;}
@keyframes cardIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.card .top{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.chip{font-size:8px;font-weight:800;letter-spacing:.5px;padding:2px 5px;color:#0b1020;border:1px solid #000;
  white-space:nowrap;}
.card h3{margin:0;font-size:12.5px;font-weight:800;letter-spacing:-.3px;line-height:1.2;flex:1;}
.card p{margin:0 0 8px;font-size:11px;line-height:1.45;color:#c3cfeb;letter-spacing:-.2px;}
.opts{display:flex;flex-direction:column;gap:5px;}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:inherit;
  font-size:11.5px;font-weight:700;text-align:left;color:var(--txt);background:var(--panel2);
  border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:8px 9px;cursor:pointer;line-height:1.2;}
.opt .lbl{flex:1;}
.opt .rw{font-size:10px;font-weight:800;white-space:nowrap;}
.opt .rw .m{color:var(--gold);}
.opt .rw .x{color:var(--blue);}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);background:#31407a;}
.empty{text-align:center;font-size:11px;color:var(--dim);padding:26px 12px;line-height:1.6;}

/* ---------- staff / shop rows ---------- */
.row{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--ink);
  box-shadow:0 3px 0 var(--ink);padding:8px 9px;}
.row.locked{opacity:.5;}
.swatch{width:22px;height:22px;flex:0 0 auto;border:2px solid var(--ink);position:relative;overflow:hidden;}
.swatch:after{content:"";position:absolute;left:3px;top:4px;width:16px;height:5px;background:rgba(10,14,26,.55);}
.row .meta{flex:1;min-width:0;}
.row .nm{font-size:12px;font-weight:800;letter-spacing:-.2px;}
.row .nm em{font-style:normal;font-size:9px;font-weight:800;color:var(--gold);margin-left:4px;}
.row .jb{font-size:10px;color:var(--dim);font-weight:700;margin-top:1px;}
.row .inc{font-size:10px;font-weight:800;color:var(--green);margin-top:2px;}
.row .act{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.mini{font-family:inherit;font-size:10.5px;font-weight:800;color:#20160a;background:linear-gradient(#ffe1a0,#ffc04d);
  border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);padding:6px 8px;cursor:pointer;line-height:1;white-space:nowrap;}
.mini:active{transform:translateY(2px);box-shadow:none;}
.mini.blue{background:linear-gradient(#bfe9ff,#6cc6ee);color:#08202c;}
.mini[disabled]{background:#39435f;color:#8b95b3;box-shadow:0 2px 0 #1a2136;transform:none;cursor:default;}
.mini.grey{background:#3a4566;color:#b9c4e0;}
.pips{display:flex;gap:2px;}
.pips i{width:9px;height:5px;background:#2c3757;border:1px solid #000;}
.pips i.on{background:var(--gold);}

/* ---------- missions ---------- */
.mis{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--ink);
  box-shadow:0 3px 0 var(--ink);padding:9px;}
.mis .box{width:18px;height:18px;flex:0 0 auto;border:2px solid #000;background:#0f1730;display:grid;
  place-items:center;font-size:12px;color:#0b1020;font-weight:900;}
.mis.done .box{background:var(--green);}
.mis .txt{flex:1;min-width:0;}
.mis .t1{font-size:11.5px;font-weight:800;letter-spacing:-.2px;}
.mis .t2{font-size:9.5px;color:var(--dim);font-weight:700;margin-top:2px;}
.mis.done .t1{color:var(--green);}
.mis .bar{height:4px;background:#0f1730;border:1px solid #000;margin-top:4px;overflow:hidden;}
.mis .bar i{display:block;height:100%;background:var(--blue);width:0%;}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:22px;
  background:rgba(4,7,14,.72);}
.mbox{width:100%;max-width:330px;background:#18213c;border:3px solid var(--ink);
  box-shadow:0 6px 0 var(--ink);padding:16px 15px 14px;animation:pop .24s cubic-bezier(.2,1.2,.4,1) both;}
@keyframes pop{from{transform:scale(.88);opacity:0;}to{transform:none;opacity:1;}}
.mbox h2{margin:0 0 3px;font-size:15px;font-weight:800;letter-spacing:-.4px;color:#fff;}
.mbox .kick{font-size:8px;letter-spacing:2px;color:#7f92c4;font-weight:700;}
.mbox p{margin:8px 0 0;font-size:11.5px;line-height:1.6;color:#c3cfeb;letter-spacing:-.2px;}
.mbox .big{font-size:22px;font-weight:800;color:var(--gold);text-align:center;margin:12px 0 2px;
  letter-spacing:-.5px;}
.mbox ul{margin:8px 0 0;padding-left:16px;font-size:11px;line-height:1.75;color:#c3cfeb;}
.mbox .go{width:100%;margin-top:14px;font-family:inherit;font-size:13px;font-weight:800;color:#20160a;
  background:linear-gradient(#ffe1a0,#ffbe4d);border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);
  padding:11px;cursor:pointer;}
.mbox .go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}

.stamp{position:fixed;z-index:40;pointer-events:none;font-size:26px;font-weight:900;color:#ff5a5a;
  border:4px solid #ff5a5a;padding:2px 10px;transform:rotate(-11deg);opacity:0;
  text-shadow:2px 2px 0 rgba(0,0,0,.35);letter-spacing:2px;}
.stamp.go{animation:stampGo .62s cubic-bezier(.2,1.4,.4,1) forwards;}
@keyframes stampGo{
  0%{opacity:0;transform:rotate(-11deg) scale(2.4);}
  35%{opacity:1;transform:rotate(-11deg) scale(1);}
  70%{opacity:1;transform:rotate(-11deg) scale(1);}
  100%{opacity:0;transform:rotate(-11deg) scale(1.06) translateY(-8px);}
}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="hdr-l">
      <div class="kicker">HOWGROW AI · OFFICE</div>
      <h1>오늘도 바쁜 AI 사무실</h1>
    </div>
    <div class="hdr-r">
      <button id="muteBtn" class="iconbtn" aria-label="소리">🔊</button>
      <div class="badge">STAFF ×<span id="staffN">0</span></div>
    </div>
  </header>

  <div id="hud">
    <div class="hud-money"><span class="w">₩</span><span id="money">0</span></div>
    <div class="hud-mid">
      <div class="hud-line">
        <span id="ips">+0/초</span>
        <span class="hud-lv">Lv.<b id="lv">1</b> <span id="lvBonus"></span></span>
      </div>
      <div class="xpbar"><i id="xpfill"></i></div>
    </div>
  </div>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="toastLayer"></div>
  </main>

  <div id="quickbar">
    <button class="qbtn" id="quickApprove"><span>⚡ 빠른 결재</span><span class="cnt hidden" id="qCnt">0</span></button>
    <button class="qbtn alt" id="boostBtn"><span id="boostLabel">🔥 2배 부스트</span></button>
  </div>

  <nav id="tabs">
    <button data-tab="inbox"><span class="ico">📥</span>결재함<b class="hidden" id="tabInboxN">0</b></button>
    <button data-tab="staff"><span class="ico">🤖</span>직원</button>
    <button data-tab="shop"><span class="ico">🏢</span>시설</button>
    <button data-tab="mission"><span class="ico">✅</span>할 일</button>
  </nav>
</div>

<div id="sheetWrap" class="hidden">
  <div id="sheet">
    <div class="sheet-head">
      <div>
        <h2 id="sheetTitle">결재함</h2>
        <div class="sub" id="sheetSub"></div>
      </div>
      <button class="iconbtn" id="sheetClose" aria-label="닫기">✕</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="modal" class="hidden"></div>

<script>
(function(){
"use strict";

/* =========================================================
   오늘도 바쁜 AI 사무실 · AI Office Tycoon
   완전 오프라인 단일 파일 픽셀 게임
   ========================================================= */

var W = 200, H = 266;                       // 게임 논리 해상도(픽셀)
var SAVE_KEY = "aiOfficeTycoon.save.v1";
var MAXH = 8 * 3600;                        // 오프라인 정산 최대 8시간

function $(id){ return document.getElementById(id); }
function R(c, col, x, y, w, h){
  c.fillStyle = col;
  c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function won(n){
  n = Math.floor(n);
  var neg = n < 0; if(neg) n = -n;
  var s;
  if(n >= 100000000) s = (n / 100000000).toFixed(1).replace(/\.0$/,"") + "억";
  else if(n >= 10000) s = (n / 10000).toFixed(1).replace(/\.0$/,"") + "만";
  else s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-" : "") + s;
}

/* ------------------ 직원 정의 ------------------ */
var ROLES = [
  {id:"CS",     name:"미소", job:"고객 응대",   base:8,  body:"#5cc6e8", head:"#eaf6ff"},
  {id:"QUOTE",  name:"계상", job:"견적 산출",   base:10, body:"#ffb347", head:"#fff1d9"},
  {id:"REPORT", name:"차곡", job:"보고서 정리", base:12, body:"#8e7cff", head:"#eee9ff"},
  {id:"DATA",   name:"소리", job:"데이터 분석", base:15, body:"#5ad1a8", head:"#e3fff4"},
  {id:"BOOKING",name:"두리", job:"예약 접수",   base:18, body:"#ff8fa8", head:"#ffeaf0"},
  {id:"DOCS",   name:"영수", job:"문서 관리",   base:21, body:"#9dd4ff", head:"#e9f5ff"},
  {id:"COST",   name:"다온", job:"원가 계산",   base:25, body:"#7be08e", head:"#e9ffef"},
  {id:"PR",     name:"새봄", job:"홍보 문구",   base:29, body:"#ffd479", head:"#fffbe9"},
  {id:"DEV",    name:"하나", job:"개발",        base:34, body:"#6fa8ff", head:"#e9f0ff"},
  {id:"DESIGN", name:"마루", job:"디자인",      base:39, body:"#c98bff", head:"#f6ebff"},
  {id:"LEGAL",  name:"누리", job:"계약 검토",   base:45, body:"#b9c2cf", head:"#eff3f9"},
  {id:"HR",     name:"민서", job:"인사 관리",   base:52, body:"#ff9f7a", head:"#ffeee6"}
];
var DESK_COL = [4, 54, 104, 154];           // 4열 × 3줄 = 12석
var DESK_ROW = [112, 158, 204];
var DESK_W = 44, DESK_H = 16;
function deskOf(i){ return {x: DESK_COL[i % 4], y: DESK_ROW[Math.floor(i / 4)]}; }
function seatOf(i){ var d = deskOf(i); return {x: d.x + 22, y: d.y + 6}; }

/* ------------------ 시설 업그레이드 ------------------ */
var UPGRADES = [
  {id:"meeting",  name:"회의실 확장",     desc:"테이블이 길어지고 협업이 빨라져요.", mult:0.10, cost:1100, step:2.1, max:3},
  {id:"espresso", name:"에스프레소 머신", desc:"카페인은 곧 생산력입니다.",         mult:0.12, cost:900,  step:2.0, max:3},
  {id:"air",      name:"공기청정기",      desc:"맑은 공기, 맑은 정신.",             mult:0.08, cost:1500, step:2.0, max:3},
  {id:"server",   name:"AI 서버랙",       desc:"추론 속도가 쭉 올라가요.",          mult:0.18, cost:2600, step:2.2, max:3},
  {id:"plaque",   name:"황금 명패",       desc:"품격이 곧 영업이에요.",             mult:0.15, cost:4200, step:2.2, max:3}
];

/* ------------------ 결재 카드 (38종) ------------------ */
var CARDS = [
  ["QUOTE","견적 승인 요청","거래처에서 오늘 안으로 회신을 달래요. 단가를 확정해 주세요.",
    [["정가로 승인",240,16],["10% 할인",170,26],["일단 보류",70,8]]],
  ["CS","세 번째 전화예요","택배가 아직 안 왔다고 벌써 세 번째 전화가 왔어요.",
    [["사과 + 쿠폰",-80,24],["정중히 재안내",60,10],["대표님께 연결",30,16]]],
  ["REPORT","주간 보고서 마감","금요일 오후 6시까지 제출이에요. 어떤 형태로 갈까요?",
    [["깔끔하게 1장",200,18],["표로 정리",150,26],["다음 주로 미루기",40,4]]],

function buildMissions(round){
  return MDEF.map(function(d){
    var target = d.k === "earned"
      ? Math.round(d.base * Math.pow(2.3, round - 1))
      : Math.max(1, Math.round(d.base * Math.pow(1.7, round - 1)));
    return {k:d.k, target:target, got:false};
  });
}

function newState(){
  var st = {
    v:1, money:380, totalEarned:0, xp:0, level:1, approved:0, quick:0,
    staff:[], up:{}, inbox:[], ctr:{approved:0,hired:0,upgrade:0,earned:0,levelups:0,quick:0},
    mRound:1, missions:[], nextCardAt:0, muted:false, boostUntil:0, boostReadyAt:0,
    savedAt:Date.now(), intro:false
  };
  for(var i=0;i<12;i++) st.staff.push({hired:false, lv:1});
  for(var u=0;u<UPGRADES.length;u++) st.up[UPGRADES[u].id] = 0;
  st.missions = buildMissions(1);
  return st;
}

function save(){
  try{
    state.savedAt = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  }catch(e){}
}

function load(){
  var raw = null;
  try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){}
  if(!raw) return null;
  try{
    var st = JSON.parse(raw);
    if(!st || st.v !== 1) return null;
    var base = newState();
    for(var k in base){ if(!(k in st)) st[k] = base[k]; }
    if(!st.staff || st.staff.length !== 12) st.staff = base.staff;
    for(var u=0;u<UPGRADES.length;u++){ if(typeof st.up[UPGRADES[u].id] !== "number") st.up[UPGRADES[u].id] = 0; }
    if(!st.missions || !st.missions.length) st.missions = buildMissions(st.mRound||1);
    if(!st.inbox) st.inbox = [];
    if(!st.ctr) st.ctr = base.ctr;
    st.staff.forEach(function(s){ if(!s.lv) s.lv = 1; });
    return st;
  }catch(e){ return null; }
}

/* =========================================================
   효과음 (Web Audio · 8bit)
   ========================================================= */
var AC = null, soundOn = true;
function ac(){
  if(AC === null){
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ AC = false; }
  }
  if(AC && AC.state === "suspended" && AC.resume) AC.resume();
  return AC || null;
}
function tone(freq, dur, type, vol, when, slideTo){
  if(!soundOn) return;
  var a = ac(); if(!a) return;
  try{
    var t0 = a.currentTime + (when || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.10, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }catch(e){}
}
var SFX = {
  stamp:function(){ tone(300,0.05,"square",0.13,0,130); tone(110,0.13,"triangle",0.16,0.035,60); },
  coin:function(){ tone(1046,0.045,"square",0.09,0); tone(1568,0.09,"square",0.08,0.045); },
  hire:function(){ [523,659,784,1046].forEach(function(f,i){ tone(f,0.10,"square",0.09,i*0.065); }); },
  level:function(){ [659,880,1174].forEach(function(f,i){ tone(f,0.09,"square",0.085,i*0.055); }); },
  tap:function(){ tone(620,0.03,"square",0.05); },
  bad:function(){ tone(220,0.13,"sawtooth",0.09,0,110); },

};

   경제 계산
   ========================================================= */
function mult(){
  var m = 1 + (state.level - 1) * 0.04;
  for(var i=0;i<UPGRADES.length;i++) m += UPGRADES[i].mult * state.up[UPGRADES[i].id];
  return m;
}
function ips(now){
  var t = 0;
  for(var i=0;i<12;i++){
    if(state.staff[i].hired) t += ROLES[i].base * (1 + 0.35 * (state.staff[i].lv - 1));
  }
  t *= mult();
  if(now && now < state.boostUntil) t *= 2;
  return t;
}
function hiredCount(){ var n=0; for(var i=0;i<12;i++) if(state.staff[i].hired) n++; return n; }
function nextSlot(){ for(var i=0;i<12;i++) if(!state.staff[i].hired) return i; return -1; }
function hireCost(i){ return Math.round(150 * Math.pow(1.58, i)); }
function lvCost(i){
  var lv = state.staff[i].lv;
  if(lv >= 10) return Infinity;
  return Math.round(95 * Math.pow(1.72, lv - 1) * (1 + i * 0.12));
}
function needXp(lv){ return Math.round(110 * Math.pow(1.42, lv - 1)); }
function upCost(u){
  var lv = state.up[u.id];
  if(lv >= u.max) return Infinity;
  return Math.round(u.cost * Math.pow(u.step, lv));
}

function addXp(n){
  state.xp += n;
  var ups = 0;
  while(state.xp >= needXp(state.level) && state.level < 60){
    state.xp -= needXp(state.level);
    state.level++;
    ups++;
  }
  if(ups){
    SFX.level();
    toast("Lv." + state.level + " 달성! 수익 +" + (ups * 4) + "%", "gold");
  }
}

/* =========================================================
   결재 카드
   ========================================================= */
var CARD_CAP = 8;
function cardScale(){
  return 1 + state.approved * 0.035 + (state.level - 1) * 0.18;
}
function pickCardIndex(){
  var hired = [];
  for(var i=0;i<12;i++) if(state.staff[i].hired) hired.push(ROLES[i].id);
  if(hired.length && Math.random() < 0.62){
    var pool = [];
    for(var c=0;c<CARDS.length;c++) if(hired.indexOf(CARDS[c][0]) >= 0) pool.push(c);
    if(pool.length) return pool[Math.floor(Math.random()*pool.length)];
  }
  return Math.floor(Math.random() * CARDS.length);
}
function spawnCard(){
  if(state.inbox.length >= CARD_CAP) return null;
  var ci = pickCardIndex(), c = CARDS[ci];
  var card = {
    uid: ++uidC, ci: ci, from: c[0], title: c[1], desc: c[2], opts: c[3],
    scale: cardScale(), t: Date.now()
  };
  state.inbox.push(card);
  alertStaff(card.from);
  if(sheetKind === "inbox") renderSheet();
  updateBadges();
  return card;
}
function cardInterval(){
  var h = hiredCount();
  var avgLv = 0; for(var i=0;i<12;i++) if(state.staff[i].hired) avgLv += state.staff[i].lv;
  avgLv = h ? avgLv / h : 0;
  return Math.max(3.0, 9.6 - h * 0.42 - avgLv * 0.12);
}
function approveCard(card, oi, isQuick){
  var o = card.opts[oi];
  if(!o) return null;
  var gain = Math.round(o[1] * card.scale * (isQuick ? 0.8 : 1));
  var xp = Math.max(1, Math.round(o[2] * (1 + state.level * 0.05)));
  state.money = Math.max(0, state.money + gain);
  if(gain > 0){ state.totalEarned += gain; state.ctr.earned += gain; }
  state.approved++; state.ctr.approved++;
  if(isQuick){ state.quick++; state.ctr.quick++; }
  var idx = state.inbox.indexOf(card);
  if(idx >= 0) state.inbox.splice(idx, 1);
  addXp(xp);
  SFX.stamp();
  setTimeout(function(){ if(gain > 0) SFX.coin(); }, 90);
  return {gain:gain, xp:xp, label:o[0], from:card.from};
}

function hire(i){
  var c = hireCost(i);
  if(state.money < c) { SFX.bad(); return false; }
  if(i !== nextSlot()) { SFX.bad(); return false; }
  state.money -= c;
  state.staff[i].hired = true;
  state.staff[i].lv = 1;
  state.ctr.hired++;
  SFX.hire();
  spawnLive(i);
  bubblesFor(i, ROLES[i].name + " 합류!", 2600);
  drawBG();
  return true;
}
function levelUp(i){
  var c = lvCost(i), s = state.staff[i];
  if(!s.hired || s.lv >= 10) { SFX.bad(); return false; }
  if(state.money < c) { SFX.bad(); return false; }
  state.money -= c;
  s.lv++;
  state.ctr.levelups++;
  SFX.level();
  bubblesFor(i, "Lv." + s.lv + "! 힘낼게요!", 2400);
  return true;
}
function buyUp(u){
  var c = upCost(u), lv = state.up[u.id];
  if(lv >= u.max) { SFX.bad(); return false; }
  if(state.money < c) { SFX.bad(); return false; }
  state.money -= c;
  state.up[u.id] = lv + 1;
  state.ctr.upgrade++;
  SFX.hire();
  drawBG();
  toast(u.name + " Lv." + (lv + 1) + " 설치 완료!", "good");
  return true;
}

/* =========================================================
   미션
   ========================================================= */
function missionProg(m){ return state.ctr[m.k] || 0; }
function missionDone(m){ return missionProg(m) >= m.target; }
function claimMission(i){
  var m = state.missions[i];
  if(!m || m.got || !missionDone(m)) { SFX.bad(); return false; }
  var d = MDEF[i];
  var reward = Math.round(520 * Math.pow(1.95, (state.mRound - 1)) * d.rw);
  var xp = Math.round(28 * state.mRound);
  state.money += reward; state.totalEarned += reward; state.ctr.earned += reward;
  m.got = true;
  addXp(xp);
  SFX.hire();
  toast("미션 완료! +₩" + won(reward), "gold");
  if(state.missions.every(function(x){ return x.got; })){
    state.mRound++;
    state.ctr = {approved:0,hired:0,upgrade:0,earned:0,levelups:0,quick:0};
    state.missions = buildMissions(state.mRound);
    toast("새로운 할 일 목록 도착! ROUND " + state.mRound, "gold");
  }
  return true;
}

/* =========================================================
   활동 캐릭터
   ========================================================= */
var LANE = 100;
var TARGETS = [{x:147, y:100}, {x:40, y:98}];
var ceo = {x:148, y:64, bubble:"", bubUntil:0, next:6};
var ceoBob = false;

function aisleFor(i){
  var col = i % 4;
  return col === 0 ? 51 : (col === 1 ? 101 : 151);
}
function spawnLive(i){
  var s = seatOf(i);
  live[i] = {
    x:s.x, y:s.y, mode:"work", t:0, next:3 + Math.random() * 8,
    path:[], pi:0, spd:24 + Math.random() * 8, tick:Math.random() * 5,
    bubble:"", bubUntil:0, bubNext:2 + Math.random() * 5, hold:false
  };
}
function bubbleCount(){
  var n = 0, now = Date.now();
  for(var i = 0; i < 12; i++) if(live[i] && live[i].bubble && now < live[i].bubUntil) n++;
  if(ceo.bubble && now < ceo.bubUntil) n++;
  return n;
}
function bubblesFor(i, text, ms){
  var l = live[i]; if(!l) return;
  l.bubble = text; l.bubUntil = Date.now() + ms;
}

function updateActors(dt){
  var now = Date.now();
  for(var i = 0; i < 12; i++){
    var s = state.staff[i], l = live[i];
    if(!s.hired || !l) continue;
    l.tick += dt;
    var d = deskOf(i), seat = seatOf(i);

    if(l.mode === "work"){
      l.x = seat.x; l.y = seat.y;
      l.t += dt;
      if(l.t > l.next){
        l.t = 0;
        var tg = TARGETS[Math.random() < 0.55 ? 0 : 1];
        var ax = aisleFor(i);
        l.path = [
          {x:ax, y:seat.y},
          {x:ax, y:LANE},
          {x:tg.x, y:tg.y}
        ];
        l.pi = 0; l.mode = "walk"; l.hold = true;
        l.bubble = BUB_WALK[Math.floor(Math.random() * BUB_WALK.length)];
        l.bubUntil = now + 4000;
      } else if(now > l.bubNext && now > l.bubUntil){
        if(bubbleCount() >= 2){
          l.bubNext = now + 1800 + Math.random() * 3000;
        } else {
          var pool = (BUB[ROLES[i].id] || BUB_GEN).concat(BUB_GEN);
          l.bubble = pool[Math.floor(Math.random() * pool.length)];
          l.bubUntil = now + 2400 + Math.random() * 1800;
          l.bubNext = l.bubUntil + 2500 + Math.random() * 5000;
        }
      }
    } else if(l.mode === "walk"){
      var tgt = l.path[l.pi];
      if(!tgt){ l.mode = "work"; l.t = 0; l.next = 6 + Math.random() * 10; continue; }
      var dx = tgt.x - l.x, dy = tgt.y - l.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var step = l.spd * dt;
      if(dist <= step){
        l.x = tgt.x; l.y = tgt.y; l.pi++;
        if(l.pi >= l.path.length){
          l.mode = "deliver"; l.t = 0;
          l.bubble = "확인 부탁드려요!";
          l.bubUntil = now + 2400;
          l.next = 2.2 + Math.random() * 1.6;
        }
      } else {
        l.x += dx / dist * step;
        l.y += dy / dist * step;
      }
    } else if(l.mode === "deliver"){
      l.t += dt;
      if(l.t > l.next){
        l.t = 0;
        var ax2 = aisleFor(i);
        l.path = [
          {x:ax2, y:LANE},
          {x:ax2, y:seat.y},
          {x:seat.x, y:seat.y}
        ];
        l.pi = 0; l.mode = "walk"; l.hold = true;
      }
    }
    if(l.mode === "work") l.hold = false;
  }

  /* CEO */
  ceo.next -= dt;
  if(ceo.next <= 0){
    ceo.next = 8 + Math.random() * 9;
    if(bubbleCount() < 2){
      ceo.bubble = CEO_BUB[Math.floor(Math.random() * CEO_BUB.length)];
      ceo.bubUntil = Date.now() + 3000;
    }
  }
}

function outTxt(c, t, x, y, size, col, weight, align){

function bubbleBox(c, t, cx, cyBottom, size){
  c.font = '800 ' + size + "px " + fontStack;
  var w = c.measureText(t).width + 6;
  var h = size + 5;
  var x = cx - w / 2, y = cyBottom - h;
  if(x < 1) x = 1;
  if(x + w > W - 1) x = W - 1 - w;
  c.fillStyle = "rgba(10,14,26,.35)";
  c.fillRect(x + 1, y + 2, w, h);
  c.fillStyle = "#fffdf5";
  c.fillRect(x, y, w, h);
  c.strokeStyle = "#12182b"; c.lineWidth = 0.9;
  c.strokeRect(x + 0.45, y + 0.45, w - 0.9, h - 0.9);
  c.fillStyle = "#fffdf5";
  c.fillRect(cx - 1.6, y + h - 0.4, 3.2, 1.8);
  c.strokeStyle = "#12182b"; c.lineWidth = 0.9;
  c.beginPath();
  c.moveTo(cx - 1.6, y + h - 0.2); c.lineTo(cx - 1.6, y + h + 1.4);
  c.lineTo(cx + 1.6, y + h + 1.4); c.lineTo(cx + 1.6, y + h - 0.2);
  c.stroke();
  c.fillStyle = "#fffdf5"; c.fillRect(cx - 1.2, y + h - 0.6, 2.4, 1.4);
  txt(c, t, x + w / 2, y + h / 2 + 0.3, size, "#1a2030", 800);
}

function drawScene(){
  var c = ctx;
  var s = view.s;
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = "#080c16";
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(bgc, view.ox, view.oy, W * s, H * s);

  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(s, s);
  var now = Date.now();

  /* 회의실 · CEO 라벨 */
  txt(ctx, "MEETING", 6 + (58 + state.up.meeting * 10) / 2, 64, 4.2, "#ffe9c4", 800);
  txt(ctx, "CEO", 175, 69.6, 4.0, state.up.plaque > 0 ? "#5a3f06" : "#93a3b8", 800);

  /* 의자/책상 위 모니터 앞 직원 */
  var order = [];
  for(var i = 0; i < 12; i++) order.push(i);
  order.sort(function(a, b){
    var ya = live[a] ? live[a].y : deskOf(a).y;
    var yb = live[b] ? live[b].y : deskOf(b).y;
    return ya - yb;
  });

  /* 빈 책상 라벨 */
  for(var e = 0; e < 12; e++){
    if(!state.staff[e].hired){
      var dd = deskOf(e);
      txt(ctx, "채용", dd.x + 22, dd.y + 11.6, 3.8, "#d9a05c", 800);
    }
  }

  for(var o = 0; o < order.length; o++){
    var i2 = order[o];
    if(!state.staff[i2].hired || !live[i2]) continue;
    var l = live[i2];
    drawBot(ctx, l.x, l.y, ROLES[i2], state.staff[i2].lv, l.mode === "walk", l.tick);
    if(l.hold && l.mode === "walk") R(ctx, "#fffdf5", Math.round(l.x) + 5, Math.round(l.y) - 8, 4, 4);
  }

  /* 책상 본체 (직원 다리 가리기) */
  for(var f = 0; f < 12; f++) drawDeskFront(ctx, deskOf(f), state.staff[f].hired);

  /* 이름표 */
  for(var n = 0; n < 12; n++){
    if(!state.staff[n].hired || !live[n]) continue;
    var ln = live[n];
    outTxt(ctx, ROLES[n].name, ln.x, ln.y - 18, 5.0, "#ffffff", 800);
  }
  outTxt(ctx, "대표님", ceo.x, ceo.y - 20, 5.0, "#ffd479", 800);

  /* 책상 명패 */
  for(var p = 0; p < 12; p++){
    var dp = deskOf(p);
    if(state.staff[p].hired) txt(ctx, ROLES[p].id, dp.x + 24, dp.y + 13, 4.0, "#ffe9c4", 800);
  }

  /* 말풍선 */
  for(var m = 0; m < 12; m++){
    if(!state.staff[m].hired || !live[m]) continue;
    var lm = live[m];
    if(lm.bubble && now < lm.bubUntil) bubbleBox(ctx, lm.bubble, lm.x, lm.y - 20, 4.7);
  }
  if(ceo.bubble && now < ceo.bubUntil) bubbleBox(ctx, ceo.bubble, ceo.x, ceo.y - 22, 4.7);

  /* 부스트 오라 */
  if(now < state.boostUntil){
    var a = 0.10 + Math.sin(now / 180) * 0.05;
    ctx.fillStyle = "rgba(255,180,60," + a.toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

/* =========================================================
   UI: 토스트 · 모달 · 시트

function toast(t, kind){
  var layer = $("toastLayer");
  var el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = t;
  layer.appendChild(el);
  while(layer.children.length > 3) layer.removeChild(layer.firstChild);
  setTimeout(function(){
    el.classList.add("out");
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 320);
  }, 1600);
}
function showModal(html){
  $("modal").innerHTML = '<div class="mbox">' + html + '</div>';
  $("modal").classList.remove("hidden");
}
function hideModal(){ $("modal").classList.add("hidden"); }
function esc(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function roleById(id){
  for(var i = 0; i < ROLES.length; i++) if(ROLES[i].id === id) return ROLES[i];
  return ROLES[0];
}

var sheetKind = null;
function openSheet(kind){
  if(sheetKind === kind){ closeSheet(); return; }
  sheetKind = kind;
  $("sheetWrap").classList.remove("hidden");
  renderSheet();
  SFX.tap();
  updateTabs();
}
function closeSheet(){
  sheetKind = null;
  $("sheetWrap").classList.add("hidden");
  updateTabs();
}
function updateTabs(){
  var btns = document.querySelectorAll("#tabs button");
  for(var i = 0; i < btns.length; i++){
    btns[i].classList.toggle("on", btns[i].getAttribute("data-tab") === sheetKind);
  }
}

function renderSheet(){
  if(!sheetKind) return;
  var body = $("sheetBody"), title = $("sheetTitle"), sub = $("sheetSub");
  var html = "";

  if(sheetKind === "inbox"){
    title.textContent = "결재함";
    sub.textContent = "올라온 서류 " + state.inbox.length + "건 · 확인만 눌러 주세요";
    if(!state.inbox.length){
      html = '<div class="empty">결재할 서류가 없어요.<br>직원들이 곧 올려요!<br><br>· 빠른 결재로 한 번에 처리할 수 있어요</div>';
    } else {
      state.inbox.forEach(function(card){
        var ro = roleById(card.from);
        html += '<div class="card"><div class="top"><span class="chip" style="background:' + ro.body + '">' + esc(card.from) + '</span>';
        html += '<h3>' + esc(card.title) + '</h3></div><p>' + esc(card.desc) + '</p><div class="opts">';
        card.opts.forEach(function(o, i){
          var m = Math.round(o[1] * card.scale);
          var xp = Math.round(o[2] * (1 + state.level * 0.05));
          html += '<button class="opt" data-act="approve" data-uid="' + card.uid + '" data-oi="' + i + '">';
          html += '<span class="lbl">' + esc(o[0]) + '</span>';
          html += '<span class="rw"><span class="m">' + (m < 0 ? "-" : "+") + "₩" + won(Math.abs(m)) + '</span> ';
          html += '<span class="x">+' + xp + 'XP</span></span></button>';
        });
        html += '</div></div>';
      });
    }
  } else if(sheetKind === "staff"){
    var n = hiredCount();
    title.textContent = "AI 직원";
    sub.textContent = n + " / 12명 근무 중 · 총 " + won(ips()) + "원/초";
    var ns = nextSlot();
    for(var i = 0; i < 12; i++){
      var s = state.staff[i], ro = ROLES[i];
      var lock = !s.hired && i !== ns;
      html += '<div class="row' + (lock ? " locked" : "") + '">';
      html += '<div class="swatch" style="background:' + ro.body + '"></div>';
      html += '<div class="meta"><div class="nm">' + ro.name + (s.hired ? '<em>Lv.' + s.lv + '</em>' : '') + '</div>';
      html += '<div class="jb">' + ro.job + " · " + ro.id + '</div>';
      if(s.hired){
        html += '<div class="inc">+' + won(ro.base * (1 + 0.35 * (s.lv - 1)) * mult()) + '/초</div>';
      }
      html += '</div><div class="act">';
      if(!s.hired){
        html += '<button class="mini" data-act="hire" data-i="' + i + '"' + (lock ? " disabled" : "") + '>₩' + won(hireCost(i)) + " 채용</button>";
      } else if(s.lv >= 10){
        html += '<span style="font-size:9px;color:#7be08e;font-weight:800">MAX</span>';
      } else {
        html += '<div class="pips">';
        var pl = Math.min(10, s.lv);
        for(var q = 0; q < 10; q++) html += '<i class="' + (q < pl ? "on" : "") + '"></i>';
        html += '</div>';
        html += '<button class="mini blue" data-act="lvup" data-i="' + i + '">₩' + won(lvCost(i)) + " 레벨업</button>";
      }
      html += '</div></div>';
    }
  } else if(sheetKind === "shop"){
    title.textContent = "사무실 시설";
    sub.textContent = "전체 수익 배율 ×" + mult().toFixed(2);
    UPGRADES.forEach(function(u){
      var lv = state.up[u.id], c = upCost(u), maxed = lv >= u.max;
      html += '<div class="row"><div class="swatch" style="background:#ffd479"></div>';
      html += '<div class="meta"><div class="nm">' + u.name + '<em>Lv.' + lv + '</em></div>';
      html += '<div class="jb">' + u.desc + '</div>';
      html += '<div class="inc">수익 +' + Math.round(u.mult * 100) + '% / 단계</div></div><div class="act">';
      html += '<div class="pips">';
      for(var k = 0; k < u.max; k++) html += '<i class="' + (k < lv ? "on" : "") + '"></i>';
      html += '</div>';
      if(maxed) html += '<span style="font-size:9px;color:#7be08e;font-weight:800">MAX</span>';
      else html += '<button class="mini" data-act="buy" data-id="' + u.id + '">₩' + won(c) + " 설치</button>";
      html += '</div></div>';
    });
  } else if(sheetKind === "mission"){
    title.textContent = "오늘 할 일";
    sub.textContent = "ROUND " + state.mRound + " · 달성하면 보너스";
    state.missions.forEach(function(m, i){
      var d = MDEF[i], prog = missionProg(m), done = prog >= m.target;
      var pct = Math.min(100, Math.round(prog / m.target * 100));
      html += '<div class="mis' + (m.got ? " done" : "") + '" data-mi="' + i + '">';
      html += '<div class="box">' + (m.got ? "✓" : "") + '</div>';
      html += '<div class="txt"><div class="t1">' + d.t(m.target) + '</div>';
      html += '<div class="t2" data-mi-t="' + i + '">' + won(Math.min(prog, m.target)) + ' / ' + won(m.target) + ' · 보상 ₩' + won(Math.round(520 * Math.pow(1.95, state.mRound - 1) * d.rw)) + '</div>';
      html += '<div class="bar"><i data-mi-bar="' + i + '" style="width:' + pct + '%"></i></div></div>';
      if(!m.got) html += '<button class="mini" data-act="claim" data-i="' + i + '"' + (done ? "" : " disabled") + '>받기</button>';
      else html += '<span style="font-size:9px;color:#7be08e;font-weight:800">완료</span>';
      html += '</div>';
    });
  }
  body.innerHTML = html;
}

function refreshLive(){
  if(!sheetKind) return;
  var i, k, el;
  if(sheetKind === "staff"){
    var btns = document.querySelectorAll('#sheetBody [data-act="hire"], #sheetBody [data-act="lvup"]');
    for(i = 0; i < btns.length; i++){
      var b = btns[i], idx = parseInt(b.getAttribute("data-i"), 10);
      var isHire = b.getAttribute("data-act") === "hire";
      var cost = isHire ? hireCost(idx) : lvCost(idx);
      b.disabled = (isHire && idx !== nextSlot()) || state.money < cost;
    }
    var sb = $("sheetSub");
    if(sb) sb.textContent = hiredCount() + " / 12명 근무 중 · 총 " + won(ips()) + "원/초";
  } else if(sheetKind === "shop"){
    var ub = document.querySelectorAll('#sheetBody [data-act="buy"]');
    for(i = 0; i < ub.length; i++){
      var id = ub[i].getAttribute("data-id"), uu = null;
      for(k = 0; k < UPGRADES.length; k++) if(UPGRADES[k].id === id) uu = UPGRADES[k];
      if(uu) ub[i].disabled = state.money < upCost(uu);
    }
  } else if(sheetKind === "mission"){
    for(i = 0; i < state.missions.length; i++){
      var m = state.missions[i], d = MDEF[i];
      var prog = missionProg(m), done = prog >= m.target;
      var t = document.querySelector('[data-mi-t="' + i + '"]');
      if(t) t.textContent = won(Math.min(prog, m.target)) + " / " + won(m.target) +
        " · 보상 ₩" + won(Math.round(520 * Math.pow(1.95, state.mRound - 1) * d.rw));
      var bar = document.querySelector('[data-mi-bar="' + i + '"]');
      if(bar) bar.style.width = Math.min(100, Math.round(prog / m.target * 100)) + "%";
      var cb = document.querySelector('#sheetBody [data-act="claim"][data-i="' + i + '"]');
      if(cb) cb.disabled = !done;
    }
  }
}

function updateBadges(){
  $("staffN").textContent = hiredCount();
  var n = state.inbox.length;
  $("tabInboxN").textContent = n;
  $("tabInboxN").classList.toggle("hidden", !n);
  $("qCnt").textContent = n;
  $("qCnt").classList.toggle("hidden", !n);
  $("quickApprove").disabled = n === 0;
}

function stampAt(x, y, text){
  var el = document.createElement("div");
  el.className = "stamp";
  el.textContent = text;
  el.style.left = Math.max(4, Math.min(window.innerWidth - 150, x - 56)) + "px";
  el.style.top = Math.max(40, y - 26) + "px";
  document.body.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add("go"); });
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 700);
}

   입력
   ========================================================= */
function wireUI(){
  $("tabs").addEventListener("click", function(e){
    var b = e.target.closest("button[data-tab]");
    if(!b) return;
    openSheet(b.getAttribute("data-tab"));
  });
  $("sheetClose").addEventListener("click", closeSheet);
  $("sheetWrap").addEventListener("click", function(e){
    if(e.target === $("sheetWrap")) closeSheet();
  });
  $("modal").addEventListener("click", function(e){
    if(e.target.closest("[data-close]")) hideModal();
  });

  $("sheetBody").addEventListener("click", function(e){
    var btn = e.target.closest("[data-act]");
    if(!btn || btn.disabled) return;
    var act = btn.getAttribute("data-act");
    var r = btn.getBoundingClientRect();
    if(act === "approve"){
      var uid = parseInt(btn.getAttribute("data-uid"), 10);
      var oi = parseInt(btn.getAttribute("data-oi"), 10);
      var card = null;
      for(var i = 0; i < state.inbox.length; i++) if(state.inbox[i].uid === uid) card = state.inbox[i];
      if(!card) return;
      var res = approveCard(card, oi, false);
      if(res){
        stampAt(r.left + r.width / 2, r.top + r.height / 2, "승인");
        toast((res.gain >= 0 ? "+" : "") + "₩" + won(res.gain) + " · +" + res.xp + "XP", res.gain >= 0 ? "good" : "bad");
        renderSheet();
        updateBadges();
        save();
      }
    } else if(act === "hire"){
      var hi = parseInt(btn.getAttribute("data-i"), 10);
      if(hire(hi)){
        toast(ROLES[hi].name + " 채용 완료! 함께 일해요", "good");
        renderSheet(); updateBadges(); save();
      } else toast("자금이 부족해요", "bad");
    } else if(act === "lvup"){
      var li = parseInt(btn.getAttribute("data-i"), 10);
      if(levelUp(li)){
        toast(ROLES[li].name + " Lv." + state.staff[li].lv + " 달성!", "good");
        renderSheet(); save();
      } else toast("자금이 부족해요", "bad");
    } else if(act === "buy"){
      var uid2 = btn.getAttribute("data-id");
      var up = null;
      for(var u = 0; u < UPGRADES.length; u++) if(UPGRADES[u].id === uid2) up = UPGRADES[u];
      if(up && buyUp(up)){ renderSheet(); save(); }
      else if(up) toast("자금이 부족해요", "bad");
    } else if(act === "claim"){
      var mi = parseInt(btn.getAttribute("data-i"), 10);
      if(claimMission(mi)){ renderSheet(); save(); }
    }
  });

  $("quickApprove").addEventListener("click", function(){
    if(!state.inbox.length){ SFX.bad(); return; }
    var card = state.inbox[0];
    var res = approveCard(card, 0, true);
    var b = $("quickApprove").getBoundingClientRect();
    stampAt(b.left + b.width / 2, b.top - 30, "승인");
    if(res) toast("빠른 결재 · +₩" + won(res.gain) + " · +" + res.xp + "XP", "good");
    if(sheetKind === "inbox") renderSheet();
    updateBadges();
    save();
  });

  $("boostBtn").addEventListener("click", function(){ startBoost(); });

  $("muteBtn").addEventListener("click", function(){
    state.muted = !state.muted;
    soundOn = !state.muted;
    $("muteBtn").textContent = state.muted ? "🔇" : "🔊";
    if(!state.muted) SFX.tap();
    save();
  });

  cv.addEventListener("click", function(ev){
    var rect = cv.getBoundingClientRect();
    var lx = (ev.clientX - rect.left - view.ox) / view.s;
    var ly = (ev.clientY - rect.top - view.oy) / view.s;
    for(var i = 0; i < 12; i++){
      if(!state.staff[i].hired || !live[i]) continue;
      var l = live[i];
      if(Math.abs(lx - l.x) < 8 && ly > l.y - 24 && ly < l.y + 3){
        toast(ROLES[i].name + " · " + ROLES[i].job + " · Lv." + state.staff[i].lv + " · +" + won(ROLES[i].base * (1 + 0.35 * (state.staff[i].lv - 1)) * mult()) + "/초");
        live[i].bubble = (state.inbox.length ? "결재 부탁드려요!" : "열심히 일할게요!");
        live[i].bubUntil = Date.now() + 2500;
        SFX.tap();
        return;
      }
    }
    if(lx > 94 && lx < 174 && ly > 50 && ly < 82){
      openSheet("inbox");
      return;
    }
    for(var k = 0; k < 12; k++){
      var d = deskOf(k);
      if(lx >= d.x - 2 && lx <= d.x + 50 && ly >= d.y - 12 && ly <= d.y + 24){
        if(!state.staff[k].hired) openSheet("staff");
        else openSheet("staff");
        return;
      }
    }
  });

  document.addEventListener("visibilitychange", function(){
    if(document.hidden) save();
  });
  window.addEventListener("pagehide", save);
  window.addEventListener("resize", function(){ resize(); });
  window.addEventListener("orientationchange", function(){ setTimeout(resize, 220); });
}

/* =========================================================
   루프
   ========================================================= */
var lastT = 0, saveAcc = 0, hudAcc = 0;

function tick(dt){
  var now = Date.now();
  var gain = ips(now) * dt;
  if(gain > 0){
    state.money += gain;
    state.totalEarned += gain;
    state.ctr.earned += gain;
  }
  if(now >= state.nextCardAt){
    spawnCard();
    state.nextCardAt = now + cardInterval() * 1000;
  }
  updateActors(dt);
}

function updateHUD(now){
  $("money").textContent = won(state.money);
  $("ips").textContent = "+" + won(ips(now)) + "/초" + (now < state.boostUntil ? " ×2" : "");
  $("lv").textContent = state.level;
  var need = needXp(state.level);
  $("xpfill").style.width = Math.min(100, state.xp / need * 100) + "%";
  if(now < state.boostUntil){
    $("boostLabel").textContent = "🔥 부스트 " + Math.ceil((state.boostUntil - now) / 1000) + "초";
    $("boostBtn").disabled = true;
  } else if(now < state.boostReadyAt){
    $("boostLabel").textContent = "🔥 대기 " + Math.ceil((state.boostReadyAt - now) / 1000) + "초";
    $("boostBtn").disabled = true;
  } else {
    $("boostLabel").textContent = "🔥 2배 부스트";
    $("boostBtn").disabled = false;
  }
}

function loop(ts){
  requestAnimationFrame(loop);
  if(!lastT) lastT = ts;
  var dt = Math.min(0.12, Math.max(0, (ts - lastT) / 1000));
  lastT = ts;
  tick(dt);
  var nb = (Math.floor(Date.now() / 560) % 2) === 0;
  if(nb !== ceoBob){ ceoBob = nb; drawBG(); }
  drawScene();
  hudAcc += dt;
  if(hudAcc > 0.1){ hudAcc = 0; updateHUD(Date.now()); }
  saveAcc += dt;
  if(saveAcc > 6){ saveAcc = 0; save(); }
  refreshAcc += dt;
  if(refreshAcc > 0.5){ refreshAcc = 0; refreshLive(); }
}
var refreshAcc = 0;

/* =========================================================
   시작
   ========================================================= */
function init(){
  var loaded = load();
  var offlineGain = 0, away = 0;
  if(loaded){
    state = loaded;
    away = (Date.now() - (state.savedAt || Date.now())) / 1000;
    if(away > 60 && state.staff.some(function(s){ return s.hired; })){
      offlineGain = ips() * Math.min(away, MAXH) * 0.5;
      if(offlineGain < 1) offlineGain = 0;
    }
    state.money += offlineGain;
    if(offlineGain > 0){ state.totalEarned += offlineGain; }
    state.savedAt = Date.now();
    if(!state.nextCardAt || state.nextCardAt < Date.now() - 60000) state.nextCardAt = Date.now() + 4000;
  } else {
    state = newState();
    state.nextCardAt = Date.now() + 5000;
  }
  soundOn = !state.muted;
  $("muteBtn").textContent = state.muted ? "🔇" : "🔊";

  for(var i = 0; i < 12; i++) if(state.staff[i].hired) spawnLive(i);
  drawBG();
  resize();
  wireUI();
  updateBadges();
  updateHUD(Date.now());
  requestAnimationFrame(loop);

  setTimeout(function(){
    if(!state.intro){
      state.intro = true; save();
      showModal(
        '<div class="kick">HOWGROW AI · OFFICE</div>' +
        '<h2>오늘도 바쁜 AI 사무실</h2>' +
        '<p>대표님, 오늘도 혼자 다 하실 건가요?<br>AI 직원을 채용하고, 결재만 눌러 주세요.</p>' +
        '<ul>' +
        '<li>📥 <b>결재함</b> — 올라온 서류를 확인</li>' +
        '<li>🤖 <b>직원</b> — 채용하고 레벨업</li>' +
        '<li>🏢 <b>시설</b> — 사무실 업그레이드</li>' +
        '<li>✅ <b>할 일</b> — 미션 달성 보너스</li>' +
        '</ul>' +
        '<p style="font-size:10px;opacity:.65">진행 상황은 자동으로 저장돼요.</p>' +
        '<button class="go" data-close>사무실 열기</button>'
      );
    } else if(offlineGain > 0){
      var hh = Math.floor(away / 3600), mm = Math.floor((away % 3600) / 60);
      showModal(
        '<div class="kick">OFFLINE REPORT</div>' +
        '<h2>자리를 비운 사이</h2>' +
        '<p>직원들이 열심히 일했어요. (' + (hh ? hh + "시간 " : "") + mm + "분)" +
        (away > MAXH ? "<br><span style=\"opacity:.6\">최대 8시간까지만 정산돼요</span>" : "") + '</p>' +
        '<div class="big">+₩' + won(offlineGain) + '</div>' +
        '<p style="text-align:center;font-size:10px;opacity:.65">보관함에 자동으로 들어갔어요</p>' +
        '<button class="go" data-close>확인</button>'
      );
      SFX.coin();
    }
  }, 420);
}

init();
})();
</script>
