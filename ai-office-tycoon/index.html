<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#131a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>오늘도 바쁜 AI 사무실 · 도트 오피스 타이쿤</title>
<style>
:root{
  --ink:#0a0e1a; --panel:#1c2542; --panel2:#27335c; --panel3:#33406e;
  --gold:#ffd479; --green:#7be08e; --red:#ff7a7a; --blue:#5cc6e8; --violet:#a98bff;
  --txt:#eaf0ff; --dim:#93a4cf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0f1c;overscroll-behavior:none;}
body{
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--txt);user-select:none;-webkit-user-select:none;touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}
#app{
  position:fixed;inset:0;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
  background:radial-gradient(130% 70% at 50% 0%,#2a3563 0%,#171f38 48%,#0a0e1a 100%);
}

/* ---------- header ---------- */
#hdr{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 10px 5px;flex:0 0 auto;}
.hdr-l{min-width:0;}
.kicker{font-size:8px;letter-spacing:1.6px;font-weight:700;color:#7f92c4;line-height:1;}
h1{margin:3px 0 0;font-size:15px;font-weight:800;letter-spacing:-.4px;color:#fff;line-height:1.1;
   text-shadow:2px 2px 0 #05070f;white-space:nowrap;}
.hdr-r{display:flex;align-items:center;gap:5px;flex:0 0 auto;}
.badge{font-family:inherit;font-size:9px;font-weight:800;letter-spacing:.2px;background:var(--panel2);color:var(--gold);
  border:2px solid var(--ink);padding:3px 6px;box-shadow:0 2px 0 var(--ink);white-space:nowrap;}
button.badge{cursor:pointer;}
button.badge:active{transform:translateY(2px);box-shadow:none;}
.badge.rival{color:#ffb3b3;background:#3a2030;}
.iconbtn{width:30px;height:28px;display:grid;place-items:center;font-size:13px;background:var(--panel2);
  color:var(--txt);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);padding:0;cursor:pointer;line-height:1;}
.iconbtn:active{transform:translateY(2px);box-shadow:none;}

/* ---------- hud ---------- */
#hud{display:flex;align-items:center;gap:8px;margin:0 8px 4px;padding:5px 9px;background:var(--panel);
  border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);flex:0 0 auto;}
.hud-money{display:flex;align-items:baseline;gap:2px;min-width:0;}
.hud-money .w{font-size:11px;font-weight:800;color:var(--gold);opacity:.85;}
#money{font-size:16px;font-weight:800;color:var(--gold);letter-spacing:.3px;white-space:nowrap;
  font-variant-numeric:tabular-nums;}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.hud-line{display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
#ips{font-size:10px;font-weight:800;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hud-lv{font-size:9px;font-weight:800;color:var(--dim);white-space:nowrap;}
.hud-lv b{color:#fff;}
.xpbar{height:5px;background:#0f1730;border:1px solid #000;overflow:hidden;}
.xpbar i{display:block;height:100%;width:0%;background:linear-gradient(#ffe9a8,var(--gold));transition:width .25s linear;}

/* ---------- floor bar ---------- */
#floorbar{display:flex;gap:4px;padding:0 8px 4px;flex:0 0 auto;}
#floorbar button{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:3px;
  font-family:inherit;font-size:10.5px;font-weight:800;letter-spacing:-.3px;color:var(--dim);
  background:var(--panel);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);
  padding:6px 2px;cursor:pointer;line-height:1;}
#floorbar button i{font-style:normal;font-size:8px;font-weight:800;color:#7f8dc0;}
#floorbar button.on{color:#20160a;background:linear-gradient(#ffe1a0,#ffc663);}
#floorbar button.on i{color:#5a4310;}
#floorbar button.lock{color:#7c88ad;background:#1a2338;}
#floorbar button.lock i{color:#6b7699;}
#floorbar button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);}

/* ---------- crisis strip ---------- */
#crisis{flex:0 0 auto;margin:0 8px 5px;padding:6px 8px 7px;background:linear-gradient(#4a1c28,#33141d);
  border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);animation:criIn .22s ease-out both;}
@keyframes criIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
#crisis.rival{background:linear-gradient(#2a2450,#1d1a3a);}
#crisis.calm{background:linear-gradient(#1e3a2c,#152a21);}
.cri-h{display:flex;align-items:center;gap:5px;margin-bottom:3px;}
.cri-tag{font-size:8px;font-weight:800;color:#2a0a0a;background:var(--red);border:1px solid #000;padding:1px 4px;white-space:nowrap;}
#crisis.rival .cri-tag{background:#a98bff;}
#crisis.calm .cri-tag{background:var(--green);}
#criTitle{flex:1;font-size:11.5px;font-weight:800;letter-spacing:-.3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#criTime{font-size:10px;font-weight:800;color:#ffd479;font-variant-numeric:tabular-nums;}
.cri-d{font-size:9.5px;line-height:1.35;color:#e6d2d8;margin-bottom:4px;letter-spacing:-.2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cri-bar{height:4px;background:#0f1730;border:1px solid #000;margin-bottom:5px;overflow:hidden;}
.cri-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff9f9f,#ffd479);}
.cri-o{display:flex;gap:4px;}
.cri-o button{flex:1;min-width:0;font-family:inherit;font-size:9.5px;font-weight:800;letter-spacing:-.3px;
  color:#20160a;background:linear-gradient(#ffe1a0,#ffbe4d);border:2px solid var(--ink);
  box-shadow:0 2px 0 var(--ink);padding:6px 3px;cursor:pointer;line-height:1.15;}
.cri-o button .eff{display:block;font-size:8px;font-weight:700;opacity:.72;margin-top:1px;}
.cri-o button:active{transform:translateY(2px);box-shadow:none;}
.cri-o button[disabled]{background:#3a4463;color:#8892b0;cursor:default;}

/* ---------- stage ---------- */
#stage{position:relative;flex:1 1 auto;margin:0 6px;min-height:0;overflow:hidden;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;
  image-rendering:crisp-edges;}
#toastLayer{position:absolute;left:0;right:0;top:6px;display:flex;flex-direction:column;align-items:center;
  gap:4px;pointer-events:none;z-index:6;}
.toast{font-size:11px;font-weight:800;padding:5px 10px;background:rgba(16,22,40,.94);color:#fff;
  border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);animation:toastIn .22s ease-out both;max-width:96%;}
.toast.good{color:var(--green);border-color:#0a1a10;background:rgba(14,34,24,.96);}
.toast.bad{color:var(--red);}
.toast.gold{color:var(--gold);background:rgba(40,32,10,.96);}
@keyframes toastIn{from{opacity:0;transform:translateY(-6px) scale(.96);}to{opacity:1;transform:none;}}
.toast.out{animation:toastOut .3s ease-in forwards;}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px);}}

.meetbadge{position:absolute;right:7px;bottom:7px;z-index:7;display:flex;align-items:center;gap:4px;
  font-family:inherit;font-size:10.5px;font-weight:800;color:#20160a;
  background:linear-gradient(#ffe1a0,#ffbe4d);border:2px solid var(--ink);
  box-shadow:0 3px 0 var(--ink);padding:6px 9px;cursor:pointer;line-height:1;
  animation:mbPulse 1.6s ease-in-out infinite;}
@keyframes mbPulse{50%{transform:translateY(-2px);}}
.meetbadge:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);}

/* ---------- quickbar ---------- */
#quickbar{display:flex;gap:6px;padding:6px 8px 4px;flex:0 0 auto;}
.qbtn{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:5px;
  font-family:inherit;font-size:12px;font-weight:800;letter-spacing:-.2px;color:#20160a;
  background:linear-gradient(#ffe1a0,#ffbe4d);border:2px solid var(--ink);
  box-shadow:0 4px 0 var(--ink);padding:9px 4px;cursor:pointer;}
.qbtn.alt{background:linear-gradient(#b7e7ff,#63c2ee);color:#08202c;}
.qbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.qbtn[disabled]{background:#3a4463;color:#8892b0;box-shadow:0 4px 0 #1a2136;cursor:default;transform:none;}
.qbtn .cnt{position:absolute;top:-6px;right:-4px;min-width:17px;height:16px;font-size:9px;line-height:14px;
  text-align:center;background:var(--red);color:#fff;border:2px solid var(--ink);padding:0 3px;}

/* ---------- tabs ---------- */
#tabs{display:flex;gap:3px;padding:4px 6px calc(6px + env(safe-area-inset-bottom,0px));flex:0 0 auto;}
#tabs button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;
  font-family:inherit;font-size:9.5px;font-weight:800;color:var(--dim);background:var(--panel);
  border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:6px 1px 5px;cursor:pointer;
  letter-spacing:-.4px;}
#tabs button .ico{font-size:12px;line-height:1;}
#tabs button.on{color:#20160a;background:linear-gradient(#ffe1a0,#ffc663);}
#tabs button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);}
#tabs button b{position:absolute;top:-6px;right:-3px;min-width:16px;height:16px;font-size:8px;line-height:14px;
  text-align:center;background:var(--red);color:#fff;border:2px solid var(--ink);padding:0 3px;}
.hidden{display:none !important;}

/* ---------- sheet ---------- */
#sheetWrap{position:fixed;left:0;right:0;top:0;bottom:var(--tabh,54px);z-index:20;display:flex;
  flex-direction:column;justify-content:flex-end;background:rgba(4,7,14,.55);
  animation:fade .18s ease-out both;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
#sheet{background:#151d34;border-top:3px solid var(--ink);max-height:100%;
  display:flex;flex-direction:column;box-shadow:0 -4px 0 rgba(0,0,0,.5);
  padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s cubic-bezier(.2,.9,.3,1) both;}
@keyframes up{from{transform:translateY(30px);}to{transform:none;}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 8px;
  border-bottom:2px solid #0a1024;background:#1a2440;}
.sheet-head h2{margin:0;font-size:13px;font-weight:800;letter-spacing:-.3px;}
.sheet-head .sub{font-size:9px;color:var(--dim);font-weight:700;margin-top:2px;}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 14px;display:flex;
  flex-direction:column;gap:8px;}

/* ---------- cards ---------- */
.card{background:var(--panel);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:9px 10px;
  animation:cardIn .22s ease-out both;}
@keyframes cardIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.card .top{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.chip{font-size:8px;font-weight:800;letter-spacing:.2px;padding:2px 5px;color:#0b1020;border:1px solid #000;
  white-space:nowrap;}
.card h3{margin:0;font-size:12.5px;font-weight:800;letter-spacing:-.3px;line-height:1.2;flex:1;}
.card p{margin:0 0 6px;font-size:11px;line-height:1.45;color:#c3cfeb;letter-spacing:-.2px;}
.lineup{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:7px;}
.tag{font-size:8.5px;font-weight:800;padding:2px 5px;color:#0b1020;border:1px solid #000;white-space:nowrap;}
.tag.dark{background:#39435f;color:#c7d2ec;}
.opts{display:flex;flex-direction:column;gap:5px;}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:inherit;
  font-size:11.5px;font-weight:700;text-align:left;color:var(--txt);background:var(--panel2);
  border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:8px 9px;cursor:pointer;line-height:1.2;}
.opt .lbl{flex:1;}
.opt .rw{font-size:10px;font-weight:800;white-space:nowrap;}
.opt .rw .m{color:var(--gold);}
.opt .rw .x{color:var(--blue);}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);background:#31407a;}
.empty{text-align:center;font-size:11px;color:var(--dim);padding:26px 12px;line-height:1.6;}

/* ---------- staff / shop rows ---------- */
.row{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--ink);
  box-shadow:0 3px 0 var(--ink);padding:8px 9px;}
.row.locked{opacity:.55;}
.swatch{width:22px;height:22px;flex:0 0 auto;border:2px solid var(--ink);position:relative;overflow:hidden;}
.swatch:after{content:"";position:absolute;left:3px;top:4px;width:16px;height:5px;background:rgba(10,14,26,.55);}
.row .meta{flex:1;min-width:0;}
.row .nm{font-size:12px;font-weight:800;letter-spacing:-.2px;}
.row .nm .rk{font-size:10px;font-weight:800;}
.row .nm em{font-style:normal;font-size:9px;font-weight:800;color:var(--gold);margin-left:4px;}
.row .jb{font-size:10px;color:var(--dim);font-weight:700;margin-top:1px;}
.row .inc{font-size:10px;font-weight:800;color:var(--green);margin-top:2px;}
.row .scope{font-size:9px;font-weight:800;color:#9fb0c7;margin-top:1px;}
.row .act{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.mini{font-family:inherit;font-size:10.5px;font-weight:800;color:#20160a;background:linear-gradient(#ffe1a0,#ffc04d);
  border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);padding:6px 8px;cursor:pointer;line-height:1;white-space:nowrap;}
.mini:active{transform:translateY(2px);box-shadow:none;}
.mini.blue{background:linear-gradient(#bfe9ff,#6cc6ee);color:#08202c;}
.mini.purple{background:linear-gradient(#e2d6ff,#b79bff);color:#150a2c;}
.mini[disabled]{background:#39435f;color:#8b95b3;box-shadow:0 2px 0 #1a2136;transform:none;cursor:default;}
.mini.grey{background:#3a4566;color:#b9c4e0;}
.mini.wide{width:100%;}
.pips{display:flex;gap:2px;}
.pips i{width:9px;height:5px;background:#2c3757;border:1px solid #000;}
.pips i.on{background:var(--gold);}

/* dept block */
.dept{background:#18213a;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:8px 8px 9px;
  display:flex;flex-direction:column;gap:6px;}
.dept-h{display:flex;align-items:center;gap:6px;}
.dept-h .dt{width:5px;height:16px;flex:0 0 auto;border:1px solid #000;}
.dept-h .dn{font-size:12px;font-weight:800;letter-spacing:-.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dept-h .dc{font-size:9px;font-weight:800;color:#9fb0c7;white-space:nowrap;}
.dept-h .di{font-size:9.5px;font-weight:800;color:var(--green);white-space:nowrap;}
.dept .emp{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid #0a1024;padding:5px 6px;}
.dept .emp .sw{width:14px;height:14px;flex:0 0 auto;border:1px solid #000;}
.dept .emp .em{flex:1;min-width:0;}
.dept .emp .en{font-size:10.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dept .emp .en .rk{font-size:9px;font-weight:800;}
.dept .emp .ei{font-size:8.5px;font-weight:800;color:var(--green);}
.dept .emp .ea{display:flex;gap:3px;flex:0 0 auto;}
.dept .emp .ea button{font-size:9px;padding:4px 5px;}
.dept .free{display:flex;align-items:center;gap:6px;background:#101827;border:2px dashed #2c3757;padding:5px 6px;}
.dept .free span{flex:1;font-size:9.5px;font-weight:800;color:#7f8db0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ---------- missions ---------- */
.mis{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--ink);
  box-shadow:0 3px 0 var(--ink);padding:9px;}
.mis .box{width:18px;height:18px;flex:0 0 auto;border:2px solid #000;background:#0f1730;display:grid;
  place-items:center;font-size:12px;color:#0b1020;font-weight:900;}
.mis.done .box{background:var(--green);}
.mis .txt{flex:1;min-width:0;}
.mis .t1{font-size:11.5px;font-weight:800;letter-spacing:-.2px;}
.mis .t2{font-size:9.5px;color:var(--dim);font-weight:700;margin-top:2px;}
.mis.done .t1{color:var(--green);}
.mis .bar{height:4px;background:#0f1730;border:1px solid #000;margin-top:4px;overflow:hidden;}
.mis .bar i{display:block;height:100%;background:var(--blue);width:0%;}

/* ---------- 회의록 ---------- */
.mt{background:var(--panel);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:9px 10px;
  animation:cardIn .22s ease-out both;}
.mt .mhead{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.mt h3{margin:0;font-size:12.5px;font-weight:800;letter-spacing:-.3px;line-height:1.25;flex:1;}
.live{font-size:8px;font-weight:800;padding:2px 5px;color:#2a0a0a;background:var(--red);border:1px solid #000;
  white-space:nowrap;animation:blink 1.2s steps(2,end) infinite;}
@keyframes blink{50%{opacity:.4;}}
.pin{font-size:8px;font-weight:800;padding:2px 5px;color:#0b1020;background:#93a4cf;border:1px solid #000;white-space:nowrap;}
.mt .meta{font-size:9.5px;color:var(--dim);font-weight:700;margin-bottom:6px;}
.chiprow{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px;}
.who{font-size:9px;font-weight:800;padding:2px 5px;color:#0b1020;border:1px solid #000;background:#9fb0c7;white-space:nowrap;}
.who .w{font-weight:900;opacity:.75;}
.ln{display:flex;gap:6px;font-size:11px;line-height:1.45;margin-bottom:5px;color:#dbe4f7;}
.ln b{font-size:9.5px;color:var(--gold);white-space:nowrap;font-weight:800;padding-top:1px;}
.ln b i{font-style:normal;font-size:8px;color:var(--dim);font-weight:700;}
.ln .say{flex:1;letter-spacing:-.15px;}
.ln.wait .say{color:#7f8db0;font-style:italic;}
.reward{font-size:10px;font-weight:800;color:var(--green);margin-top:6px;}

/* ---------- 로그 ---------- */
.logbox{background:#141c31;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:8px 9px;}
.logbox .lh{font-size:9px;font-weight:800;color:#93a4cf;letter-spacing:.4px;margin-bottom:5px;}
.logrow{display:flex;gap:6px;font-size:10px;line-height:1.45;color:#c3cfeb;margin-bottom:4px;align-items:flex-start;}
.logrow .lt{font-size:8px;font-weight:800;padding:1px 4px;border:1px solid #000;color:#0b1020;white-space:nowrap;margin-top:1px;}
.logrow .ls{flex:1;letter-spacing:-.2px;}

/* ---------- rival ---------- */
.rvbox{background:linear-gradient(#28224a,#1a1730);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:10px;}
.rvbox .rvt{display:flex;align-items:baseline;gap:6px;}
.rvbox .rvt b{font-size:13px;font-weight:800;}
.rvbox .rvt span{margin-left:auto;font-size:16px;font-weight:800;color:#c9b4ff;font-variant-numeric:tabular-nums;}
.rvbar{height:10px;background:#0f1730;border:2px solid #000;margin:7px 0 4px;position:relative;overflow:hidden;}
.rvbar i{display:block;height:100%;width:20%;background:linear-gradient(90deg,#7a5cff,#c9a8ff);transition:width .3s;}
.rvscale{display:flex;justify-content:space-between;font-size:8px;font-weight:700;color:#8b93bd;}
.stat2{display:flex;gap:6px;}
.stat2 .s{flex:1;background:var(--panel);border:2px solid var(--ink);padding:7px 8px;text-align:center;}
.stat2 .s b{display:block;font-size:14px;font-weight:800;color:var(--gold);}
.stat2 .s span{font-size:8.5px;font-weight:700;color:var(--dim);}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:22px;
  background:rgba(4,7,14,.72);}
.mbox{width:100%;max-width:330px;max-height:86vh;overflow-y:auto;background:#18213c;border:3px solid var(--ink);
  box-shadow:0 6px 0 var(--ink);padding:16px 15px 14px;animation:pop .24s cubic-bezier(.2,1.2,.4,1) both;}
@keyframes pop{from{transform:scale(.88);opacity:0;}to{transform:none;opacity:1;}}
.mbox h2{margin:0 0 3px;font-size:15px;font-weight:800;letter-spacing:-.4px;color:#fff;}

/* 결재 권한 등급 — 카드의 금액 규모로 필요 직급이 정해진다 */
function cardNeed(c){
  if(c[4] === "CEO") return CEO_NEED;
  var mx = 0, i;
  for(i = 0; i < c[3].length; i++) if(c[3][i][1] > mx) mx = c[3][i][1];
  if(mx >= 320) return CEO_NEED;   // 대표님 전용
  if(mx >= 260) return 5;          // 이사
  if(mx >= 220) return 4;          // 부장
  if(mx >= 170) return 3;          // 차장
  if(mx >= 110) return 2;          // 과장
  if(mx >= 60)  return 1;          // 대리
  return 0;                        // 인턴
}
function needLabel(n){
  if(n >= CEO_NEED) return "대표님 전용";
  return rankName(n) + " 이상";
}

  {k:"promo",    base:1,    t:function(n){ return "직원 승진 " + n + "회"; },       rw:1.5},
  {k:"crisis",   base:1,    t:function(n){ return "돌발 위기 " + n + "건 대응"; },  rw:1.8},

];

   상태

var state = null;
var live = [];              // 현재 층에 그려지는 직원 (전역 자리번호 → 액터)
var uidC = 0;
var meetUid = 0;
var mt = null;              // 진행 중인 회의
var nowMs = Date.now();

function buildMissions(round){
  return MDEF.map(function(d){
    var target = d.k === "earned"
      ? Math.round(d.base * Math.pow(2.3, round - 1))
      : Math.max(1, Math.round(d.base * Math.pow(1.7, round - 1)));
    return {k:d.k, target:target, got:false};
  });
}

function newState(){
  var st = {
    v:3, money:400, totalEarned:0, xp:0, level:1, approved:0, quick:0,
    staff:[], up:{}, inbox:[], log:[], meetings:[], autoCount:0,
    ctr:{approved:0,hired:0,upgrade:0,earned:0,levelups:0,quick:0,promo:0,crisis:0,floors:0},
    mRound:1, missions:[], nextCardAt:0, nextMeetAt:0, buffUntil:0,
    muted:false, boostUntil:0, boostReadyAt:0,
    savedAt:Date.now(), intro:false, updNote:"", fi:0,
    floors:[true, false, false, false],
    crisis:null, nextCrisisAt:0, lastCrisisAt:0, lastCrisisName:"", criLog:[],
    bankrupt:0,
    rival:{share:18, wins:0, cdUntil:0},
    morale:60, buff2Until:0, buff2Amt:0
  };
  for(var i = 0; i < DEPTS.length * SEATS; i++) st.staff.push({hired:false, lv:1, rank:0});
  for(var u = 0; u < UPGRADES.length; u++) st.up[UPGRADES[u].id] = 0;
  st.missions = buildMissions(1);
  return st;
}

function save(){
  try{
    state.savedAt = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  }catch(e){}
}

/* v1.0.0 / v1.1.0 세이브도 그대로 읽고, 새 필드는 기본값으로 채운다 */
function load(){
  var raw = null;
  try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){}
  if(!raw) return null;
  try{
    var st = JSON.parse(raw);
    if(!st || (st.v !== 1 && st.v !== 2 && st.v !== 3)) return null;
    var base = newState();
    var fromOld = (st.v === 1 || st.v === 2);
    for(var k in base){ if(!(k in st)) st[k] = base[k]; }
    if(fromOld){
      /* v1: 12개 부서 1명씩 → 각 부서 첫 자리로 옮긴다 */
      var old = st.staff || [];
      var ns = [];
      for(var i2 = 0; i2 < DEPTS.length * SEATS; i2++) ns.push({hired:false, lv:1, rank:0});
      for(var d2 = 0; d2 < 12; d2++){
        var o = old[d2];
        if(o && o.hired){
          ns[d2 * SEATS] = {hired:true, lv:o.lv || 1, rank:clamp(Math.round(o.rank || 0), 0, MAXRANK)};
          /* 그 직원이 있던 층까지는 사옥이 열려 있어야 한다 */
          var fl = Math.floor(d2 / DEPT_PER_FLOOR);
          for(var f2 = 0; f2 <= fl; f2++) st.floors[f2] = true;
        }
      }
      if(st.v === 1){
        for(var j2 = 0; j2 < ns.length; j2++) if(ns[j2].hired) ns[j2].rank = clamp(Math.floor((ns[j2].lv - 1) / 2), 0, 3);
      }
      st.staff = ns;
    }
    if(!st.staff || st.staff.length !== DEPTS.length * SEATS){
      var fix = [];
      for(var i3 = 0; i3 < DEPTS.length * SEATS; i3++) fix.push(st.staff && st.staff[i3] ? st.staff[i3] : {hired:false, lv:1, rank:0});
      st.staff = fix;
    }
    st.staff.forEach(function(s){
      if(!s.lv) s.lv = 1;
      if(typeof s.rank !== "number" || isNaN(s.rank)) s.rank = 0;
      s.rank = clamp(Math.round(s.rank), 0, MAXRANK);
      s.lv = clamp(Math.round(s.lv), 1, 10);
      s.hired = !!s.hired;
    });
    for(var u2 = 0; u2 < UPGRADES.length; u2++){
      if(typeof st.up[UPGRADES[u2].id] !== "number") st.up[UPGRADES[u2].id] = 0;
    }
    /* v1.1.0 시설 이름 정리: 황금 명패 → 대형 전광판, 나머지는 그대로 */
    if(typeof st.up.plaque === "number" && st.up.plaque > 0 && !st.up.monitor){
      st.up.monitor = st.up.plaque;
    }
    if(!st.floors || st.floors.length !== 4) st.floors = [true, false, false, false];
    st.floors[0] = true;
    for(var f3 = 0; f3 < st.floors.length; f3++){
      if(st.floors[f3] && f3 > 0 && !st.floors[f3 - 1]) st.floors[f3 - 1] = true;
    }
    if(typeof st.fi !== "number" || !st.floors[st.fi]) st.fi = 0;
    if(!st.missions || st.missions.length !== MDEF.length) st.missions = buildMissions(st.mRound || 1);
    if(!st.inbox) st.inbox = [];
    st.inbox.forEach(function(c){
      if(typeof c.need !== "number") c.need = (typeof c.ci === "number" && CARDS[c.ci]) ? cardNeed(CARDS[c.ci]) : CEO_NEED;
      if(typeof c.by !== "number") c.by = -1;
      if(typeof c.scale !== "number" || !c.scale) c.scale = 1;
      c.done = true;
      if(!c.opts) c.opts = [["승인", 100, 10]];
      if(!c.from) c.from = "CS";
    });
    if(!st.log) st.log = [];
    if(!st.meetings) st.meetings = [];
    if(!st.ctr) st.ctr = base.ctr;
    ["promo","crisis","floors"].forEach(function(kk){ if(typeof st.ctr[kk] !== "number") st.ctr[kk] = 0; });
    if(typeof st.autoCount !== "number") st.autoCount = 0;
    if(typeof st.nextMeetAt !== "number") st.nextMeetAt = 0;
    if(typeof st.buffUntil !== "number") st.buffUntil = 0;
    if(!st.rival || typeof st.rival.share !== "number") st.rival = {share:18, wins:0, cdUntil:0};
    if(typeof st.morale !== "number") st.morale = 60;
    if(typeof st.nextCrisisAt !== "number") st.nextCrisisAt = 0;
    if(!st.criLog) st.criLog = [];
    st.crisis = null;                       // 새로 시작할 때 위기는 초기화
    if(fromOld) st.updNote = VER;
    st.v = 3;
    return st;
  }catch(e){ return null; }
}

/* =========================================================
   효과음 (Web Audio · 8bit)
   ========================================================= */
var AC = null, soundOn = true;
function ac(){
  if(AC === null){
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ AC = false; }
  }
  if(AC && AC.state === "suspended" && AC.resume) AC.resume();
  return AC || null;
}
function tone(freq, dur, type, vol, when, slideTo){
  if(!soundOn) return;
  var a = ac(); if(!a) return;
  try{
    var t0 = a.currentTime + (when || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.10, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }catch(e){}
}
var SFX = {

  promo:function(){ [523,659,784,1046,1318].forEach(function(f,i){ tone(f,0.11,"triangle",0.09,i*0.07); }); },
  meet:function(){ [440,554,659].forEach(function(f,i){ tone(f,0.13,"triangle",0.07,i*0.09); }); },
  tap:function(){ tone(620,0.03,"square",0.05); },
  bad:function(){ tone(220,0.13,"sawtooth",0.09,0,110); },
  boost:function(){ [784,1046,1318].forEach(function(f,i){ tone(f,0.11,"triangle",0.09,i*0.06); }); },
  alarm:function(){ [880,660,880,660].forEach(function(f,i){ tone(f,0.11,"square",0.10,i*0.12); }); },

/* =========================================================
   경제 계산
   ========================================================= */
function floorsOpen(){ var n = 0; for(var i = 0; i < 4; i++) if(state.floors[i]) n++; return n; }
function maxFloorOpen(){ var n = 0; for(var i = 0; i < 4; i++) if(state.floors[i]) n = i; return n; }
function deptOf(gi){ return DEPTS[Math.floor(gi / SEATS)]; }
function seatOf(gi){ return gi % SEATS; }

function upSum(){
  var m = 0, i, u;
  for(i = 0; i < UPGRADES.length; i++){ u = UPGRADES[i]; m += u.mult * (state.up[u.id] || 0); }
  return m;
}
function moraleMul(){ return 1 + (state.morale - 60) * 0.005; }
function rivalMul(){ return 1 - clamp(state.rival.share, 0, 100) / 100 * 0.35; }
function mult(){
  var m = 1 + (state.level - 1) * 0.03 + upSum();
  if(Date.now() < state.buffUntil) m += 0.10;            // 회의 효과
  if(Date.now() < state.buff2Until) m += state.buff2Amt; // 위기 대응 효과
  return m * moraleMul() * rivalMul();
}
function rankMul(r){ return 1 + 0.22 * r; }
function empInc(gi){
  var s = state.staff[gi], d = deptOf(gi);
  return d.base * (1 + 0.35 * (s.lv - 1)) * rankMul(s.rank);
}
function deptInc(di){
  var t = 0;
  for(var s = 0; s < SEATS; s++){
    var gi = di * SEATS + s;
    if(state.staff[gi].hired) t += empInc(gi);
  }
  return t;
}
function ips(now){
  var t = 0;
  for(var i = 0; i < state.staff.length; i++) if(state.staff[i].hired) t += empInc(i);
  t *= mult();
  if(now && now < state.boostUntil) t *= 2;
  return t;
}
function hiredCount(){ var n = 0; for(var i = 0; i < state.staff.length; i++) if(state.staff[i].hired) n++; return n; }
function deptHired(di){
  var n = 0;
  for(var s = 0; s < SEATS; s++) if(state.staff[di * SEATS + s].hired) n++;
  return n;
}
function floorHired(fi){
  var n = 0;
  for(var d = fi * DEPT_PER_FLOOR; d < fi * DEPT_PER_FLOOR + DEPT_PER_FLOOR; d++) n += deptHired(d);
  return n;
}
function hireCost(gi){
  var d = deptOf(gi), s = seatOf(gi);
  return Math.round(d.cost * SEAT_MUL[s]);
}
function lvCost(gi){
  var s = state.staff[gi], d = deptOf(gi);
  if(s.lv >= 10) return Infinity;
  return Math.round(d.cost * 0.55 * Math.pow(1.8, s.lv - 1));
}
function promoCost(gi){
  var s = state.staff[gi], d = deptOf(gi);
  if(s.rank >= MAXRANK) return Infinity;
  return Math.round(d.cost * 1.1 * Math.pow(3.0, s.rank));
}
function promoNeedLv(gi){ return 3 + state.staff[gi].rank; }
function needXp(lv){ return Math.round(110 * Math.pow(1.42, lv - 1)); }
function upCost(u){
  var lv = state.up[u.id];
  if(lv >= u.max) return Infinity;
  return Math.round(u.cost * Math.pow(u.step, lv));
}

function addXp(n){
  state.xp += n;
  var ups = 0;
  while(state.xp >= needXp(state.level) && state.level < 60){
    state.xp -= needXp(state.level);
    state.level++;
    ups++;
  }
  if(ups){
    SFX.level();
    toast("레벨 " + state.level + " 달성! 수익 +" + (ups * 3) + "%", "gold");
  }
}

/* =========================================================
   결재 카드 · 부서 내 상향식 결재
   ========================================================= */
var CARD_CAP = 8;
function cardScale(){
  return 1 + state.approved * 0.03 + (state.level - 1) * 0.14;
}
function pendingSet(){
  var set = {};
  for(var i = 0; i < state.inbox.length; i++) set[state.inbox[i].ci] = 1;
  return set;
}
function cardInterval(){
  var h = hiredCount(), avgLv = 0;
  for(var i = 0; i < state.staff.length; i++) if(state.staff[i].hired) avgLv += state.staff[i].lv;
  avgLv = h ? avgLv / h : 0;
  return Math.max(2.6, 8.4 - h * 0.09 - avgLv * 0.08);
}
function pickCardIndex(){
  var depts = [], pending = pendingSet(), i, d;
  for(i = 0; i < DEPTS.length; i++) if(deptHired(i) > 0) depts.push(i);
  for(var attempt = 0; attempt < 16; attempt++){
    var ci = -1;
    if(depts.length && Math.random() < 0.7){
      var di = depts[Math.floor(Math.random() * depts.length)];
      var id = DEPTS[di].id, pool = [];
      for(var c = 0; c < CARDS.length; c++) if(CARDS[c][0] === id) pool.push(c);
      if(pool.length) ci = pool[Math.floor(Math.random() * pool.length)];
    }
    if(ci < 0) ci = Math.floor(Math.random() * CARDS.length);
    if(!pending[ci]) return ci;
  }
  return Math.floor(Math.random() * CARDS.length);
}
function deptIndexById(id){
  for(var i = 0; i < DEPTS.length; i++) if(DEPTS[i].id === id) return i;
  return 0;
}
function empName(gi){
  var d = deptOf(gi);
  return d.names[seatOf(gi)];
}
function addLog(kind, text){
  state.log.unshift({t:Date.now(), k:kind, s:text});
  if(state.log.length > 44) state.log.length = 44;
}

function spawnCard(){
  var ci = pickCardIndex(), c = CARDS[ci];
  var di = deptIndexById(c[0]);
  var members = [];
  for(var s = 0; s < SEATS; s++) if(state.staff[di * SEATS + s].hired) members.push(di * SEATS + s);
  var card = {
    uid: ++uidC, ci: ci, from: c[0], title: c[1], desc: c[2], opts: c[3],
    scale: cardScale(), need: cardNeed(c), t: Date.now(), by: -1, done: false, di: di
  };
  card.by = members.length ? members[Math.floor(Math.random() * members.length)] : -1;
  handleCard(card);
  return card;
}

/* 카드 한 장이 부서 안에서 어떻게 처리되는지 결정 */
function handleCard(card){
  var need = card.need, oi = card.by;
  if(need >= CEO_NEED || oi < 0){ toCeo(card, oi); return; }
  if(state.staff[oi].rank >= need){ selfApprove(card, oi); return; }
  var bi = findBossInDept(card.di, need, oi);
  if(bi < 0){ toCeo(card, oi); return; }
  escalate(card, oi, bi);
}

/* 같은 부서 안에서 결재 가능한 가장 가까운 상사(가장 낮은 상위 직급) */
function findBossInDept(di, need, exclude){
  var best = -1, i, r, s;
  for(s = 0; s < SEATS; s++){
    i = di * SEATS + s;
    if(!state.staff[i].hired || i === exclude) continue;
    if(mt && inMeeting(i)) continue;
    r = state.staff[i].rank;
    if(r < need) continue;
    if(best < 0 || r < state.staff[best].rank) best = i;
  }
  if(best >= 0) return best;
  for(s = 0; s < SEATS; s++){
    i = di * SEATS + s;
    if(!state.staff[i].hired || i === exclude) continue;
    r = state.staff[i].rank;
    if(r < need) continue;
    if(best < 0 || r < state.staff[best].rank) best = i;
  }
  return best;
}
function bestOptIdx(card){
  var b = 0;
  for(var i = 1; i < card.opts.length; i++) if(card.opts[i][1] > card.opts[b][1]) b = i;
  return b;
}

/* 자체 전결 — 본인 권한으로 끝나는 소액 건 */
function selfApprove(card, oi){
  if(!inMeeting(oi)) say(oi, "자체 결재 완료!", 2400, true);
  setTimeout(function(){
    settleAuto(card, oi, -1, 0.55, "자체 결재");
    if(!inMeeting(oi)) say(oi, "처리 완료!", 2000, true);
  }, 500);
}

/* 상신 — 같은 부서 상사의 책상 앞으로 직접 걸어가 결재를 받는다 */
function escalate(card, oi, bi){
  var bossRank = rankName(state.staff[bi].rank);
  if(inMeeting(oi) || !live[oi]){
    setTimeout(function(){ settleAuto(card, oi, bi, 0.6, "상신 결재"); }, 900);
    return;
  }
  goToDeskOf(oi, bi, function(){
    say(oi, bossRank + "님 결재 부탁해요!", 2800, true);
    setTimeout(function(){
      if(!state.staff[bi].hired){ settleAuto(card, oi, -1, 0.55, "자체 결재"); return; }
      if(live[bi]) say(bi, "전결 승인!", 2400, true);
      settleAuto(card, oi, bi, 0.6, "상신 결재");
    }, 850);
  });
  /* 이동이 길어져도 결재는 반드시 처리된다 */
  setTimeout(function(){ settleAuto(card, oi, bi, 0.6, "상신 결재"); }, 6500);
}

function settleAuto(card, oi, bi, factor, label){
  if(card.done) return;
  card.done = true;
  var b = bestOptIdx(card), o = card.opts[b];
  var gain = Math.round(o[1] * card.scale * factor);
  var xp = Math.max(1, Math.round(o[2] * (1 + state.level * 0.05) * 0.3));
  state.money = Math.max(0, state.money + gain);
  if(gain > 0){ state.totalEarned += gain; state.ctr.earned += gain; }
  state.autoCount++;
  addXp(xp);
  var who = empName(oi) + " " + rankName(state.staff[oi].rank);
  var s;
  if(bi >= 0){
    s = who + " → " + empName(bi) + " " + rankName(state.staff[bi].rank) + " · " + card.title + " " + label +
        " (+₩" + won(Math.max(0, gain)) + ")";
  } else {
    s = who + " · " + card.title + " → " + label + " (+₩" + won(Math.max(0, gain)) + ")";
  }
  addLog(bi >= 0 ? "esc" : "self", s);
  if(bi >= 0){
    toast("상신 결재 · " + empName(oi) + " " + rankName(state.staff[oi].rank) + " → " +
          empName(bi) + " " + rankName(state.staff[bi].rank) + " +₩" + won(Math.max(0, gain)), gain > 0 ? "good" : "");
  } else {
    toast("자체 결재 · " + empName(oi) + " " + rankName(state.staff[oi].rank) +
          " +₩" + won(Math.max(0, gain)), gain > 0 ? "good" : "");
  }
  if(gain > 0) SFX.coin();
  save();
}

/* 대표님(플레이어) 결재함으로 올라옴 */
function toCeo(card, oi){
  card.done = true;
  if(state.inbox.length >= CARD_CAP){
    addLog("ceo", card.title + " → 결재함이 가득 차 보류");
    return;
  }
  state.inbox.push(card);
  if(oi >= 0 && live[oi] && !inMeeting(oi)) say(oi, "대표님 결재 필요합니다!", 3000, true);
  var dept = deptOf(oi >= 0 ? oi : card.di * SEATS).name;
  addLog("ceo", (oi >= 0 ? empName(oi) + " " + rankName(state.staff[oi].rank) + " · " : "") +
        card.title + " → 대표님 결재함");
  if(state.inbox.length === 1) toast("결재함에 새 서류 · " + dept, "");
  if(sheetKind === "inbox") renderSheet();
  updateBadges();
}

function approveCard(card, oi, isQuick){
  var o = card.opts[oi];
  if(!o) return null;
  var gain = Math.round(o[1] * card.scale * (isQuick ? 0.9 : 1));
  var xp = Math.max(1, Math.round(o[2] * (1 + state.level * 0.05)));
  state.money = Math.max(0, state.money + gain);
  if(gain > 0){ state.totalEarned += gain; state.ctr.earned += gain; }
  state.approved++; state.ctr.approved++;
  if(isQuick){ state.quick++; state.ctr.quick++; }
  var idx = state.inbox.indexOf(card);
  if(idx >= 0) state.inbox.splice(idx, 1);
  addXp(xp);
  SFX.stamp();
  setTimeout(function(){ if(gain > 0) SFX.coin(); }, 90);
  return {gain:gain, xp:xp, label:o[0], from:card.from};
}

/* =========================================================
   채용 · 레벨업 · 승진 · 시설 · 층 해금
   ========================================================= */
function firstFreeSeat(di){
  for(var s = 0; s < SEATS; s++) if(!state.staff[di * SEATS + s].hired) return di * SEATS + s;
  return -1;
}
function hire(gi){
  if(gi < 0 || state.staff[gi].hired) { SFX.bad(); return false; }
  var di = Math.floor(gi / SEATS);
  if(!state.floors[Math.floor(di / DEPT_PER_FLOOR)]) { SFX.bad(); return false; }
  var c = hireCost(gi);
  if(state.money < c) { SFX.bad(); return false; }
  state.money -= c;
  state.staff[gi].hired = true;
  state.staff[gi].lv = 1;
  state.staff[gi].rank = 0;
  state.ctr.hired++;
  SFX.hire();
  spawnLive(gi);
  if(live[gi]) bubblesFor(gi, empName(gi) + " 합류!", 2600);
  drawBG();
  addLog("hire", empName(gi) + " " + deptOf(gi).name + " 인턴으로 입사 (" + deptHired(di) + "번째 자리)");
  return true;
}
function levelUp(gi){
  var c = lvCost(gi), s = state.staff[gi];
  if(!s.hired || s.lv >= 10) { SFX.bad(); return false; }
  if(state.money < c) { SFX.bad(); return false; }
  state.money -= c;
  s.lv++;
  state.ctr.levelups++;
  SFX.level();
  if(live[gi]) bubblesFor(gi, "레벨 " + s.lv + "! 힘낼게요!", 2400);
  return true;
}
function promote(gi){
  var s = state.staff[gi], c = promoCost(gi);
  if(!s.hired || s.rank >= MAXRANK) { SFX.bad(); return false; }
  if(s.lv < promoNeedLv(gi)) { SFX.bad(); return "lv"; }
  if(state.money < c) { SFX.bad(); return "money"; }
  state.money -= c;
  s.rank++;
  state.ctr.promo++;
  SFX.promo();
  if(live[gi]) bubblesFor(gi, rankName(s.rank) + " 승진!", 3000);
  addLog("promo", empName(gi) + " " + deptOf(gi).name + " " + rankName(s.rank) + "으로 승진");
  drawBG();
  return true;
}
function buyUp(u){
  var c = upCost(u), lv = state.up[u.id];
  if(lv >= u.max) { SFX.bad(); return false; }
  if(!state.floors[u.fl]) { SFX.bad(); return "floor"; }
  if(state.money < c) { SFX.bad(); return false; }
  state.money -= c;
  state.up[u.id] = lv + 1;
  state.ctr.upgrade++;
  SFX.hire();
  drawBG();
  toast(u.name + " 레벨 " + (lv + 1) + " 설치 완료!", "good");
  return true;
}
function unlockFloor(fi){
  var F = FLOORS[fi];
  if(!F || state.floors[fi] || fi < 1) return false;
  if(!state.floors[fi - 1]) return "prev";
  if(state.money < F.cost) return "money";
  state.money -= F.cost;
  state.floors[fi] = true;
  state.ctr.floors++;
  state.fi = fi;
  switchFloor(fi, true);
  SFX.promo();
  addLog("floor", F.name + " 해금 · " + F.desc + " 부서 입주");
  toast(F.name + " 해금! " + F.desc, "gold");
  drawBG(); resize();
  return true;
}

/* =========================================================
   돌발 위기 · 라이벌전
   ========================================================= */
function crisisPool(){
  var mx = maxFloorOpen();
  return CRISES.filter(function(c){ return c.fl <= mx; });
}
function scheduleCrisis(now){
  state.nextCrisisAt = now + Math.round(rnd(52000, 92000));
}
function startCrisis(){
  if(state.crisis) return false;
  if(hiredCount() < 2) { scheduleCrisis(Date.now()); return false; }
  var pool = crisisPool();
  if(!pool.length) return false;
  var c = pool[Math.floor(Math.random() * pool.length)];
  var ipsNow = Math.max(ips(), 1);
  var cr = {
    id: c.id, kind: c.kind, tag: c.tag, title: c.title, desc: c.desc,
    start: Date.now(), end: Date.now() + c.dur * 1000, dur: c.dur,
    opts: c.opts.map(function(o){
      return {
        t: o.t, ios: o.ios, xp: o.xp, mor: o.mor || 0, risk: o.risk || 0,
        share: (o.o && typeof o.o.share === "number") ? o.o.share : 0,
        r: o.r, f: o.f, fios: o.fios, fmor: o.fmor, fshare: o.fshare,
        money: Math.round((o.ios || 0) * ipsNow)
      };
    })
  };
  state.crisis = cr;
  state.lastCrisisName = c.title;
  SFX.alarm();
  if(sheetKind) closeSheet();
  showCrisis();
  addLog("cri", c.tag + " · " + c.title);
  meetBadge();
  return true;
}
function applyShare(d){ state.rival.share = clamp(state.rival.share + d, 0, 90); }
function resolveCrisis(idx){
  var cr = state.crisis;
  if(!cr) return;
  var o = cr.opts[idx];
  if(!o) return;
  var now = Date.now();
  var success = !o.risk || Math.random() < o.risk;
  var ios = success ? o.ios : (typeof o.fios === "number" ? o.fios : o.ios);
  var mor = success ? o.mor : (typeof o.fmor === "number" ? o.fmor : o.mor);
  var shr = success ? o.share : (typeof o.fshare === "number" ? o.fshare : 0);
  var money = Math.round(ios * Math.max(ips(), 1));
  state.money = Math.max(0, state.money + money);
  if(money > 0) state.totalEarned += money;
  addXp(o.xp + (success ? 6 : 0));
  state.morale = clamp(state.morale + mor, 10, 100);
  applyShare(shr);
  state.ctr.crisis++;
  var msg = success ? o.r : o.f;
  state.lastCrisisAt = now;
  state.lastCrisisName = cr.title;
  state.criLog.unshift({t:now, k:cr.kind, tag:cr.tag, title:cr.title, pick:o.t, ok:success, msg:msg});
  if(state.criLog.length > 12) state.criLog.length = 12;
  addLog(success ? "cri2" : "cri3", cr.title + " · " + o.t + (money ? " (" + (money > 0 ? "+" : "") + "₩" + won(money) + ")" : ""));
  state.crisis = null;
  hideCrisis();
  toast((success ? "✅ " : "⚠️ ") + msg, success ? "good" : "bad");
  if(money > 0) SFX.coin(); else SFX.bad();
  checkRival();
  scheduleCrisis(now);
  if(sheetKind === "rival") renderSheet();
  save();
}
function timeoutCrisis(){
  var cr = state.crisis;
  if(!cr) return;
  var money = Math.round(-10 * Math.max(ips(), 1));
  state.money = Math.max(0, state.money + money);
  state.morale = clamp(state.morale - 8, 10, 100);
  applyShare(6);
  state.lastCrisisAt = Date.now();
  state.criLog.unshift({t:Date.now(), k:cr.kind, tag:cr.tag, title:cr.title, pick:"무대응", ok:false,
    msg:"아무도 대응하지 않아 손실이 커졌어요."});
  if(state.criLog.length > 12) state.criLog.length = 12;
  addLog("cri3", cr.title + " · 무대응으로 손실 (-₩" + won(-money) + ")");
  state.crisis = null;
  hideCrisis();
  toast("⚠️ 무대응 · " + cr.title + " 손실 발생", "bad");
  SFX.bad();
  checkRival();
  scheduleCrisis(Date.now());
  if(sheetKind === "rival") renderSheet();
  save();
}
function checkRival(){
  if(state.rival.share <= 0){
    state.rival.wins++;
    var reward = Math.round(Math.max(400, ips() * 70));
    state.money += reward;
    state.totalEarned += reward; state.ctr.earned += reward;
    state.rival.share = 38;
    addLog("rival", "라이벌 격퇴! 시장 점유율 0% · 보너스 +₩" + won(reward));
    toast("⚔️ 라이벌 격퇴! 보너스 +₩" + won(reward), "gold");
    addXp(60);
    SFX.win();
  }
  if(state.rival.share >= 90){
    state.rival.share = 88;
    addLog("rival", "라이벌 독주 경고 · 점유율 88%");
  }
}
function rivalPoke(){
  var now = Date.now();
  if(now < state.rival.cdUntil) return false;
  var cost = Math.round(Math.max(300, ips() * 16));
  if(state.money < cost){ SFX.bad(); return "money"; }
  state.money -= cost;
  state.rival.cdUntil = now + 40000;
  applyShare(-7);
  addXp(18);
  SFX.tap();
  toast("라이벌 대응 · 점유율 -7%", "good");
  checkRival();
  addLog("rival", "라이벌 대응 카드 발행 · 점유율 하락");
  save();
  return true;
}

function resize(){
  var stage = $("stage");
  var w = stage.clientWidth || 360, h = stage.clientHeight || 520;
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var s = Math.min(w / W, h / H);
  view.dpr = dpr; view.w = w; view.h = h; view.s = s;
  view.ox = (w - W * s) / 2;
  view.oy = (h - H * s) / 2;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  var tb = $("tabs");

function rowOf(gi){ return Math.floor(gi / SEATS) % DEPT_PER_FLOOR; }
function corridorY(row){ return ROW_Y[row] + 50; }
function deskPos(gi){
  return {x: DESK_COL[seatOf(gi)], y: ROW_Y[rowOf(gi)] + DESK_TOP};
}
function seatPos(gi){
  var d = deskPos(gi);
  return {x: d.x + 22, y: d.y + 2};
}
function nearestHall(x){
  var best = HALL[0], bd = 999, i;
  for(i = 0; i < HALL.length; i++){
    var dd = Math.abs(x - HALL[i]);
    if(dd < bd){ bd = dd; best = HALL[i]; }
  }
  return best;
}

function lib(c, x, y, cols){
  R(c, "#24304a", x - 2, y - 2, 44, 32);
  R(c, "#7a3f18", x, y, 40, 28);
  R(c, "#5e2f11", x + 2, y + 2, 36, 24);
  for(var row = 0; row < 3; row++){
    var by = y + 3 + row * 8;
    R(c, "#4a2409", x + 2, by + 6, 36, 1);

var ceo = {x:161, y:36, bubble:"", bubUntil:0, next:6};
var ceoBob = false;

function spawnLive(gi){
  var s = seatPos(gi);
  live[gi] = {
    x:s.x, y:s.y, mode:"work", t:0, next:6 + Math.random() * 12,
    path:null, pi:0, spd:24 + Math.random() * 10, tick:Math.random() * 5,
    bubble:"", bubUntil:0, bubNext:2 + Math.random() * 5, bubLock:0,
    done:null, standUntil:0
  };
}
function rebuildLive(){
  live = [];
  var fi = state.fi;
  for(var d = fi * DEPT_PER_FLOOR; d < fi * DEPT_PER_FLOOR + DEPT_PER_FLOOR; d++){
    if(d >= DEPTS.length) continue;
    for(var s = 0; s < SEATS; s++){
      var gi = d * SEATS + s;
      if(state.staff[gi].hired) spawnLive(gi);
    }
  }
}
function switchFloor(fi, silent){
  if(fi === state.fi) return;
  if(!state.floors[fi]) return;
  if(mt){ mt = null; meetBadge(); }
  state.fi = fi;
  state.nextMeetAt = Date.now() + 12000;
  rebuildLive();
  drawBG();
  resize();
  buildFloorBar();
  if(!silent){
    toast(FLOORS[fi].name + " · " + FLOORS[fi].desc, "");
    SFX.tap();
  }
  updateBadges();
  save();
}
function say(gi, text, ms, lock){
  var l = live[gi]; if(!l) return;
  var now = Date.now();
  if(lock && now < l.bubLock && l.bubble) return;
  l.bubble = text;
  l.bubUntil = now + ms;
  if(lock) l.bubLock = now + ms;
}
function bubblesFor(gi, text, ms){ say(gi, text, ms, true); }
function bubbleCount(){
  var n = 0, now = Date.now(), k;
  for(k in live) if(live[k] && live[k].bubble && now < live[k].bubUntil) n++;
  if(ceo.bubble && now < ceo.bubUntil) n++;
  return n;
}

function pathFor(gi, tx, ty){
  var l = live[gi]; if(!l) return [];
  var r = rowOf(gi), cor = corridorY(r);
  var pts = [];
  var onCor = Math.abs(l.y - cor) < 3;
  if(!onCor) pts.push({x:l.x, y:cor});
  var tRow = -1, k;
  for(k = 0; k < DEPT_PER_FLOOR; k++){
    if(ty >= ROW_Y[k] - 2 && ty <= corridorY(k) + 4) tRow = k;
  }
  var tCor = tRow >= 0 ? corridorY(tRow) : ty;
  var hall = nearestHall(tx);
  if(Math.abs(l.x - hall) > 1) pts.push({x:hall, y:cor});
  if(Math.abs(tCor - cor) > 1) pts.push({x:hall, y:tCor});
  if(Math.abs(tx - hall) > 1) pts.push({x:tx, y:tCor});
  if(Math.abs(ty - tCor) > 1) pts.push({x:tx, y:ty});
  return pts;
}
function goTo(gi, tx, ty, done){
  var l = live[gi]; if(!l) return;
  l.path = pathFor(gi, tx, ty);
  l.pi = 0;
  l.mode = "walk";
  l.done = done || null;
  if(!l.path.length){
    l.mode = "stand"; l.standUntil = Date.now() + 1200;
    if(done) done();
  }
}
function goHome(gi, done){
  var s = seatPos(gi);
  goTo(gi, s.x, s.y, function(){
    var l = live[gi];
    if(l){ l.mode = "work"; l.t = 0; l.next = 10 + Math.random() * 14; }
    if(done) done();
  });
}
/* 같은 부서 상사 책상 앞으로 */
function goToDeskOf(gi, bi, done){
  var l = live[gi];
  if(!l) { if(done) done(); return; }
  var r = rowOf(bi), cor = corridorY(r);
  var s = seatPos(bi);
  var tx = s.x - 13;
  if(tx < 6) tx = s.x + 13;
  goTo(gi, tx, cor + 2, done);
}

function updateActors(dt){
  var now = Date.now(), k;
  for(k in live){
    var gi = +k, s = state.staff[gi], l = live[gi];
    if(!s || !s.hired || !l) continue;
    l.tick += dt;

    if(l.mode === "work"){
      var seat = seatPos(gi);
      l.x = seat.x; l.y = seat.y;
      l.t += dt;
      if(l.t > l.next && !inMeeting(gi) && !mt){
        l.t = 0;
        var r = rowOf(gi);
        var px = 14 + Math.random() * 172;
        goTo(gi, px, corridorY(r) + 2, function(idx){
          return function(){
            var ll = live[idx], nn = Date.now();
            if(!ll) return;
            ll.standUntil = nn + 2200;
            ll.mode = "stand";
            if(nn > ll.bubLock && bubbleCount() < 2){
              say(idx, BUB_WALK[Math.floor(Math.random() * BUB_WALK.length)], 2600, false);
            }
          };
        }(gi));
      } else if(now > l.bubNext && now > l.bubUntil && now > l.bubLock && !mt){
        if(bubbleCount() >= 2){
          l.bubNext = now + 1800 + Math.random() * 3000;
        } else {
          var pool = (BUB[deptOf(gi).id] || BUB_GEN).concat(BUB_GEN);
          l.bubble = pool[Math.floor(Math.random() * pool.length)];
          l.bubUntil = now + 2400 + Math.random() * 1800;
          l.bubNext = l.bubUntil + 2500 + Math.random() * 6000;
        }
      }

    } else if(l.mode === "walk"){
      if(!l.path || !l.path.length){ l.mode = "work"; continue; }
      var tgt = l.path[l.pi];
      if(!tgt){ arrive(gi); continue; }
      var dx = tgt.x - l.x, dy = tgt.y - l.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var step = l.spd * dt;
      if(dist <= step){
        l.x = tgt.x; l.y = tgt.y; l.pi++;
        if(l.pi >= l.path.length) arrive(gi);
      } else {
        l.x += dx / dist * step;
        l.y += dy / dist * step;
      }

    } else if(l.mode === "stand"){
      if(now > l.standUntil && !inMeeting(gi)) goHome(gi);

    } else if(l.mode === "meet"){
      /* 회의 자리 고정 */
    }
  }

  /* CEO */
  ceo.next -= dt;
  if(ceo.next <= 0){
    ceo.next = 8 + Math.random() * 9;
    if(bubbleCount() < 2){
      ceo.bubble = CEO_BUB[Math.floor(Math.random() * CEO_BUB.length)];
      ceo.bubUntil = Date.now() + 3000;
    }
  }
}

function arrive(gi){
  var l = live[gi]; if(!l) return;
  l.path = null; l.pi = 0;
  var f = l.done; l.done = null;
  l.mode = "stand";
  l.standUntil = Date.now() + 2500;
  if(f){ f(); return; }
  var seat = seatPos(gi);
  if(Math.abs(l.x - seat.x) < 2 && Math.abs(l.y - seat.y) < 2){
    l.mode = "work"; l.t = 0; l.next = 10 + Math.random() * 14;
  }
}

var fontStack = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif';

function txt(c, t, x, y, size, col, weight, align){
  c.font = (weight || 700) + " " + size + "px " + fontStack;
  c.textAlign = align || "center";
  c.textBaseline = "middle";
  c.fillStyle = col;
  c.fillText(t, x, y);
}
function outTxt(c, t, x, y, size, col, weight, align){
  c.font = (weight || 700) + " " + size + "px " + fontStack;
  c.textAlign = align || "center";
  c.textBaseline = "middle";
  c.lineWidth = 2.2;
  c.strokeStyle = "rgba(8,12,22,.85)";
  c.strokeText(t, x, y);
  c.fillStyle = col;
  c.fillText(t, x, y);
}
function fitTxt(c, t, x, y, size, maxW, col, weight){
  var s = size;
  c.font = (weight || 800) + " " + s + "px " + fontStack;
  while(c.measureText(t).width > maxW && s > 2.2){
    s -= 0.15;
    c.font = (weight || 800) + " " + s + "px " + fontStack;
  }
  c.textAlign = "center";
  c.textBaseline = "middle";
  c.fillStyle = col;
  c.fillText(t, x, y);
}
function fitTxtL(c, t, x, y, size, maxW, col, weight){
  var s = size;
  c.font = (weight || 800) + " " + s + "px " + fontStack;
  while(c.measureText(t).width > maxW && s > 2.2){
    s -= 0.15;
    c.font = (weight || 800) + " " + s + "px " + fontStack;
  }
  c.textAlign = "left";
  c.textBaseline = "middle";
  c.fillStyle = col;
  c.fillText(t, x, y);
}
function bubbleBox(c, t, cx, cyBottom, size){
  c.font = '800 ' + size + "px " + fontStack;
  var w = c.measureText(t).width + 6;
  var h = size + 5;
  var x = cx - w / 2, y = cyBottom - h;
  if(x < 1) x = 1;
  if(x + w > W - 1) x = W - 1 - w;
  if(y < 1) y = 1;
  c.fillStyle = "rgba(10,14,26,.35)";
  c.fillRect(x + 1, y + 2, w, h);
  c.fillStyle = "#fffdf5";
  c.fillRect(x, y, w, h);
  c.strokeStyle = "#12182b"; c.lineWidth = 0.9;
  c.strokeRect(x + 0.45, y + 0.45, w - 0.9, h - 0.9);
  c.fillStyle = "#fffdf5";
  c.fillRect(cx - 1.6, y + h - 0.4, 3.2, 1.8);
  c.strokeStyle = "#12182b"; c.lineWidth = 0.9;
  c.beginPath();
  c.moveTo(cx - 1.6, y + h - 0.2); c.lineTo(cx - 1.6, y + h + 1.4);
  c.lineTo(cx + 1.6, y + h + 1.4); c.lineTo(cx + 1.6, y + h - 0.2);
  c.stroke();
  c.fillStyle = "#fffdf5"; c.fillRect(cx - 1.2, y + h - 0.6, 2.4, 1.4);
  txt(c, t, x + w / 2, y + h / 2 + 0.3, size, "#1a2030", 800);
}

function drawScene(){
  var s = view.s;
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = "#080c16";
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(bgc, view.ox, view.oy, W * s, H * s);

  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(s, s);
  var now = Date.now();

  /* 남는 여백에 벽/바닥 무늬를 이어 붙인다 */
  var padTop = view.oy / s, padBot = (view.h - view.oy - H * s) / s;
  if(padTop > 0.5){
    var roof = (state.fi === 3);
    R(ctx, roof ? "#8fd0ef" : "#efe2c2", 0, -padTop, W, padTop + 1);
    if(!roof){
      for(var px2 = 2; px2 < W; px2 += 10) R(ctx, "#e8dab8", px2, -padTop, 5, padTop + 1);
      R(ctx, "#d8c69c", 0, -1, W, 1);
    }
  }
  if(padBot > 0.5){
    for(var py2 = H; py2 < H + padBot + 8; py2 += 8){
      R(ctx, "#d98b3f", 0, py2, W, 8);
      R(ctx, "#c47a30", 0, py2 + 7, W, 1);
      R(ctx, "#e6a05a", 0, py2, W, 1);
      var off2 = (Math.floor(py2 / 8) % 2) ? 20 : 0;
      for(var px3 = off2; px3 < W; px3 += 44) R(ctx, "#c47a30", px3, py2, 1, 7);
    }
  }

  /* 대표실 CEO · 명패 (1층) */
  if(state.fi === 0){
    drawCEO(ctx, ceo.x, ceo.y, ceoBob);
    fitTxt(ctx, "대표실", 161, 8.4, 4.6, 44, "#ffe9c4", 800);
  }

  /* 회의 중 표시 */
  if(mt && mt.phase !== "done"){
    var pulse = 0.5 + 0.5 * Math.sin(now / 260);
    var mw2 = 84 + (state.up.meeting || 0) * 8;
    var bx = 4 + mw2 / 2;
    ctx.fillStyle = "rgba(255,122,122," + (0.65 + pulse * 0.35).toFixed(2) + ")";
    ctx.fillRect(bx - 13, 203, 26, 7);
    ctx.strokeStyle = "#0a0e1a"; ctx.lineWidth = 0.8;
    ctx.strokeRect(bx - 12.6, 203.4, 25.2, 6.2);
    fitTxt(ctx, "회의 중", bx, 206.7, 4.2, 22, "#2a0a0a", 800);
  }

  /* 그리기 순서: y 기준 정렬 (액터 ↔ 책상 앞판) */
  var items = [], k, gi;
  for(k in live){
    gi = +k;
    if(!state.staff[gi] || !state.staff[gi].hired) continue;
    items.push({y: live[gi].y, t:"bot", gi:gi});
  }
  for(var r = 0; r < DEPT_PER_FLOOR; r++){
    var di = state.fi * DEPT_PER_FLOOR + r;
    if(di >= DEPTS.length) continue;
    items.push({y: ROW_Y[r] + DESK_TOP + DESK_H, t:"desk", di:di});
  }
  items.sort(function(a, b){ return a.y - b.y; });
  for(var it = 0; it < items.length; it++){
    var e = items[it];
    if(e.t === "bot"){
      var lb = live[e.gi];
      drawBot(ctx, lb.x, lb.y, deptOf(e.gi), state.staff[e.gi].lv, lb.mode === "walk", lb.tick);
    } else {
      for(var s2 = 0; s2 < SEATS; s2++) drawDeskFront(ctx, e.di * SEATS + s2);
    }
  }

  /* 책상 명패 — 직급 + 이름 */
  for(var d3 = 0; d3 < DEPT_PER_FLOOR; d3++){
    var dd = state.fi * DEPT_PER_FLOOR + d3;
    if(dd >= DEPTS.length) continue;
    for(var s3 = 0; s3 < SEATS; s3++){
      var g3 = dd * SEATS + s3, p3 = deskPos(g3);
      if(state.staff[g3].hired){
        var rk3 = state.staff[g3].rank;
        fitTxt(ctx, rankName(rk3) + " " + empName(g3), p3.x + 22, p3.y + 11.2, 3.8, DESK_W - 10,
               rk3 > 0 ? rankColor(rk3) : "#c9d6ee", 800);
      } else {
        fitTxt(ctx, "채용", p3.x + 22, p3.y + 11.2, 4.0, DESK_W - 10, "#f0c060", 800);
      }
    }
  }

  /* 이름표 (자리·회의 중일 때만) */
  for(k in live){
    gi = +k;
    var l4 = live[gi];
    if(!l4 || !state.staff[gi] || !state.staff[gi].hired) continue;
    if(l4.mode === "work") continue;
    var rn4 = state.staff[gi].rank;
    outTxt(ctx, rankName(rn4) + " " + empName(gi), l4.x, l4.y - 17, 4.4,
           rn4 > 0 ? rankColor(rn4) : "#ffffff", 800);
  }
  if(state.fi === 0 && ceo.bubble) outTxt(ctx, "대표님", ceo.x, ceo.y - 20, 4.4, "#ffd479", 800);

  /* 말풍선 */
  for(k in live){
    gi = +k;
    var l5 = live[gi];
    if(!l5 || l5.mode === "walk") continue;
    if(l5.bubble && now < l5.bubUntil) bubbleBox(ctx, l5.bubble, l5.x, l5.y - 21, 4.7);
  }
  if(state.fi === 0 && ceo.bubble && now < ceo.bubUntil) bubbleBox(ctx, ceo.bubble, ceo.x, ceo.y - 22, 4.7);

  /* 부스트/회의/위기 오라 */
  if(now < state.boostUntil){
    var a = 0.10 + Math.sin(now / 180) * 0.05;
    ctx.fillStyle = "rgba(255,180,60," + a.toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  if(now < state.buffUntil){
    ctx.fillStyle = "rgba(120,224,142,.05)";
    ctx.fillRect(0, 0, W, H);
  }
  if(state.crisis){
    ctx.fillStyle = "rgba(255,120,120,.07)";
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

function inMeeting(gi){
  if(!mt) return false;
  for(var k = 0; k < mt.parts.length; k++) if(mt.parts[k] === gi) return true;
  return false;
}
function meetSpots(n){
  var mw = 84 + (state.up.meeting || 0) * 8;
  var out = [], k;
  for(k = 0; k < n; k++) out.push({x: 8 + (mw - 6) * (k + 1) / (n + 1), y: MEET_Y});
  return out;
}
function meetBadge(){
  var b = $("meetBadge");
  if(!b) return;
  var on = !!(mt && mt.phase !== "done");
  b.classList.toggle("hidden", !on);
  if(on) b.textContent = "🗣 회의 중! 보기 (" + mt.parts.length + "명)";
  var tb = $("tabMeetN");
  if(tb) tb.classList.toggle("hidden", !on);
}

var RIVAL_NAME = "메가오피스";

function startMeeting(){
  var cand = [], k, gi;
  for(k in live){
    gi = +k;
    if(state.staff[gi] && state.staff[gi].hired && !inMeeting(gi)) cand.push(gi);
  }
  if(cand.length < 2){ state.nextMeetAt = Date.now() + 20000; return; }
  for(var i = cand.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = cand[i]; cand[i] = cand[j]; cand[j] = tmp;
  }
  var maxP = Math.min(3, cand.length);
  var recentCrisis = state.crisis || (Date.now() - (state.lastCrisisAt || 0) < 120000);
  var pool;
  if(recentCrisis && Math.random() < 0.62){
    pool = CMEET.filter(function(m){ return m.p <= maxP; });
  } else {
    pool = MEET.filter(function(m){ return m.p <= maxP; });
  }
  if(!pool.length){ state.nextMeetAt = Date.now() + 20000; return; }
  var topic = pool[Math.floor(Math.random() * pool.length)];
  var want = Math.min(topic.p, cand.length);
  var parts = cand.slice(0, want);
  var spots = meetSpots(want);

  mt = {
    id: ++meetUid, topic: topic, parts: parts, seg: 0, phase: "walk",
    lines: topic.l, resolved: [], nextAt: 0, startedAt: Date.now(),
    spots: spots, floor: state.fi
  };
  parts.forEach(function(idx, kk){
    if(!live[idx]) return;
    goTo(idx, spots[kk].x, spots[kk].y, null);
  });
  var mid = mt.id;
  var check = setInterval(function(){
    if(!mt || mt.id !== mid){ clearInterval(check); return; }
    if(mt.phase !== "walk"){ clearInterval(check); return; }
    var done = 0;
    mt.parts.forEach(function(idx){
      var l = live[idx];
      if(!l){ done++; return; }
      if(l.mode !== "walk"){ done++; l.mode = "meet"; }
    });
    if(done >= mt.parts.length){ clearInterval(check); beginTalk(); }
  }, 220);
}

function beginTalk(){
  if(!mt || mt.phase !== "walk") return;
  mt.phase = "talk";
  mt.nextAt = Date.now() + 600;
  SFX.meet();
  var title = mtFill(mt.topic.t, mt.parts);
  toast("회의 시작 · " + title, "gold");
  addLog("meet", "회의 시작 · " + title);
  meetBadge();
  updateBadges();
  if(sheetKind === "minutes") renderSheet();
}

function mtFill(text, parts){
  return String(text)
    .replace(/\{n(\d)\}/g, function(m, d){ var p = parts[+d]; return p == null ? "동료" : empName(p); })
    .replace(/\{r(\d)\}/g, function(m, d){ var p = parts[+d]; return p == null ? "사원" : rankName(state.staff[p].rank); })
    .replace(/\{d(\d)\}/g, function(m, d){ var p = parts[+d]; return p == null ? "옆 팀" : deptOf(p).name; })
    .replace(/\{v\}/g, RIVAL_NAME)
    .replace(/\{c\}/g, state.crisis ? state.crisis.title : (state.lastCrisisName || "돌발 상황"));
}

function updateMeeting(){
  var now = Date.now();
  if(!mt){
    if(now >= state.nextMeetAt && hiredCount() >= 2){
      startMeeting();
      if(!mt) return;
    }
    return;
  }
  if(mt.phase === "walk"){
    if(now - mt.startedAt > 9000){
      mt.parts.forEach(function(idx, k){
        var l = live[idx];
        if(!l) return;
        if(mt.spots && mt.spots[k]){ l.x = mt.spots[k].x; l.y = mt.spots[k].y; }
        l.path = null; l.mode = "meet"; l.done = null;
      });
      beginTalk();
    }
    return;
  }
  if(mt.phase !== "talk") return;
  if(now < mt.nextAt) return;
  if(mt.seg < mt.lines.length){
    var idx = mt.parts[mt.lines[mt.seg][0]];
    var text = mtFill(mt.lines[mt.seg][1], mt.parts);
    if(idx != null){
      mt.resolved.push({
        who: empName(idx), rank: state.staff[idx].rank, dept: deptOf(idx).name, t: text
      });
      if(live[idx]){
        var snip = text.length > 15 ? text.slice(0, 15) + "…" : text;
        say(idx, snip, 2400, true);
      }
    }
    mt.seg++;
    mt.nextAt = now + 1500 + Math.random() * 700;
    if(sheetKind === "minutes") refreshMinutes();
  } else {
    endMeeting();
  }
}

function endMeeting(){
  var m = mt;
  mt = null;
  var now = Date.now();
  state.buffUntil = now + 90000;
  state.morale = clamp(state.morale + 3, 10, 100);
  var bonus = Math.round(Math.max(30, ips() * 8));
  state.money += bonus;
  state.totalEarned += bonus;
  state.ctr.earned += bonus;
  var rec = {
    id: m.id, title: mtFill(m.topic.t, m.parts), at: now,
    parts: m.parts.map(function(idx){ return {name: empName(idx), rank: state.staff[idx].rank, dept: deptOf(idx).name}; }),
    lines: m.resolved.slice()
  };
  state.meetings.unshift(rec);
  if(state.meetings.length > 8) state.meetings.length = 8;
  addLog("meet", "회의 종료 · " + rec.title + " · 팀 사기 +10% (90초)");
  toast("회의 종료 · " + rec.title + " · 팀 사기 +10%", "good");
  SFX.coin();
  m.parts.forEach(function(idx){
    if(live[idx]){ live[idx].mode = "stand"; live[idx].standUntil = Date.now() + 600; goHome(idx); }
  });
  state.nextMeetAt = now + 45000 + Math.random() * 45000;
  meetBadge();
  updateBadges();
  if(sheetKind === "minutes") renderSheet();
  save();
}

function toast(t, kind){
  var layer = $("toastLayer");
  var el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = t;
  layer.appendChild(el);
  while(layer.children.length > 3) layer.removeChild(layer.firstChild);
  setTimeout(function(){
    el.classList.add("out");
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 320);
  }, 1600);
}

    h += '<div class="reward">팀 사기 +10% (90초) · 회의 보너스 지급 완료</div></div>';
    startIdx = 1;
  }
  if(state.meetings.length > startIdx){
    h += '<div class="logbox" style="background:#141c31"><div class="lh">지난 회의록 (' + (state.meetings.length - startIdx) + ')</div></div>';
    for(var mi = startIdx; mi < state.meetings.length; mi++){
      var m = state.meetings[mi];
      h += '<div class="mt"><div class="mhead"><span class="pin">회의록</span><h3>' + esc(m.title) + '</h3></div>';
      h += '<div class="meta">' + timeStr(m.at) + ' · 참석 ' + m.parts.length + '명 · 발언 ' + m.lines.length + '개</div>';
      h += '<div class="chiprow">' + m.parts.map(whoChip).join("") + '</div>';
      h += '<button class="mini grey" data-act="minutes" data-m="' + mi + '">대화 전문 보기</button></div>';
    }

  if(!h){
    h = '<div class="empty">아직 회의록이 없어요.<br>같은 층에 직원이 2명 이상이면 회의실에서 회의가 열려요.<br><br>· 회의실 테이블을 눌러도 볼 수 있어요</div>';

  return h;
}

function renderSheet(){
  if(!sheetKind) return;
  var body = $("sheetBody"), title = $("sheetTitle"), sub = $("sheetSub");
  var html = "", i;

  if(sheetKind === "inbox"){
    title.textContent = "결재함";
    sub.textContent = "대표님 결재 대기 " + state.inbox.length + "건 · 부서에서 처리 못 한 건만 올라와요";
    if(!state.inbox.length){
      html = '<div class="empty">대표님 결재로 올라온 서류가 없어요.<br>부서 안에서 상사가 자체 전결·상신으로 처리하고 있어요.<br><br>· 부서 최고 직급도 못 하는 중대 건만 여기로 와요</div>';
    } else {
      state.inbox.forEach(function(card){ html += cardHTML(card); });
    }
    html += logHTML("자체 전결 · 부서 상신 · 위기 기록", 10);

  } else if(sheetKind === "staff"){
    title.textContent = "AI 직원 · 부서";
    sub.textContent = hiredCount() + "명 근무 · " + floorsOpen() + "개 층 · 총 " + won(ips()) + "원/초";
    html = staffHTML(false);

  } else if(sheetKind === "shop"){
    title.textContent = "사옥 시설";
    sub.textContent = "사옥 배율 ×" + (1 + upSum()).toFixed(2) + " · 전체 수익 ×" + mult().toFixed(2);
    for(var fi = 0; fi < FLOORS.length; fi++){
      var F = FLOORS[fi], openF = state.floors[fi];
      html += '<div class="row' + (openF ? "" : " locked") + '"><div class="swatch" style="background:' +
              (openF ? "#ffd479" : "#39435f") + '"></div><div class="meta">' +
              '<div class="nm">' + F.name + ' · ' + F.sub + '</div>' +
              '<div class="jb">' + F.desc + '</div>' +
              (openF ? '<div class="inc">' + floorHired(fi) + '명 근무 · +' + won(floorInc(fi)) + '/초</div>'
                     : '<div class="jb" style="color:#ffb347">해금 ₩' + won(F.cost) + '</div>') +
              '</div><div class="act">';
      if(!openF) html += '<button class="mini" data-act="floor" data-f="' + fi + '">해금</button>';
      else if(state.fi !== fi) html += '<button class="mini blue" data-act="gofloor" data-f="' + fi + '">이동</button>';
      else html += '<span style="font-size:9px;color:#7be08e;font-weight:800">보는 중</span>';
      html += '</div></div>';
      if(openF){
        for(i = 0; i < UPGRADES.length; i++){
          var u = UPGRADES[i];
          if(u.fl !== fi) continue;
          var lv = state.up[u.id], c = upCost(u), maxed = lv >= u.max;
          html += '<div class="row"><div class="swatch" style="background:#ffd479"></div>';
          html += '<div class="meta"><div class="nm">' + u.name + '<em>레벨 ' + lv + '</em></div>';
          html += '<div class="jb">' + u.desc + '</div>';
          html += '<div class="inc">수익 +' + Math.round(u.mult * 100) + '% / 단계</div></div><div class="act">';
          html += '<div class="pips">';
          for(var k = 0; k < u.max; k++) html += '<i class="' + (k < lv ? "on" : "") + '"></i>';
          html += '</div>';
          if(maxed) html += '<span style="font-size:9px;color:#7be08e;font-weight:800">최대</span>';
          else html += '<button class="mini" data-act="buy" data-id="' + u.id + '">₩' + won(c) + " 설치</button>";
          html += '</div></div>';
        }
      }
    }

  } else if(sheetKind === "mission"){
    title.textContent = "오늘 할 일";
    sub.textContent = state.mRound + "회차 · 달성하면 보너스";
    state.missions.forEach(function(mm, mi2){
      var d = MDEF[mi2], prog = missionProg(mm), done = prog >= mm.target;
      var pct = Math.min(100, Math.round(prog / mm.target * 100));
      html += '<div class="mis' + (mm.got ? " done" : "") + '" data-mi="' + mi2 + '">';
      html += '<div class="box">' + (mm.got ? "✓" : "") + '</div>';
      html += '<div class="txt"><div class="t1">' + d.t(mm.target) + '</div>';
      html += '<div class="t2" data-mi-t="' + mi2 + '">' + won(Math.min(prog, mm.target)) + ' / ' + won(mm.target) +
              ' · 보상 ₩' + won(Math.round(480 * Math.pow(1.9, state.mRound - 1) * d.rw)) + '</div>';
      html += '<div class="bar"><i data-mi-bar="' + mi2 + '" style="width:' + pct + '%"></i></div></div>';
      if(!mm.got) html += '<button class="mini" data-act="claim" data-i="' + mi2 + '"' + (done ? "" : " disabled") + '>받기</button>';
      else html += '<span style="font-size:9px;color:#7be08e;font-weight:800">완료</span>';
      html += '</div>';
    });

  } else if(sheetKind === "minutes"){
    title.textContent = "회의록";
    sub.textContent = mt && mt.phase === "talk" ? "회의가 진행 중이에요 · 실시간" : "회의실에서 열린 회의 기록";
    html = minutesHTML();

  } else if(sheetKind === "rival"){
    title.textContent = "경쟁 현황";
    sub.textContent = "라이벌 " + RIVAL_NAME + " · 위기 " + state.ctr.crisis + "건 대응";
    html = rivalHTML();
  }
  body.innerHTML = html;
}

function refreshLive(){
  if(!sheetKind) return;
  var i, k, el;
  if(sheetKind === "inbox"){
    var sb = $("sheetSub");
    if(sb) sb.textContent = "대표님 결재 대기 " + state.inbox.length + "건 · 부서에서 처리 못 한 건만 올라와요";
    var lb = $("sheetBody").querySelector(".logbox");
    if(lb) lb.outerHTML = logHTML("자체 전결 · 부서 상신 · 위기 기록", 10);
  } else if(sheetKind === "staff"){
    var btns = document.querySelectorAll('#sheetBody [data-act="hire"], #sheetBody [data-act="lvup"], #sheetBody [data-act="promo"]');
    for(i = 0; i < btns.length; i++){
      var b = btns[i], gi = parseInt(b.getAttribute("data-gi"), 10);
      var act = b.getAttribute("data-act");
      if(act === "hire") b.disabled = state.money < hireCost(gi);
      else if(act === "lvup") b.disabled = state.money < lvCost(gi);
      else b.disabled = state.money < promoCost(gi) || state.staff[gi].lv < promoNeedLv(gi);
    }
    var sb2 = $("sheetSub");
    if(sb2) sb2.textContent = hiredCount() + "명 근무 · " + floorsOpen() + "개 층 · 총 " + won(ips()) + "원/초";
  } else if(sheetKind === "shop"){
    var ub = document.querySelectorAll('#sheetBody [data-act="buy"]');
    for(i = 0; i < ub.length; i++){
      var id = ub[i].getAttribute("data-id"), uu = upById(id);
      if(uu) ub[i].disabled = state.money < upCost(uu);
    }
  } else if(sheetKind === "mission"){
    for(i = 0; i < state.missions.length; i++){
      var m = state.missions[i], d = MDEF[i];
      if(!d) continue;
      var prog = missionProg(m), done = prog >= m.target;
      var t = document.querySelector('[data-mi-t="' + i + '"]');
      if(t) t.textContent = won(Math.min(prog, m.target)) + " / " + won(m.target) +
        " · 보상 ₩" + won(Math.round(480 * Math.pow(1.9, state.mRound - 1) * d.rw));
      var bar = document.querySelector('[data-mi-bar="' + i + '"]');
      if(bar) bar.style.width = Math.min(100, Math.round(prog / m.target * 100)) + "%";
      var cb = document.querySelector('#sheetBody [data-act="claim"][data-i="' + i + '"]');
      if(cb) cb.disabled = !done;
    }
  } else if(sheetKind === "rival"){
    var rv = $("sheetBody").querySelector(".rvbox");
    if(rv) rv.outerHTML = rivalHTML().split('<div class="stat2">')[0];
  }
}

function stampAt(x, y, text){
  var el = document.createElement("div");
  el.className = "stamp";
  el.textContent = text;
  el.style.left = Math.max(4, Math.min(window.innerWidth - 150, x - 56)) + "px";
  el.style.top = Math.max(40, y - 26) + "px";
  document.body.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add("go"); });
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 700);
}

/* =========================================================
   미션 · 부스트
   ========================================================= */
function missionProg(m){ return state.ctr[m.k] || 0; }
function missionDone(m){ return missionProg(m) >= m.target; }
function claimMission(i){
  var m = state.missions[i];
  if(!m || m.got || !missionDone(m)) { SFX.bad(); return false; }
  var d = MDEF[i];
  var reward = Math.round(480 * Math.pow(1.9, (state.mRound - 1)) * d.rw);
  var xp = Math.round(26 * state.mRound);
  state.money += reward; state.totalEarned += reward; state.ctr.earned += reward;
  m.got = true;
  addXp(xp);
  SFX.hire();
  toast("미션 완료! +₩" + won(reward), "gold");
  if(state.missions.every(function(x){ return x.got; })){
    state.mRound++;
    state.ctr = {approved:0,hired:0,upgrade:0,earned:0,levelups:0,quick:0,promo:0,crisis:0,floors:0};
    state.missions = buildMissions(state.mRound);
    toast("새로운 할 일 도착! " + state.mRound + "회차", "gold");
  }
  return true;
}
function startBoost(){
  var n = Date.now();
  if(n < state.boostReadyAt) { SFX.bad(); return false; }
  state.boostUntil = n + 30000;
  state.boostReadyAt = n + 30000 + 90000;
  SFX.boost();
  toast("2배 부스트! 30초간 수익이 두 배", "gold");
  return true;
}
