function wireUI(){
  $("tabs").addEventListener("click", function(e){
    var b = e.target.closest("button[data-tab]");
    if(!b) return;
    openSheet(b.getAttribute("data-tab"));
  });
  $("sheetClose").addEventListener("click", closeSheet);
  $("sheetWrap").addEventListener("click", function(e){
    if(e.target === $("sheetWrap")) closeSheet();
  });
  $("modal").addEventListener("click", function(e){
    var g = e.target.closest("[data-f]");
    if(g && g.id === "floorGo"){
      var fi = parseInt(g.getAttribute("data-f"), 10);
      var res = unlockFloor(fi);
      if(res === true){ hideModal(); buildFloorBar(); }
      else if(res === "money") toast("자금이 부족해요", "bad");
      else if(res === "prev") toast("아래 층부터 해금해 주세요", "bad");
      return;
    }
    if(e.target.closest("[data-close]")) hideModal();
  });
  $("meetBadge").addEventListener("click", function(){
    sheetKind = null;
    openSheet("minutes");
  });
  $("rivalBadge").addEventListener("click", function(){
    sheetKind = null;
    openSheet("rival");
  });

  $("criOpts").addEventListener("click", function(e){
    var b = e.target.closest("button[data-ci]");
    if(!b || b.disabled) return;
    resolveCrisis(parseInt(b.getAttribute("data-ci"), 10));
  });

  $("floorbar").addEventListener("click", function(e){
    var b = e.target.closest("button[data-f]");
    if(!b) return;
    var fi = parseInt(b.getAttribute("data-f"), 10);
    if(state.floors[fi]) switchFloor(fi);
    else { openFloorModal(fi); SFX.tap(); }
  });

  $("sheetBody").addEventListener("click", function(e){
    var btn = e.target.closest("[data-act]");
    if(!btn || btn.disabled) return;
    var act = btn.getAttribute("data-act");
    var r = btn.getBoundingClientRect();
    if(act === "approve"){
      var uid = parseInt(btn.getAttribute("data-uid"), 10);
      var oi = parseInt(btn.getAttribute("data-oi"), 10);
      var card = null;
      for(var i = 0; i < state.inbox.length; i++) if(state.inbox[i].uid === uid) card = state.inbox[i];
      if(!card) return;
      var res = approveCard(card, oi, false);
      if(res){
        stampAt(r.left + r.width / 2, r.top + r.height / 2, "승인");
        toast((res.gain >= 0 ? "+" : "") + "₩" + won(res.gain) + " · +" + res.xp + " 경험치", res.gain >= 0 ? "good" : "bad");
        var el = document.querySelector('#sheetBody .card[data-uid="' + uid + '"]');
        if(el && el.parentNode) el.parentNode.removeChild(el);
        if(sheetKind === "inbox" && !state.inbox.length) renderSheet();
        updateBadges();
        save();
      }
    } else if(act === "hire"){
      var hg = parseInt(btn.getAttribute("data-gi"), 10);
      if(hire(hg)){
        toast(empName(hg) + " · " + deptOf(hg).name + " 채용 완료!", "good");
        renderSheet(); updateBadges(); buildFloorBar(); save();
      } else toast("자금이 부족해요", "bad");
    } else if(act === "lvup"){
      var lg = parseInt(btn.getAttribute("data-gi"), 10);
      if(levelUp(lg)){
        toast(empName(lg) + " 레벨 " + state.staff[lg].lv + " 달성!", "good");
        renderSheet(); save();
      } else toast("자금이 부족해요", "bad");
    } else if(act === "promo"){
      var pg = parseInt(btn.getAttribute("data-gi"), 10);
      var pr = promote(pg);
      if(pr === true){
        toast(empName(pg) + " " + rankName(state.staff[pg].rank) + " 승진! 부서 전결 범위가 넓어졌어요", "gold");
        stampAt(r.left + r.width / 2, r.top + r.height / 2, "승진");
        renderSheet(); save();
      } else if(pr === "lv") toast("레벨 " + promoNeedLv(pg) + " 이상이어야 승진할 수 있어요", "bad");
      else toast("자금이 부족해요", "bad");
    } else if(act === "buy"){
      var up = upById(btn.getAttribute("data-id"));
      if(up){
        var br = buyUp(up);
        if(br === true){ renderSheet(); save(); }
        else if(br === "floor") toast(FLOORS[up.fl].name + "을 먼저 해금해 주세요", "bad");
        else toast("자금이 부족해요", "bad");
      }
    } else if(act === "claim"){
      if(claimMission(parseInt(btn.getAttribute("data-i"), 10))){ renderSheet(); save(); }
    } else if(act === "minutes"){
      openMinutesAt(parseInt(btn.getAttribute("data-m"), 10));
    } else if(act === "floor"){
      openFloorModal(parseInt(btn.getAttribute("data-f"), 10));
    } else if(act === "gofloor"){
      switchFloor(parseInt(btn.getAttribute("data-f"), 10));
      closeSheet();
    } else if(act === "poke"){
      var rv = rivalPoke();
      if(rv === "money") toast("자금이 부족해요", "bad");
      renderSheet(); updateBadges(); save();
    }
  });

  $("quickApprove").addEventListener("click", function(){
    if(!state.inbox.length){ SFX.bad(); return; }
    var card = state.inbox[0];
    var res = approveCard(card, 0, true);
    var b = $("quickApprove").getBoundingClientRect();
    stampAt(b.left + b.width / 2, b.top - 30, "승인");
    if(res) toast("빠른 결재 · +₩" + won(res.gain) + " · +" + res.xp + " 경험치", "good");
    if(sheetKind === "inbox"){
      var el = document.querySelector('#sheetBody .card[data-uid="' + card.uid + '"]');
      if(el && el.parentNode) el.parentNode.removeChild(el);
      if(!state.inbox.length) renderSheet();
    }
    updateBadges();
    save();
  });

  $("boostBtn").addEventListener("click", function(){ startBoost(); });

  $("muteBtn").addEventListener("click", function(){
    state.muted = !state.muted;
    soundOn = !state.muted;
    $("muteBtn").textContent = state.muted ? "🔇" : "🔊";
    if(!state.muted) SFX.tap();
    save();
  });

  cv.addEventListener("click", function(ev){
    var rect = cv.getBoundingClientRect();
    var lx = (ev.clientX - rect.left - view.ox) / view.s;
    var ly = (ev.clientY - rect.top - view.oy) / view.s;
    var k, gi;
    for(k in live){
      gi = +k;
      var l = live[gi];
      if(!l) continue;
      if(Math.abs(lx - l.x) < 8 && ly > l.y - 24 && ly < l.y + 3){
        var s = state.staff[gi];
        toast(empName(gi) + " " + rankName(s.rank) + " · " + deptOf(gi).name + " · 레벨 " + s.lv +
              " · +" + won(empInc(gi) * mult()) + "/초");
        say(gi, s.rank === 0 ? "열심히 배울게요!" : "맡겨 주세요!", 2500, true);
        SFX.tap();
        return;
      }
    }
    /* 대표실 */
    if(lx > 124 && ly < 44 && state.fi === 0){ openSheet("inbox"); return; }
    /* 엘리베이터 → 다음 층 */
    if(lx > 92 && lx < 122 && ly < 44){
      var next = -1;
      for(var f = 1; f <= 4; f++){
        var idx = (state.fi + f) % 4;
        if(state.floors[idx]){ next = idx; break; }
      }
      if(next >= 0 && next !== state.fi) switchFloor(next);
      else openFloorModal(Math.min(3, state.fi + 1));
      return;
    }
    /* 회의실 */
    var mw = 84 + (state.up.meeting || 0) * 8;
    if(lx > 2 && lx < 6 + mw && ly > 203 && ly < 250){ openSheet("minutes"); return; }
    /* 부서 행 */
    for(var r = 0; r < DEPT_PER_FLOOR; r++){
      if(ly >= ROW_Y[r] - 2 && ly <= ROW_Y[r] + 52){
        openSheet("staff");
        return;
      }
    }
    if(ly > 205) openSheet("shop");
  });

  document.addEventListener("visibilitychange", function(){
    if(document.hidden) save();
  });
  window.addEventListener("pagehide", save);
  window.addEventListener("resize", function(){ resize(); });
  window.addEventListener("orientationchange", function(){ setTimeout(resize, 220); });
}

/* =========================================================
   루프
   ========================================================= */
var lastT = 0, saveAcc = 0, hudAcc = 0, refreshAcc = 0;
var rivalAcc = 0, barSig = "";

function tick(dt){
  var now = Date.now();
  var gain = ips(now) * dt;
  if(gain > 0){
    state.money += gain;
    state.totalEarned += gain;
    state.ctr.earned += gain;
  }
  if(now >= state.nextCardAt){
    spawnCard();
    state.nextCardAt = now + cardInterval() * 1000;
  }
  if(!state.crisis && now >= state.nextCrisisAt) startCrisis();
  if(state.crisis && now >= state.crisis.end) timeoutCrisis();

  /* 라이벌 점유율은 천천히 올라간다 */
  rivalAcc += dt;
  if(rivalAcc > 14){
    rivalAcc = 0;
    if(state.rival.share < 90) state.rival.share = clamp(state.rival.share + 0.7, 0, 90);
  }
  /* 사기는 60을 향해 천천히 돌아온다 */
  state.morale += (60 - state.morale) * 0.004 * dt;

  updateActors(dt);
  updateMeeting();
}

function updateHUD(now){
  $("money").textContent = won(state.money);
  var buff = now < state.buffUntil ? " · 회의 +10%" : "";
  $("ips").textContent = "+" + won(ips(now)) + "/초" + (now < state.boostUntil ? " ×2" : "") + buff;
  $("lv").textContent = state.level;
  var need = needXp(state.level);
  $("xpfill").style.width = Math.min(100, state.xp / need * 100) + "%";
  if(now < state.boostUntil){
    $("boostLabel").textContent = "🔥 부스트 " + Math.ceil((state.boostUntil - now) / 1000) + "초";
    $("boostBtn").disabled = true;
  } else if(now < state.boostReadyAt){
    $("boostLabel").textContent = "🔥 대기 " + Math.ceil((state.boostReadyAt - now) / 1000) + "초";
    $("boostBtn").disabled = true;
  } else {
    $("boostLabel").textContent = "🔥 2배 부스트";
    $("boostBtn").disabled = false;
  }
  $("rivalPct").textContent = Math.round(state.rival.share);
  var sig = "";
  for(var i = 0; i < FLOORS.length; i++) sig += (state.floors[i] ? "1" : "0") + floorHired(i) + "|" + (state.fi === i ? "a" : "b");
  if(sig !== barSig){ barSig = sig; buildFloorBar(); }
  meetBadge();
  updateCrisisHUD();
}

function loop(ts){
  requestAnimationFrame(loop);
  if(!lastT) lastT = ts;
  var dt = Math.min(0.12, Math.max(0, (ts - lastT) / 1000));
  lastT = ts;
  tick(dt);
  var nb = (Math.floor(Date.now() / 560) % 2) === 0;
  if(nb !== ceoBob){ ceoBob = nb; drawBG(); }
  drawScene();
  hudAcc += dt;
  if(hudAcc > 0.12){ hudAcc = 0; updateHUD(Date.now()); }
  saveAcc += dt;
  if(saveAcc > 6){ saveAcc = 0; save(); }
  refreshAcc += dt;
  if(refreshAcc > 0.6){ refreshAcc = 0; refreshLive(); }
}

/* =========================================================
   시작
   ========================================================= */
function init(){
  var loaded = load();
  var offlineGain = 0, away = 0, updNote = "";
  if(loaded){
    state = loaded;
    updNote = state.updNote || "";
    state.updNote = "";
    away = (Date.now() - (state.savedAt || Date.now())) / 1000;
    if(away > 60 && state.staff.some(function(s){ return s.hired; })){
      offlineGain = ips() * Math.min(away, MAXH) * 0.5;
      if(offlineGain < 1) offlineGain = 0;
    }
    state.money += offlineGain;
    if(offlineGain > 0){ state.totalEarned += offlineGain; }
    state.savedAt = Date.now();
    if(!state.nextCardAt || state.nextCardAt < Date.now() - 60000) state.nextCardAt = Date.now() + 4000;
  } else {
    state = newState();
    state.nextCardAt = Date.now() + 5000;
  }
  if(!state.nextMeetAt || state.nextMeetAt < Date.now() - 60000) state.nextMeetAt = Date.now() + 22000;
  if(!state.nextCrisisAt || state.nextCrisisAt < Date.now() - 30000) state.nextCrisisAt = Date.now() + 45000;
  if(state.crisis){ state.crisis = null; scheduleCrisis(Date.now()); }
  soundOn = !state.muted;
  $("muteBtn").textContent = state.muted ? "🔇" : "🔊";

  uidC = 0;
  for(var i = 0; i < state.inbox.length; i++) if(state.inbox[i].uid > uidC) uidC = state.inbox[i].uid;
  rebuildLive();
  buildFloorBar();
  drawBG();
  resize();
  wireUI();
  updateBadges();
  updateHUD(Date.now());
  requestAnimationFrame(loop);

  setTimeout(function(){
    if(updNote){
      showModal(
        '<div class="kick">사옥 확장 업데이트 · 버전 ' + VER + '</div>' +
        '<h2>사무실이 사옥이 됐어요</h2>' +
        '<p>한 부서에 <b>여러 명</b>이 함께 일하고, <b>직급이 섞여</b> 앉아요.</p>' +
        '<ul>' +
        '<li>🏢 <b>사옥 확장</b> — 2층 · 3층 · 옥상 루프탑까지 해금</li>' +
        '<li>👥 <b>부서 다인원</b> — 부서마다 최대 4명, 인턴부터 이사까지</li>' +
        '<li>🏃 <b>부서 내 상신</b> — 같은 부서 상사 책상으로 직접 걸어가 결재</li>' +
        '<li>⚠️ <b>돌발 위기</b> — 서버 다운 · 감사 · 복지 요구를 제한 시간 안에</li>' +
        '<li>⚔️ <b>라이벌전</b> — 경쟁사 점유율을 낮춰라</li>' +
        '</ul>' +
        '<p style="font-size:10px;opacity:.7">기존 직원은 부서의 첫 자리로 옮겨졌고, 직급은 그대로예요.</p>' +
        '<button class="go" data-close>사옥 열기</button>'
      );
    } else if(!state.intro){
      state.intro = true; save();
      showModal(
        '<div class="kick">AI 사무실 · 사장실</div>' +
        '<h2>오늘도 바쁜 AI 사무실</h2>' +
        '<p>대표님, 오늘도 혼자 다 하실 건가요?<br>AI 직원을 채용하고, 결재만 눌러 주세요.</p>' +
        '<ul>' +
        '<li>📥 <b>결재함</b> — 부서에서 못 끝낸 서류만 올라와요</li>' +
        '<li>🤖 <b>직원</b> — 부서별 채용 · 레벨업 · 승진</li>' +
        '<li>🏢 <b>시설</b> — 층 해금과 사옥 업그레이드</li>' +
        '<li>⚠️ <b>돌발 위기</b> — 화면 위 알림에서 바로 대응</li>' +
        '<li>⚔️ <b>경쟁</b> — 라이벌 점유율 관리</li>' +
        '</ul>' +
        '<p style="font-size:10px;opacity:.65">진행 상황은 자동으로 저장돼요.</p>' +
        '<button class="go" data-close>사무실 열기</button>'
      );
    } else if(offlineGain > 0){
      var hh = Math.floor(away / 3600), mm = Math.floor((away % 3600) / 60);
      showModal(
        '<div class="kick">오프라인 정산</div>' +
        '<h2>자리를 비운 사이</h2>' +
        '<p>직원들이 열심히 일했어요. (' + (hh ? hh + "시간 " : "") + mm + "분)" +
        (away > MAXH ? "<br><span style=\"opacity:.6\">최대 8시간까지만 정산돼요</span>" : "") + '</p>' +
        '<div class="big">+₩' + won(offlineGain) + '</div>' +
        '<p style="text-align:center;font-size:10px;opacity:.65">보관함에 자동으로 들어갔어요</p>' +
        '<button class="go" data-close>확인</button>'
      );
      SFX.coin();
    }
  }, 420);

  save();
}

init();
})();
</script>
