<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#131a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>오늘도 바쁜 AI 사무실 · 도트 오피스 타이쿤</title>
<style>
:root{
  --ink:#0a0e1a; --panel:#1c2542; --panel2:#27335c; --panel3:#33406e;
  --gold:#ffd479; --green:#7be08e; --red:#ff7a7a; --blue:#5cc6e8; --violet:#a98bff;
  --txt:#eaf0ff; --dim:#93a4cf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0f1c;overscroll-behavior:none;}
body{
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--txt);user-select:none;-webkit-user-select:none;touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}
#app{
  position:fixed;inset:0;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
  background:radial-gradient(130% 70% at 50% 0%,#2a3563 0%,#171f38 48%,#0a0e1a 100%);
}

/* ---------- header ---------- */
#hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px 5px;flex:0 0 auto;}
.hdr-l{min-width:0;}
.kicker{font-size:8px;letter-spacing:1.6px;font-weight:700;color:#7f92c4;line-height:1;}
h1{margin:3px 0 0;font-size:15px;font-weight:800;letter-spacing:-.4px;color:#fff;line-height:1.1;
   text-shadow:2px 2px 0 #05070f;}
.hdr-r{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
.badge{font-size:9px;font-weight:800;letter-spacing:.2px;background:var(--panel2);color:var(--gold);
  border:2px solid var(--ink);padding:3px 6px;box-shadow:0 2px 0 var(--ink);white-space:nowrap;}
.iconbtn{width:30px;height:28px;display:grid;place-items:center;font-size:13px;background:var(--panel2);
  color:var(--txt);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);padding:0;cursor:pointer;line-height:1;}
.iconbtn:active{transform:translateY(2px);box-shadow:none;}

/* ---------- hud ---------- */
#hud{display:flex;align-items:center;gap:8px;margin:0 10px 5px;padding:5px 9px;background:var(--panel);
  border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);flex:0 0 auto;}
.hud-money{display:flex;align-items:baseline;gap:2px;min-width:0;}
.hud-money .w{font-size:11px;font-weight:800;color:var(--gold);opacity:.85;}
#money{font-size:16px;font-weight:800;color:var(--gold);letter-spacing:.3px;white-space:nowrap;
  font-variant-numeric:tabular-nums;}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.hud-line{display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
#ips{font-size:10px;font-weight:800;color:var(--green);white-space:nowrap;}
.hud-lv{font-size:9px;font-weight:800;color:var(--dim);white-space:nowrap;}
.hud-lv b{color:#fff;}
.xpbar{height:5px;background:#0f1730;border:1px solid #000;overflow:hidden;}
.xpbar i{display:block;height:100%;width:0%;background:linear-gradient(#ffe9a8,var(--gold));transition:width .25s linear;}

/* ---------- stage ---------- */
#stage{position:relative;flex:1 1 auto;margin:0 6px;min-height:0;overflow:hidden;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;
  image-rendering:crisp-edges;}
#toastLayer{position:absolute;left:0;right:0;top:6px;display:flex;flex-direction:column;align-items:center;
  gap:4px;pointer-events:none;z-index:6;}
.toast{font-size:11px;font-weight:800;padding:5px 10px;background:rgba(16,22,40,.94);color:#fff;
  border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);animation:toastIn .22s ease-out both;max-width:96%;}
.toast.good{color:var(--green);border-color:#0a1a10;background:rgba(14,34,24,.96);}
.toast.bad{color:var(--red);}
.toast.gold{color:var(--gold);background:rgba(40,32,10,.96);}
@keyframes toastIn{from{opacity:0;transform:translateY(-6px) scale(.96);}to{opacity:1;transform:none;}}
.toast.out{animation:toastOut .3s ease-in forwards;}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px);}}

/* 회의 중 배지 (캔버스 위) */
.meetbadge{position:absolute;right:7px;bottom:7px;z-index:7;display:flex;align-items:center;gap:4px;
  font-family:inherit;font-size:10.5px;font-weight:800;color:#20160a;
  background:linear-gradient(#ffe1a0,#ffbe4d);border:2px solid var(--ink);
  box-shadow:0 3px 0 var(--ink);padding:6px 9px;cursor:pointer;line-height:1;
  animation:mbPulse 1.6s ease-in-out infinite;}
@keyframes mbPulse{50%{transform:translateY(-2px);}}
.meetbadge:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);}

/* ---------- quickbar ---------- */
#quickbar{display:flex;gap:6px;padding:6px 10px 4px;flex:0 0 auto;}
.qbtn{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:5px;
  font-family:inherit;font-size:12px;font-weight:800;letter-spacing:-.2px;color:#20160a;
  background:linear-gradient(#ffe1a0,#ffbe4d);border:2px solid var(--ink);
  box-shadow:0 4px 0 var(--ink);padding:9px 4px;cursor:pointer;}
.qbtn.alt{background:linear-gradient(#b7e7ff,#63c2ee);color:#08202c;}
.qbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.qbtn[disabled]{background:#3a4463;color:#8892b0;box-shadow:0 4px 0 #1a2136;cursor:default;transform:none;}
.qbtn .cnt{position:absolute;top:-6px;right:-4px;min-width:17px;height:16px;font-size:9px;line-height:14px;
  text-align:center;background:var(--red);color:#fff;border:2px solid var(--ink);padding:0 3px;}
.qbtn .sub{font-size:9px;font-weight:700;opacity:.75;}

/* ---------- tabs ---------- */
#tabs{display:flex;gap:4px;padding:4px 8px calc(6px + env(safe-area-inset-bottom,0px));flex:0 0 auto;}
#tabs button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;
  font-family:inherit;font-size:10px;font-weight:800;color:var(--dim);background:var(--panel);
  border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:6px 1px 5px;cursor:pointer;
  letter-spacing:-.3px;}
#tabs button .ico{font-size:13px;line-height:1;}
#tabs button.on{color:#20160a;background:linear-gradient(#ffe1a0,#ffc663);}
#tabs button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);}
#tabs button b{position:absolute;top:-6px;right:-3px;min-width:16px;height:16px;font-size:8px;line-height:14px;
  text-align:center;background:var(--red);color:#fff;border:2px solid var(--ink);padding:0 3px;}
.hidden{display:none !important;}

/* ---------- sheet ---------- */
#sheetWrap{position:fixed;left:0;right:0;top:0;bottom:var(--tabh,54px);z-index:20;display:flex;
  flex-direction:column;justify-content:flex-end;background:rgba(4,7,14,.55);
  animation:fade .18s ease-out both;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
#sheet{background:#151d34;border-top:3px solid var(--ink);max-height:100%;
  display:flex;flex-direction:column;box-shadow:0 -4px 0 rgba(0,0,0,.5);
  padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s cubic-bezier(.2,.9,.3,1) both;}
@keyframes up{from{transform:translateY(30px);}to{transform:none;}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 8px;
  border-bottom:2px solid #0a1024;background:#1a2440;}
.sheet-head h2{margin:0;font-size:13px;font-weight:800;letter-spacing:-.3px;}
.sheet-head .sub{font-size:9px;color:var(--dim);font-weight:700;margin-top:2px;}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 14px;display:flex;
  flex-direction:column;gap:8px;}

/* ---------- cards ---------- */
.card{background:var(--panel);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:9px 10px;
  animation:cardIn .22s ease-out both;}
@keyframes cardIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.card .top{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.chip{font-size:8px;font-weight:800;letter-spacing:.2px;padding:2px 5px;color:#0b1020;border:1px solid #000;
  white-space:nowrap;}
.card h3{margin:0;font-size:12.5px;font-weight:800;letter-spacing:-.3px;line-height:1.2;flex:1;}
.card p{margin:0 0 6px;font-size:11px;line-height:1.45;color:#c3cfeb;letter-spacing:-.2px;}
.lineup{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:7px;}
.tag{font-size:8.5px;font-weight:800;padding:2px 5px;color:#0b1020;border:1px solid #000;white-space:nowrap;}
.tag.dark{background:#39435f;color:#c7d2ec;}
.opts{display:flex;flex-direction:column;gap:5px;}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:inherit;
  font-size:11.5px;font-weight:700;text-align:left;color:var(--txt);background:var(--panel2);
  border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:8px 9px;cursor:pointer;line-height:1.2;}
.opt .lbl{flex:1;}
.opt .rw{font-size:10px;font-weight:800;white-space:nowrap;}
.opt .rw .m{color:var(--gold);}
.opt .rw .x{color:var(--blue);}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);background:#31407a;}
.empty{text-align:center;font-size:11px;color:var(--dim);padding:26px 12px;line-height:1.6;}

/* ---------- staff / shop rows ---------- */
.row{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--ink);
  box-shadow:0 3px 0 var(--ink);padding:8px 9px;}
.row.locked{opacity:.5;}
.swatch{width:22px;height:22px;flex:0 0 auto;border:2px solid var(--ink);position:relative;overflow:hidden;}
.swatch:after{content:"";position:absolute;left:3px;top:4px;width:16px;height:5px;background:rgba(10,14,26,.55);}
.row .meta{flex:1;min-width:0;}
.row .nm{font-size:12px;font-weight:800;letter-spacing:-.2px;}
.row .nm .rk{font-size:10px;font-weight:800;}
.row .nm em{font-style:normal;font-size:9px;font-weight:800;color:var(--gold);margin-left:4px;}
.row .jb{font-size:10px;color:var(--dim);font-weight:700;margin-top:1px;}
.row .inc{font-size:10px;font-weight:800;color:var(--green);margin-top:2px;}
.row .scope{font-size:9px;font-weight:800;color:#9fb0c7;margin-top:1px;}
.row .act{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.mini{font-family:inherit;font-size:10.5px;font-weight:800;color:#20160a;background:linear-gradient(#ffe1a0,#ffc04d);
  border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);padding:6px 8px;cursor:pointer;line-height:1;white-space:nowrap;}
.mini:active{transform:translateY(2px);box-shadow:none;}
.mini.blue{background:linear-gradient(#bfe9ff,#6cc6ee);color:#08202c;}
.mini.purple{background:linear-gradient(#e2d6ff,#b79bff);color:#150a2c;}
.mini[disabled]{background:#39435f;color:#8b95b3;box-shadow:0 2px 0 #1a2136;transform:none;cursor:default;}
.mini.grey{background:#3a4566;color:#b9c4e0;}
.pips{display:flex;gap:2px;}
.pips i{width:9px;height:5px;background:#2c3757;border:1px solid #000;}
.pips i.on{background:var(--gold);}

/* ---------- missions ---------- */
.mis{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--ink);
  box-shadow:0 3px 0 var(--ink);padding:9px;}
.mis .box{width:18px;height:18px;flex:0 0 auto;border:2px solid #000;background:#0f1730;display:grid;
  place-items:center;font-size:12px;color:#0b1020;font-weight:900;}
.mis.done .box{background:var(--green);}
.mis .txt{flex:1;min-width:0;}
.mis .t1{font-size:11.5px;font-weight:800;letter-spacing:-.2px;}
.mis .t2{font-size:9.5px;color:var(--dim);font-weight:700;margin-top:2px;}
.mis.done .t1{color:var(--green);}
.mis .bar{height:4px;background:#0f1730;border:1px solid #000;margin-top:4px;overflow:hidden;}
.mis .bar i{display:block;height:100%;background:var(--blue);width:0%;}

/* ---------- 회의록 ---------- */
.mt{background:var(--panel);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:9px 10px;
  animation:cardIn .22s ease-out both;}
.mt .mhead{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.mt h3{margin:0;font-size:12.5px;font-weight:800;letter-spacing:-.3px;line-height:1.25;flex:1;}
.live{font-size:8px;font-weight:800;padding:2px 5px;color:#2a0a0a;background:var(--red);border:1px solid #000;
  white-space:nowrap;animation:blink 1.2s steps(2,end) infinite;}
@keyframes blink{50%{opacity:.4;}}
.pin{font-size:8px;font-weight:800;padding:2px 5px;color:#0b1020;background:#93a4cf;border:1px solid #000;white-space:nowrap;}
.mt .meta{font-size:9.5px;color:var(--dim);font-weight:700;margin-bottom:6px;}
.chiprow{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px;}
.who{font-size:9px;font-weight:800;padding:2px 5px;color:#0b1020;border:1px solid #000;background:#9fb0c7;white-space:nowrap;}
.who .w{font-weight:900;opacity:.75;}
.ln{display:flex;gap:6px;font-size:11px;line-height:1.45;margin-bottom:5px;color:#dbe4f7;}
.ln b{font-size:9.5px;color:var(--gold);white-space:nowrap;font-weight:800;padding-top:1px;}
.ln b i{font-style:normal;font-size:8px;color:var(--dim);font-weight:700;}
.ln .say{flex:1;letter-spacing:-.15px;}
.ln.wait .say{color:#7f8db0;font-style:italic;}
.reward{font-size:10px;font-weight:800;color:var(--green);margin-top:6px;}

/* ---------- 결재 로그 ---------- */
.logbox{background:#141c31;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:8px 9px;}
.logbox .lh{font-size:9px;font-weight:800;color:#93a4cf;letter-spacing:.4px;margin-bottom:5px;}
.logrow{display:flex;gap:6px;font-size:10px;line-height:1.45;color:#c3cfeb;margin-bottom:4px;align-items:flex-start;}
.logrow .lt{font-size:8px;font-weight:800;padding:1px 4px;border:1px solid #000;color:#0b1020;white-space:nowrap;margin-top:1px;}
.logrow .ls{flex:1;letter-spacing:-.2px;}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:22px;
  background:rgba(4,7,14,.72);}
.mbox{width:100%;max-width:330px;max-height:86vh;overflow-y:auto;background:#18213c;border:3px solid var(--ink);
  box-shadow:0 6px 0 var(--ink);padding:16px 15px 14px;animation:pop .24s cubic-bezier(.2,1.2,.4,1) both;}
@keyframes pop{from{transform:scale(.88);opacity:0;}to{transform:none;opacity:1;}}
.mbox h2{margin:0 0 3px;font-size:15px;font-weight:800;letter-spacing:-.4px;color:#fff;}
.mbox .kick{font-size:8px;letter-spacing:1.4px;color:#7f92c4;font-weight:700;}
.mbox p{margin:8px 0 0;font-size:11.5px;line-height:1.6;color:#c3cfeb;letter-spacing:-.2px;}
.mbox .big{font-size:22px;font-weight:800;color:var(--gold);text-align:center;margin:12px 0 2px;
  letter-spacing:-.5px;}
.mbox ul{margin:8px 0 0;padding-left:16px;font-size:11px;line-height:1.75;color:#c3cfeb;}
.mbox .go{width:100%;margin-top:14px;font-family:inherit;font-size:13px;font-weight:800;color:#20160a;
  background:linear-gradient(#ffe1a0,#ffbe4d);border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);
  padding:11px;cursor:pointer;}
.mbox .go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.mbox .mline{display:flex;gap:6px;font-size:11px;line-height:1.5;color:#dbe4f7;margin-bottom:6px;}
.mbox .mline b{font-size:9.5px;color:var(--gold);white-space:nowrap;}

.stamp{position:fixed;z-index:40;pointer-events:none;font-size:26px;font-weight:900;color:#ff5a5a;
  border:4px solid #ff5a5a;padding:2px 10px;transform:rotate(-11deg);opacity:0;
  text-shadow:2px 2px 0 rgba(0,0,0,.35);letter-spacing:2px;}
.stamp.go{animation:stampGo .62s cubic-bezier(.2,1.4,.4,1) forwards;}
@keyframes stampGo{
  0%{opacity:0;transform:rotate(-11deg) scale(2.4);}
  35%{opacity:1;transform:rotate(-11deg) scale(1);}
  70%{opacity:1;transform:rotate(-11deg) scale(1);}
  100%{opacity:0;transform:rotate(-11deg) scale(1.06) translateY(-8px);}
}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="hdr-l">
      <div class="kicker">AI 사무실 운영일지</div>
      <h1>오늘도 바쁜 AI 사무실</h1>
    </div>
    <div class="hdr-r">
      <button id="muteBtn" class="iconbtn" aria-label="소리">🔊</button>
      <div class="badge">직원 <span id="staffN">0</span>명</div>
    </div>
  </header>

  <div id="hud">
    <div class="hud-money"><span class="w">₩</span><span id="money">0</span></div>
    <div class="hud-mid">
      <div class="hud-line">
        <span id="ips">+0/초</span>
        <span class="hud-lv">레벨 <b id="lv">1</b> <span id="lvBonus"></span></span>
      </div>
      <div class="xpbar"><i id="xpfill"></i></div>
    </div>
  </div>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="toastLayer"></div>
    <button class="meetbadge hidden" id="meetBadge">🗣 회의 중! 보기</button>
  </main>

  <div id="quickbar">
    <button class="qbtn" id="quickApprove"><span>⚡ 빠른 결재</span><span class="cnt hidden" id="qCnt">0</span></button>
    <button class="qbtn alt" id="boostBtn"><span id="boostLabel">🔥 2배 부스트</span></button>
  </div>

  <nav id="tabs">
    <button data-tab="inbox"><span class="ico">📥</span>결재함<b class="hidden" id="tabInboxN">0</b></button>
    <button data-tab="staff"><span class="ico">🤖</span>직원</button>
    <button data-tab="shop"><span class="ico">🏢</span>시설</button>
    <button data-tab="mission"><span class="ico">✅</span>할 일</button>
    <button data-tab="minutes"><span class="ico">🗣</span>회의록<b class="hidden" id="tabMeetN">회의</b></button>
  </nav>
</div>

<div id="sheetWrap" class="hidden">
  <div id="sheet">
    <div class="sheet-head">
      <div>
        <h2 id="sheetTitle">결재함</h2>
        <div class="sub" id="sheetSub"></div>
      </div>
      <button class="iconbtn" id="sheetClose" aria-label="닫기">✕</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="modal" class="hidden"></div>

<script>
(function(){
"use strict";

/* =========================================================
   오늘도 바쁜 AI 사무실 · 도트 오피스 타이쿤
   v1.1.0 — 직급 · 전결/상신 · 회의록
   완전 오프라인 단일 파일 픽셀 게임
   ========================================================= */

var W = 200, H = 266;                       // 게임 논리 해상도(픽셀)
var SAVE_KEY = "aiOfficeTycoon.save.v1";    // 기존 세이브를 그대로 읽는다
var MAXH = 8 * 3600;                        // 오프라인 정산 최대 8시간
var VER = "1.1.0";

function $(id){ return document.getElementById(id); }
function R(c, col, x, y, w, h){
  c.fillStyle = col;
  c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function won(n){
  n = Math.floor(n);
  var neg = n < 0; if(neg) n = -n;
  var s;
  if(n >= 100000000) s = (n / 100000000).toFixed(1).replace(/\.0$/,"") + "억";
  else if(n >= 10000) s = (n / 10000).toFixed(1).replace(/\.0$/,"") + "만";
  else s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-" : "") + s;
}
function pad2(n){ return n < 10 ? "0" + n : "" + n; }
function timeStr(t){
  var d = new Date(t);

/* 결재 권한 등급 — 카드의 금액 규모로 필요 직급이 정해진다 */
function cardNeed(c){
  if(c[4] === "CEO") return CEO_NEED;
  var mx = 0, i;
  for(i = 0; i < c[3].length; i++) if(c[3][i][1] > mx) mx = c[3][i][1];
  if(mx >= 320) return CEO_NEED;   // 대표님 전용
  if(mx >= 260) return 5;          // 이사
  if(mx >= 220) return 4;          // 부장
  if(mx >= 170) return 3;          // 차장
  if(mx >= 110) return 2;          // 과장
  if(mx >= 60)  return 1;          // 대리
  return 0;                        // 인턴
}
function needLabel(n){
  if(n >= CEO_NEED) return "대표님 전용";
  return rankName(n) + " 이상";
}

function buildMissions(round){
  return MDEF.map(function(d){
    var target = d.k === "earned"
      ? Math.round(d.base * Math.pow(2.3, round - 1))
      : Math.max(1, Math.round(d.base * Math.pow(1.7, round - 1)));
    return {k:d.k, target:target, got:false};
  });
}

function newState(){
  var st = {
    v:2, money:380, totalEarned:0, xp:0, level:1, approved:0, quick:0,
    staff:[], up:{}, inbox:[], log:[], meetings:[], autoCount:0,
    ctr:{approved:0,hired:0,upgrade:0,earned:0,levelups:0,quick:0,promo:0},
    mRound:1, missions:[], nextCardAt:0, nextMeetAt:0, buffUntil:0,
    muted:false, boostUntil:0, boostReadyAt:0,
    savedAt:Date.now(), intro:false, updNote:""
  };
  for(var i=0;i<12;i++) st.staff.push({hired:false, lv:1, rank:0});
  for(var u=0;u<UPGRADES.length;u++) st.up[UPGRADES[u].id] = 0;
  st.missions = buildMissions(1);
  return st;
}

}

/* v1.0.0 세이브도 그대로 읽고, 새 필드는 기본값으로 채운다 */
function load(){
  var raw = null;
  try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){}
  if(!raw) return null;
  try{
    var st = JSON.parse(raw);
    if(!st || (st.v !== 1 && st.v !== 2)) return null;
    var base = newState();
    var fromV1 = (st.v === 1);
    for(var k in base){ if(!(k in st)) st[k] = base[k]; }
    if(!st.staff || st.staff.length !== 12) st.staff = base.staff;
    for(var u=0;u<UPGRADES.length;u++){ if(typeof st.up[UPGRADES[u].id] !== "number") st.up[UPGRADES[u].id] = 0; }
    if(!st.missions || !st.missions.length) st.missions = buildMissions(st.mRound||1);
    while(st.missions.length < MDEF.length){
      var mi = st.missions.length;
      st.missions.push({k:MDEF[mi].k, target:1, got:false});
    }
    if(!st.inbox) st.inbox = [];
    /* v1 세이브에 남아 있던 결재 카드도 새 규칙으로 읽을 수 있게 채운다 */
    st.inbox.forEach(function(c){
      if(typeof c.need !== "number") c.need = (typeof c.ci === "number" && CARDS[c.ci]) ? cardNeed(CARDS[c.ci]) : CEO_NEED;
      if(typeof c.by !== "number") c.by = -1;
      if(typeof c.scale !== "number" || !c.scale) c.scale = 1;
      c.done = true;
      if(!c.opts) c.opts = [["승인", 100, 10]];
    });
    if(!st.log) st.log = [];
    if(!st.meetings) st.meetings = [];
    if(!st.ctr) st.ctr = base.ctr;
    if(typeof st.ctr.promo !== "number") st.ctr.promo = 0;
    if(typeof st.autoCount !== "number") st.autoCount = 0;
    if(typeof st.nextMeetAt !== "number") st.nextMeetAt = 0;
    if(typeof st.buffUntil !== "number") st.buffUntil = 0;
    st.staff.forEach(function(s){
      if(!s.lv) s.lv = 1;
      if(typeof s.rank !== "number" || isNaN(s.rank)) s.rank = 0;
      s.rank = clamp(Math.round(s.rank), 0, MAXRANK);
    });
    if(fromV1){
      /* v1 세이브: 레벨만큼 쌓인 경력을 직급으로 인정 (최대 차장) */
      st.staff.forEach(function(s){ if(s.hired) s.rank = clamp(Math.floor((s.lv - 1) / 2), 0, 3); });
      st.updNote = VER;
    }
    st.v = 2;
    return st;
  }catch(e){ return null; }
}

var AC = null, soundOn = true;
function ac(){
  if(AC === null){
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ AC = false; }
  }
  if(AC && AC.state === "suspended" && AC.resume) AC.resume();
  return AC || null;
}
function tone(freq, dur, type, vol, when, slideTo){
  if(!soundOn) return;
  var a = ac(); if(!a) return;
  try{
    var t0 = a.currentTime + (when || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.10, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }catch(e){}
}

function staffInc(i){
  var s = state.staff[i];
  return ROLES[i].base * (1 + 0.35 * (s.lv - 1)) * rankMul(s.rank);
}
function ips(now){
  var t = 0;
  for(var i=0;i<12;i++) if(state.staff[i].hired) t += staffInc(i);
  t *= mult();
  if(now && now < state.boostUntil) t *= 2;
  return t;
}
function hiredCount(){ var n=0; for(var i=0;i<12;i++) if(state.staff[i].hired) n++; return n; }
function nextSlot(){ for(var i=0;i<12;i++) if(!state.staff[i].hired) return i; return -1; }
function hireCost(i){ return Math.round(240 * Math.pow(1.78, i)); }
function lvCost(i){
  var lv = state.staff[i].lv;
  if(lv >= 10) return Infinity;
  return Math.round(140 * Math.pow(1.85, lv - 1) * (1 + i * 0.15));
}
function promoCost(i){
  var r = state.staff[i].rank;
  if(r >= MAXRANK) return Infinity;
  return Math.round(900 * Math.pow(3.0, r) * (1 + i * 0.08));
}
function promoNeedLv(i){ return 3 + state.staff[i].rank; }
function needXp(lv){ return Math.round(110 * Math.pow(1.42, lv - 1)); }
function upCost(u){
  var lv = state.up[u.id];
  if(lv >= u.max) return Infinity;
  return Math.round(u.cost * Math.pow(u.step, lv));
}

function addXp(n){
  state.xp += n;
  var ups = 0;
  while(state.xp >= needXp(state.level) && state.level < 60){
    state.xp -= needXp(state.level);
    state.level++;
    ups++;
  }
  if(ups){
    SFX.level();
    toast("레벨 " + state.level + " 달성! 수익 +" + (ups * 3) + "%", "gold");
  }
}

/* =========================================================
   결재 카드 · 전결/상신
   ========================================================= */
var CARD_CAP = 8;
function cardScale(){
  return 1 + state.approved * 0.03 + (state.level - 1) * 0.14;
}
function pendingSet(){
  var set = {};
  for(var i = 0; i < state.inbox.length; i++) set[state.inbox[i].ci] = 1;
  return set;
}
function pickCardIndex(){
  var hired = [], pending = pendingSet(), i;
  for(i = 0; i < 12; i++) if(state.staff[i].hired) hired.push(ROLES[i].id);
  for(var attempt = 0; attempt < 14; attempt++){
    var ci = -1;
    if(hired.length && Math.random() < 0.62){
      var pool = [];
      for(var c = 0; c < CARDS.length; c++) if(hired.indexOf(CARDS[c][0]) >= 0) pool.push(c);
      if(pool.length) ci = pool[Math.floor(Math.random() * pool.length)];
    }
    if(ci < 0) ci = Math.floor(Math.random() * CARDS.length);
    if(!pending[ci]) return ci;
  }
  return Math.floor(Math.random() * CARDS.length);
}
function ownerIdx(roleId){
  for(var i = 0; i < 12; i++) if(ROLES[i].id === roleId && state.staff[i].hired) return i;
  return -1;
}
function findBoss(need, exclude){
  var best = -1, i, r;
  for(i = 0; i < 12; i++){
    if(!state.staff[i].hired || i === exclude) continue;
    if(inMeeting(i)) continue;
    r = state.staff[i].rank;
    if(r < need) continue;
    if(best < 0 || r < state.staff[best].rank) best = i;
  }
  if(best >= 0) return best;
  for(i = 0; i < 12; i++){
    if(!state.staff[i].hired || i === exclude) continue;
    r = state.staff[i].rank;
    if(r < need) continue;
    if(best < 0 || r < state.staff[best].rank) best = i;
  }
  return best;
}
function bestOptIdx(card){
  var b = 0;
  for(var i = 1; i < card.opts.length; i++) if(card.opts[i][1] > card.opts[b][1]) b = i;
  return b;
}
function addLog(kind, text){
  state.log.unshift({t:Date.now(), k:kind, s:text});
  if(state.log.length > 40) state.log.length = 40;
}
function cardInterval(){
  var h = hiredCount();
  var avgLv = 0; for(var i=0;i<12;i++) if(state.staff[i].hired) avgLv += state.staff[i].lv;
  avgLv = h ? avgLv / h : 0;
  return Math.max(3.4, 10.2 - h * 0.38 - avgLv * 0.1);
}

function spawnCard(){
  var ci = pickCardIndex(), c = CARDS[ci];
  var card = {
    uid: ++uidC, ci: ci, from: c[0], title: c[1], desc: c[2], opts: c[3],
    scale: cardScale(), need: cardNeed(c), t: Date.now(), by: -1, done: false
  };
  handleCard(card);
  return card;
}

/* 카드 한 장이 회사 안에서 어떻게 처리되는지 결정 */
function handleCard(card){
  var need = card.need;
  var oi = ownerIdx(card.from);
  card.by = oi;
  if(need >= CEO_NEED || oi < 0){ toCeo(card, oi); return; }
  if(state.staff[oi].rank >= need){ selfApprove(card, oi); return; }
  var bi = findBoss(need, oi);
  if(bi < 0){ toCeo(card, oi); return; }
  escalate(card, oi, bi);
}

/* 자체 전결 — 본인 권한으로 끝나는 소액 건 */
function selfApprove(card, oi){
  if(!inMeeting(oi)) say(oi, "자체 결재 완료!", 2400, true);
  setTimeout(function(){
    settleAuto(card, oi, -1, 0.55, "자체 결재");
    if(!inMeeting(oi)) say(oi, "처리 완료!", 2000, true);
  }, 500);
}

/* 상신 — 더 높은 직급의 상사 자리로 걸어가 결재를 받는다 */
function escalate(card, oi, bi){
  var bossRank = rankName(state.staff[bi].rank);
  if(inMeeting(oi)){
    setTimeout(function(){ settleAuto(card, oi, bi, 0.6, "상신 결재"); }, 900);
    return;
  }
  var seat = seatOf(bi);
  var tgt = {x: seat.x - 13, y: seat.y};
  goTo(oi, tgt.x, tgt.y, function(){
    say(oi, bossRank + "님 결재 부탁해요!", 2800, true);
    setTimeout(function(){
      if(!state.staff[bi].hired){ settleAuto(card, oi, -1, 0.55, "자체 결재"); return; }
      say(bi, "전결 승인!", 2400, true);
      settleAuto(card, oi, bi, 0.6, "상신 결재");
    }, 850);
  });
  /* 이동이 길어져도 결재는 반드시 처리된다 */
  setTimeout(function(){ settleAuto(card, oi, bi, 0.6, "상신 결재"); }, 6000);
}

function settleAuto(card, oi, bi, factor, label){
  if(card.done) return;
  card.done = true;
  var b = bestOptIdx(card), o = card.opts[b];
  var gain = Math.round(o[1] * card.scale * factor);
  var xp = Math.max(1, Math.round(o[2] * (1 + state.level * 0.05) * 0.3));
  state.money = Math.max(0, state.money + gain);
  if(gain > 0){ state.totalEarned += gain; state.ctr.earned += gain; }
  state.autoCount++;
  addXp(xp);
  var who = ROLES[oi].name + " " + rankName(state.staff[oi].rank);
  var s = who + " · " + card.title + " → " + label + " (+₩" + won(Math.max(0, gain)) + ")";
  if(bi >= 0) s = who + " → " + ROLES[bi].name + " " + rankName(state.staff[bi].rank) + " · " + card.title + " " + label + " (+₩" + won(Math.max(0, gain)) + ")";
  addLog(bi >= 0 ? "esc" : "self", s);
  toast((bi >= 0 ? "상신 결재 · " : "자체 결재 · ") + ROLES[oi].name + " " + rankName(state.staff[oi].rank) +
        " +₩" + won(Math.max(0, gain)), gain > 0 ? "good" : "");
  if(gain > 0) SFX.coin();
  save();
}

/* 대표님(플레이어) 결재함으로 올라옴 */
function toCeo(card, oi){
  card.done = true;
  if(state.inbox.length >= CARD_CAP){
    /* 결재함이 가득 차면 오늘은 아래에서 처리한 것으로 넘긴다 */
    addLog("ceo", card.title + " → 결재함이 가득 차 보류");
    return;
  }
  state.inbox.push(card);
  if(oi >= 0 && live[oi] && !inMeeting(oi)) say(oi, "대표님 결재 필요합니다!", 3000, true);
  var dept = roleById(card.from).dept;
  addLog("ceo", (oi >= 0 ? ROLES[oi].name + " " + rankName(state.staff[oi].rank) + " · " : "") +
        card.title + " → 대표님 결재함");
  if(state.inbox.length === 1) toast("결재함에 새 서류 · " + dept, "");
  if(sheetKind === "inbox") renderSheet();
  updateBadges();
}

function approveCard(card, oi, isQuick){
  var o = card.opts[oi];
  if(!o) return null;
  var gain = Math.round(o[1] * card.scale * (isQuick ? 0.9 : 1));
  var xp = Math.max(1, Math.round(o[2] * (1 + state.level * 0.05)));
  state.money = Math.max(0, state.money + gain);
  if(gain > 0){ state.totalEarned += gain; state.ctr.earned += gain; }
  state.approved++; state.ctr.approved++;
  if(isQuick){ state.quick++; state.ctr.quick++; }
  var idx = state.inbox.indexOf(card);
  if(idx >= 0) state.inbox.splice(idx, 1);
  addXp(xp);
  SFX.stamp();
  setTimeout(function(){ if(gain > 0) SFX.coin(); }, 90);
  return {gain:gain, xp:xp, label:o[0], from:card.from};
}

/* =========================================================
   채용 · 레벨업 · 승진 · 시설
   ========================================================= */
function hire(i){
  var c = hireCost(i);
  if(state.money < c) { SFX.bad(); return false; }
  if(i !== nextSlot()) { SFX.bad(); return false; }
  state.money -= c;
  state.staff[i].hired = true;
  state.staff[i].lv = 1;
  state.staff[i].rank = 0;
  state.ctr.hired++;
  SFX.hire();
  spawnLive(i);
  bubblesFor(i, ROLES[i].name + " 합류!", 2600);
  drawBG();
  addLog("hire", ROLES[i].name + " " + ROLES[i].dept + " 인턴으로 입사");
  return true;
}
function levelUp(i){
  var c = lvCost(i), s = state.staff[i];
  if(!s.hired || s.lv >= 10) { SFX.bad(); return false; }
  if(state.money < c) { SFX.bad(); return false; }
  state.money -= c;
  s.lv++;
  state.ctr.levelups++;
  SFX.level();
  bubblesFor(i, "레벨 " + s.lv + "! 힘낼게요!", 2400);
  return true;
}
function promote(i){
  var s = state.staff[i], c = promoCost(i);
  if(!s.hired || s.rank >= MAXRANK) { SFX.bad(); return false; }
  if(s.lv < promoNeedLv(i)) { SFX.bad(); return "lv"; }
  if(state.money < c) { SFX.bad(); return "money"; }
  state.money -= c;
  s.rank++;
  state.ctr.promo++;
  SFX.promo();
  bubblesFor(i, rankName(s.rank) + " 승진!", 3000);
  addLog("promo", ROLES[i].name + " " + ROLES[i].dept + " " + rankName(s.rank) + "으로 승진");
  return true;
}
function buyUp(u){
  var c = upCost(u), lv = state.up[u.id];
  if(lv >= u.max) { SFX.bad(); return false; }
  if(state.money < c) { SFX.bad(); return false; }
  state.money -= c;
  state.up[u.id] = lv + 1;
  state.ctr.upgrade++;
  SFX.hire();
  drawBG();
  toast(u.name + " 레벨 " + (lv + 1) + " 설치 완료!", "good");
  return true;
}

/* =========================================================
   미션
   ========================================================= */
function missionProg(m){ return state.ctr[m.k] || 0; }
function missionDone(m){ return missionProg(m) >= m.target; }
function claimMission(i){
  var m = state.missions[i];
  if(!m || m.got || !missionDone(m)) { SFX.bad(); return false; }
  var d = MDEF[i];
  var reward = Math.round(480 * Math.pow(1.9, (state.mRound - 1)) * d.rw);
  var xp = Math.round(26 * state.mRound);
  state.money += reward; state.totalEarned += reward; state.ctr.earned += reward;
  m.got = true;
  addXp(xp);
  SFX.hire();
  toast("미션 완료! +₩" + won(reward), "gold");
  if(state.missions.every(function(x){ return x.got; })){
    state.mRound++;
    state.ctr = {approved:0,hired:0,upgrade:0,earned:0,levelups:0,quick:0,promo:0};
    state.missions = buildMissions(state.mRound);
    toast("새로운 할 일 도착! " + state.mRound + "회차", "gold");
  }
  return true;
}

/* =========================================================
   부스트
   ========================================================= */
function startBoost(){
  var n = Date.now();
  if(n < state.boostReadyAt) { SFX.bad(); return false; }
  state.boostUntil = n + 30000;
  state.boostReadyAt = n + 30000 + 90000;
  SFX.boost();
  toast("2배 부스트! 30초간 수익이 두 배", "gold");
  return true;
}

var cv = $("cv"), ctx = cv.getContext("2d");
var bgc = document.createElement("canvas"); bgc.width = W; bgc.height = H;
var bg = bgc.getContext("2d");
var view = {s:1, ox:0, oy:0, w:0, h:0, dpr:1};

function resize(){
  var stage = $("stage");
  var w = stage.clientWidth || 360, h = stage.clientHeight || 520;
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var s = Math.min(w / W, h / H);
  view.dpr = dpr; view.w = w; view.h = h; view.s = s;
  view.ox = (w - W * s) / 2;
  view.oy = (h - H * s) / 2;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  var tb = $("tabs");
  if(tb) document.documentElement.style.setProperty("--tabh", tb.offsetHeight + "px");
}

function lib(c, x, y, cols){
  // 책장
  R(c, "#24304a", x - 2, y - 2, 44, 32);
  R(c, "#7a3f18", x, y, 40, 28);
  R(c, "#5e2f11", x + 2, y + 2, 36, 24);
  for(var row = 0; row < 3; row++){
    var by = y + 3 + row * 8;
    R(c, "#4a2409", x + 2, by + 6, 36, 1);
    var bx = x + 3, n = 0;
    while(bx < x + 37){
      var bw = 1 + ((n + row) % 3);
      R(c, cols[(n + row * 3) % cols.length], bx, by, bw, 6);
      bx += bw + 1; n++;
    }
  }
}

/* =========================================================
   활동 캐릭터
   ========================================================= */
var LANE = 96;
var TARGETS = [{x:148, y:96}, {x:40, y:96}];
var ceo = {x:148, y:64, bubble:"", bubUntil:0, next:6};
var ceoBob = false;

function aisleFor(i){
  var col = i % 4;
  return col === 0 ? 51 : (col === 1 ? 101 : 151);
}
function spawnLive(i){
  var s = seatOf(i);
  live[i] = {
    x:s.x, y:s.y, mode:"work", t:0, next:6 + Math.random() * 10,
    path:null, pi:0, spd:26 + Math.random() * 8, tick:Math.random() * 5,
    bubble:"", bubUntil:0, bubNext:2 + Math.random() * 5, bubLock:0,
    done:null, standUntil:0, meet:false
  };
}
function say(i, text, ms, lock){
  var l = live[i]; if(!l) return;
  var now = Date.now();
  if(lock && now < l.bubLock && l.bubble) return;
  l.bubble = text;
  l.bubUntil = now + ms;
  if(lock) l.bubLock = now + ms;
}
function bubblesFor(i, text, ms){ say(i, text, ms, true); }
function alertStaff(roleId){
  for(var i = 0; i < 12; i++){
    if(ROLES[i].id === roleId && state.staff[i].hired && live[i] && !inMeeting(i)){
      say(i, "!", 2200, false);
      return;
    }
  }
}
function bubbleCount(){
  var n = 0, now = Date.now();
  for(var i = 0; i < 12; i++) if(live[i] && live[i].bubble && now < live[i].bubUntil) n++;
  if(ceo.bubble && now < ceo.bubUntil) n++;
  return n;
}

function pathTo(i, tx, ty){
  var l = live[i], seat = seatOf(i), ax = aisleFor(i);
  var lane = LANE + (i % 3) * 3;
  var pts = [];
  if(Math.abs(l.y - lane) < 3 && Math.abs(l.x - ax) < 3){
    pts.push({x:tx, y:lane});
  } else if(Math.abs(l.y - lane) < 3){
    pts.push({x:ax, y:lane});
    pts.push({x:tx, y:lane});
  } else {
    pts.push({x:ax, y:l.y});
    pts.push({x:ax, y:lane});
    pts.push({x:tx, y:lane});
  }
  if(Math.abs(ty - lane) > 1) pts.push({x:tx, y:ty});
  return pts;
}
function goTo(i, tx, ty, done){
  var l = live[i]; if(!l) return;
  l.path = pathTo(i, tx, ty);
  l.pi = 0;
  l.mode = "walk";
  l.done = done || null;
}
function goHome(i, done){
  var s = seatOf(i);
  goTo(i, s.x, s.y, function(){
    var l = live[i];
    if(l){ l.mode = "work"; l.t = 0; l.next = 10 + Math.random() * 14; }
    if(done) done();
  });
}

function updateActors(dt){
  var now = Date.now(), i;
  for(i = 0; i < 12; i++){
    var s = state.staff[i], l = live[i];
    if(!s.hired || !l) continue;
    l.tick += dt;

    if(l.mode === "work"){
      var seat = seatOf(i);
      l.x = seat.x; l.y = seat.y;
      l.t += dt;
      if(l.t > l.next && !inMeeting(i)){
        l.t = 0;
        var tg = TARGETS[Math.random() < 0.55 ? 0 : 1];
        var tx = tg.x + ((i % 4) - 1.5) * 8;
        goTo(i, tx, tg.y, function(idx){
          return function(){
            var ll = live[idx], nn = Date.now();
            ll.standUntil = nn + 2200;
            ll.mode = "stand";
            if(nn > ll.bubLock && bubbleCount() < 2){
              say(idx, BUB_WALK[Math.floor(Math.random() * BUB_WALK.length)], 2600, false);
            }
          };
        }(i));
      } else if(now > l.bubNext && now > l.bubUntil && now > l.bubLock){
        if(bubbleCount() >= 2){
          l.bubNext = now + 1800 + Math.random() * 3000;
        } else {
          var pool = (BUB[ROLES[i].id] || BUB_GEN).concat(BUB_GEN);
          l.bubble = pool[Math.floor(Math.random() * pool.length)];
          l.bubUntil = now + 2400 + Math.random() * 1800;
          l.bubNext = l.bubUntil + 2500 + Math.random() * 5000;
        }
      }

    } else if(l.mode === "walk"){
      if(!l.path || !l.path.length){ l.mode = "work"; continue; }
      var tgt = l.path[l.pi];
      if(!tgt){
        arrive(i);
        continue;
      }
      var dx = tgt.x - l.x, dy = tgt.y - l.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var step = l.spd * dt;
      if(dist <= step){
        l.x = tgt.x; l.y = tgt.y; l.pi++;
        if(l.pi >= l.path.length) arrive(i);
      } else {
        l.x += dx / dist * step;
        l.y += dy / dist * step;
      }

    } else if(l.mode === "stand"){
      if(now > l.standUntil && !inMeeting(i)) goHome(i);

    } else if(l.mode === "meet"){
      /* 회의 자리 고정 */
    }
  }

  /* CEO */
  ceo.next -= dt;
  if(ceo.next <= 0){
    ceo.next = 8 + Math.random() * 9;
    if(bubbleCount() < 2){
      ceo.bubble = CEO_BUB[Math.floor(Math.random() * CEO_BUB.length)];
      ceo.bubUntil = Date.now() + 3000;
    }
  }
}

function arrive(i){
  var l = live[i]; if(!l) return;
  l.path = null; l.pi = 0;
  var f = l.done; l.done = null;
  l.mode = "stand";
  l.standUntil = Date.now() + 2500;
  if(f){ f(); return; }
  var seat = seatOf(i);
  if(Math.abs(l.x - seat.x) < 2 && Math.abs(l.y - seat.y) < 2){
    l.mode = "work"; l.t = 0; l.next = 10 + Math.random() * 14;
  }
}

/* =========================================================
   회의
   ========================================================= */
function inMeeting(i){
  if(!mt) return false;
  for(var k = 0; k < mt.parts.length; k++) if(mt.parts[k] === i) return true;
  return false;
}
function meetBadge(){
  var b = $("meetBadge");
  if(!b) return;
  var on = !!(mt && mt.phase !== "done");
  b.classList.toggle("hidden", !on);
  if(on) b.textContent = "🗣 회의 중! 보기 (" + mt.parts.length + "명)";
  var tb = $("tabMeetN");
  if(tb) tb.classList.toggle("hidden", !on);
}

function startMeeting(){
  var cand = [], i;
  for(i = 0; i < 12; i++) if(state.staff[i].hired && live[i] && !inMeeting(i)) cand.push(i);
  if(cand.length < 2){ state.nextMeetAt = Date.now() + 20000; return; }
  for(i = cand.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = cand[i]; cand[i] = cand[j]; cand[j] = tmp;
  }
  var maxP = Math.min(3, cand.length);
  var pool = MEET.filter(function(m){ return m.p <= maxP; });
  if(!pool.length){ state.nextMeetAt = Date.now() + 20000; return; }
  var topic = pool[Math.floor(Math.random() * pool.length)];
  var want = Math.min(topic.p, cand.length);
  var parts = cand.slice(0, want);
  var spots = MEET_SPOT[want] || MEET_SPOT[2];

  mt = {
    id: ++meetUid, topic: topic, parts: parts, seg: 0, phase: "walk",
    lines: topic.l, resolved: [], nextAt: 0, startedAt: Date.now(), arrived: 0, spots: spots
  };
  parts.forEach(function(idx, k){
    if(!live[idx]) return;
    goTo(idx, spots[k].x, spots[k].y, null);
  });
  /* 도착 판정: walk 모드가 끝나면 meet 로 고정 */
  var mid = mt.id;
  var check = setInterval(function(){
    if(!mt || mt.id !== mid){ clearInterval(check); return; }
    if(mt.phase !== "walk"){ clearInterval(check); return; }
    var done = 0;
    mt.parts.forEach(function(idx){
      var l = live[idx];
      if(!l) { done++; return; }
      if(l.mode !== "walk"){ done++; l.mode = "meet"; }
    });
    if(done >= mt.parts.length){
      clearInterval(check);
      beginTalk();
    }
  }, 220);
}

function beginTalk(){
  if(!mt || mt.phase !== "walk") return;
  mt.phase = "talk";
  mt.nextAt = Date.now() + 600;
  SFX.meet();
  toast("회의 시작 · " + mt.topic.t, "gold");
  addLog("meet", "회의 시작 · " + mt.topic.t);
  meetBadge();
  updateBadges();
  if(sheetKind === "minutes") renderSheet();
}

function mtFill(text, parts){
  return String(text)
    .replace(/\{n(\d)\}/g, function(m, d){ var p = parts[+d]; return p == null ? "동료" : ROLES[p].name; })
    .replace(/\{r(\d)\}/g, function(m, d){ var p = parts[+d]; return p == null ? "사원" : rankName(state.staff[p].rank); })
    .replace(/\{d(\d)\}/g, function(m, d){ var p = parts[+d]; return p == null ? "옆 팀" : ROLES[p].dept; });
}
function mtLines(topic, parts){
  var out = [];
  topic.l.forEach(function(ln){
    if(ln[0] >= parts.length) return;
    var idx = parts[ln[0]];
    out.push({who: ROLES[idx].name, rank: state.staff[idx].rank, dept: ROLES[idx].dept, t: mtFill(ln[1], parts)});
  });
  return out;
}

function updateMeeting(){
  var now = Date.now();
  if(!mt){
    if(now >= state.nextMeetAt && hiredCount() >= 2){
      startMeeting();
      if(!mt) return;
    }
    return;
  }
  if(mt.phase === "walk"){
    /* 입장이 오래 걸리면(다른 볼일이 끼어들면) 자리를 잡아주고 시작한다 */
    if(now - mt.startedAt > 9000){
      mt.parts.forEach(function(idx, k){
        var l = live[idx];
        if(!l) return;
        if(mt.spots && mt.spots[k]){ l.x = mt.spots[k].x; l.y = mt.spots[k].y; }
        l.path = null; l.mode = "meet"; l.done = null;
      });
      beginTalk();
    }
    return;
  }
  if(mt.phase !== "talk") return;
  if(now < mt.nextAt) return;
  if(mt.seg < mt.lines.length){
    var idx = mt.parts[mt.lines[mt.seg][0]];
    var text = mtFill(mt.lines[mt.seg][1], mt.parts);
    mt.resolved.push({
      who: ROLES[idx].name, rank: state.staff[idx].rank, dept: ROLES[idx].dept, t: text
    });
    if(live[idx]){
      var snip = text.length > 15 ? text.slice(0, 15) + "…" : text;
      say(idx, snip, 2400, true);
    }
    mt.seg++;
    mt.nextAt = now + 1500 + Math.random() * 700;
    if(sheetKind === "minutes") refreshMinutes();
  } else {
    endMeeting();
  }
}

function endMeeting(){
  var m = mt;
  mt = null;
  var now = Date.now();
  state.buffUntil = now + 90000;
  var bonus = Math.round(Math.max(30, ips() * 8));
  state.money += bonus;
  state.totalEarned += bonus;
  state.ctr.earned += bonus;
  var rec = {
    id: m.id, title: m.topic.t, at: now,
    parts: m.parts.map(function(idx){ return {name: ROLES[idx].name, rank: state.staff[idx].rank, dept: ROLES[idx].dept}; }),
    lines: m.resolved.slice()
  };
  state.meetings.unshift(rec);
  if(state.meetings.length > 8) state.meetings.length = 8;
  addLog("meet", "회의 종료 · " + rec.title + " · 팀 사기 +10% (90초)");
  toast("회의 종료 · " + rec.title + " · 팀 사기 +10%", "good");
  SFX.coin();
  m.parts.forEach(function(idx){
    var l = live[idx];
    if(l){ l.mode = "stand"; l.standUntil = Date.now() + 600; goHome(idx); }
  });
  state.nextMeetAt = now + 45000 + Math.random() * 45000;
  meetBadge();
  updateBadges();
  if(sheetKind === "minutes") renderSheet();
  save();
}

var fontStack = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif';

function txt(c, t, x, y, size, col, weight, align){
  c.font = (weight || 700) + " " + size + "px " + fontStack;
  c.textAlign = align || "center";
  c.textBaseline = "middle";
  c.fillStyle = col;
  c.fillText(t, x, y);
}
function outTxt(c, t, x, y, size, col, weight, align){
  c.font = (weight || 700) + " " + size + "px " + fontStack;
  c.textAlign = align || "center";
  c.textBaseline = "middle";
  c.lineWidth = 2.2;
  c.strokeStyle = "rgba(8,12,22,.85)";
  c.strokeText(t, x, y);
  c.fillStyle = col;
  c.fillText(t, x, y);
}
/* 폭에 맞춰 글자 크기를 줄여 그린다 (명패가 잘리거나 겹치지 않게) */
function fitTxt(c, t, x, y, size, maxW, col, weight){
  var s = size;
  c.font = (weight || 800) + " " + s + "px " + fontStack;
  while(c.measureText(t).width > maxW && s > 2.2){
    s -= 0.15;
    c.font = (weight || 800) + " " + s + "px " + fontStack;
  }
  c.textAlign = "center";
  c.textBaseline = "middle";
  c.fillStyle = col;
  c.fillText(t, x, y);
}
function bubbleBox(c, t, cx, cyBottom, size){
  c.font = '800 ' + size + "px " + fontStack;
  var w = c.measureText(t).width + 6;
  var h = size + 5;
  var x = cx - w / 2, y = cyBottom - h;
  if(x < 1) x = 1;
  if(x + w > W - 1) x = W - 1 - w;
  c.fillStyle = "rgba(10,14,26,.35)";
  c.fillRect(x + 1, y + 2, w, h);
  c.fillStyle = "#fffdf5";
  c.fillRect(x, y, w, h);
  c.strokeStyle = "#12182b"; c.lineWidth = 0.9;
  c.strokeRect(x + 0.45, y + 0.45, w - 0.9, h - 0.9);
  c.fillStyle = "#fffdf5";
  c.fillRect(cx - 1.6, y + h - 0.4, 3.2, 1.8);
  c.strokeStyle = "#12182b"; c.lineWidth = 0.9;
  c.beginPath();
  c.moveTo(cx - 1.6, y + h - 0.2); c.lineTo(cx - 1.6, y + h + 1.4);
  c.lineTo(cx + 1.6, y + h + 1.4); c.lineTo(cx + 1.6, y + h - 0.2);
  c.stroke();
  c.fillStyle = "#fffdf5"; c.fillRect(cx - 1.2, y + h - 0.6, 2.4, 1.4);
  txt(c, t, x + w / 2, y + h / 2 + 0.3, size, "#1a2030", 800);
}

function drawScene(){
  var s = view.s;
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = "#080c16";
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(bgc, view.ox, view.oy, W * s, H * s);

  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(s, s);
  var now = Date.now();

  /* 남는 여백에 벽/바닥 무늬를 이어 붙인다 */
  var padTop = view.oy / s, padBot = (view.h - view.oy - H * s) / s;
  if(padTop > 0.5){
    R(ctx, "#efe2c2", 0, -padTop, W, padTop + 1);
    for(var px2 = 2; px2 < W; px2 += 10) R(ctx, "#e8dab8", px2, -padTop, 5, padTop + 1);
  }
  if(padBot > 0.5){
    for(var py2 = H; py2 < H + padBot + 8; py2 += 8){
      R(ctx, "#d98b3f", 0, py2, W, 8);
      R(ctx, "#c47a30", 0, py2 + 7, W, 1);
      R(ctx, "#e6a05a", 0, py2, W, 1);
      var off2 = (Math.floor(py2 / 8) % 2) ? 20 : 0;
      for(var px3 = off2; px3 < W; px3 += 44) R(ctx, "#c47a30", px3, py2, 1, 7);
    }
  }

  /* 회의실 · 대표실 명패 */
  var mw2 = 58 + state.up.meeting * 10;
  fitTxt(ctx, "회의실", 6 + mw2 / 2, 63.6, 4.5, mw2 - 6, "#ffe9c4", 800);
  fitTxt(ctx, "대표실", 175, 69.6, 3.8, 18, state.up.plaque > 0 ? "#5a3f06" : "#93a3b8", 800);

  /* 회의 중 표시 */
  if(mt && mt.phase !== "done"){
    var pulse = 0.5 + 0.5 * Math.sin(now / 260);
    var bx = 6 + mw2 / 2;
    ctx.fillStyle = "rgba(255,122,122," + (0.65 + pulse * 0.35).toFixed(2) + ")";
    ctx.fillRect(bx - 13, 41, 26, 7);
    ctx.strokeStyle = "#0a0e1a"; ctx.lineWidth = 0.8;
    ctx.strokeRect(bx - 12.6, 41.4, 25.2, 6.2);
    fitTxt(ctx, "회의 중", bx, 44.7, 4.2, 22, "#2a0a0a", 800);
  }

  /* 직원 정렬 */
  var order = [], i;
  for(i = 0; i < 12; i++) order.push(i);
  order.sort(function(a, b){
    var ya = live[a] ? live[a].y : deskOf(a).y;
    var yb = live[b] ? live[b].y : deskOf(b).y;
    return ya - yb;
  });

  /* 빈 책상 라벨 */
  for(var e = 0; e < 12; e++){
    if(!state.staff[e].hired){
      var dd = deskOf(e);
      fitTxt(ctx, "채용", dd.x + 22, dd.y + 11.6, 4.0, 26, "#f0c060", 800);
    }
  }

  for(var o = 0; o < order.length; o++){
    var i2 = order[o];
    if(!state.staff[i2].hired || !live[i2]) continue;
    var l = live[i2];
    drawBot(ctx, l.x, l.y, ROLES[i2], state.staff[i2].lv, l.mode === "walk", l.tick);
  }

  /* 책상 본체 (직원 다리 가리기) */
  for(var f = 0; f < 12; f++) drawDeskFront(ctx, deskOf(f), state.staff[f].hired);

  /* 책상 명패 — 부서명(한글) */
  for(var p = 0; p < 12; p++){
    var dp = deskOf(p);
    if(state.staff[p].hired) fitTxt(ctx, ROLES[p].dept, dp.x + 22, dp.y + 11.6, 4.4, 29, "#ffe9c4", 800);
  }

  /* 이름표 — [직급] 이름 (자리·회의 중일 때만: 걷는 동안은 말풍선으로) */
  for(var n = 0; n < 12; n++){
    if(!state.staff[n].hired || !live[n]) continue;
    var ln = live[n];
    if(ln.mode !== "work" && ln.mode !== "meet") continue;
    var rn = state.staff[n].rank;
    var label = (rn > 0 ? rankName(rn) + " " : "") + ROLES[n].name;
    outTxt(ctx, label, ln.x, ln.y - 17, 4.6, rn > 0 ? rankColor(rn) : "#ffffff", 800);
  }
  outTxt(ctx, "대표님", ceo.x, ceo.y - 20, 5.0, "#ffd479", 800);

  /* 말풍선 */
  for(var m = 0; m < 12; m++){
    if(!state.staff[m].hired || !live[m]) continue;
    var lm = live[m];
    if(lm.bubble && now < lm.bubUntil) bubbleBox(ctx, lm.bubble, lm.x, lm.y - 21, 4.7);
  }
  if(ceo.bubble && now < ceo.bubUntil) bubbleBox(ctx, ceo.bubble, ceo.x, ceo.y - 22, 4.7);

  /* 부스트/회의 오라 */
  if(now < state.boostUntil){
    var a = 0.10 + Math.sin(now / 180) * 0.05;
    ctx.fillStyle = "rgba(255,180,60," + a.toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  if(now < state.buffUntil){
    ctx.fillStyle = "rgba(120,224,142,.05)";
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

/* =========================================================
   UI: 토스트 · 모달 · 시트
   ========================================================= */
function toast(t, kind){
  var layer = $("toastLayer");
  var el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = t;
  layer.appendChild(el);
  while(layer.children.length > 3) layer.removeChild(layer.firstChild);
  setTimeout(function(){
    el.classList.add("out");
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 320);
  }, 1600);
}
function showModal(html){
  $("modal").innerHTML = '<div class="mbox">' + html + '</div>';
  $("modal").classList.remove("hidden");
}
function hideModal(){ $("modal").classList.add("hidden"); }
function esc(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function roleById(id){
  for(var i = 0; i < ROLES.length; i++) if(ROLES[i].id === id) return ROLES[i];
  return ROLES[0];
}

var sheetKind = null;
function openSheet(kind){
  if(sheetKind === kind){ closeSheet(); return; }
  sheetKind = kind;
  $("sheetWrap").classList.remove("hidden");
  renderSheet();
  SFX.tap();
  updateTabs();
}
function closeSheet(){
  sheetKind = null;
  $("sheetWrap").classList.add("hidden");
  updateTabs();
}
function updateTabs(){
  var btns = document.querySelectorAll("#tabs button");
  for(var i = 0; i < btns.length; i++){
    btns[i].classList.toggle("on", btns[i].getAttribute("data-tab") === sheetKind);
  }
}

function cardHTML(card){
  var ro = roleById(card.from);
  var h = '<div class="card" data-uid="' + card.uid + '">';
  h += '<div class="top"><span class="chip" style="background:' + ro.body + '">' + esc(ro.dept) + '</span>';
  h += '<h3>' + esc(card.title) + '</h3></div>';
  h += '<p>' + esc(card.desc) + '</p>';
  h += '<div class="lineup">';
  h += '<span class="tag" style="background:' + (card.need >= CEO_NEED ? "#ff9f9f" : rankColor(card.need)) + '">결재권 ' +
       esc(needLabel(card.need)) + '</span>';
  if(card.by >= 0) h += '<span class="tag dark">올린 사람 · ' + esc(ROLES[card.by].name + " " + rankName(state.staff[card.by].rank)) + '</span>';
  h += '</div><div class="opts">';
  card.opts.forEach(function(o, i){
    var m = Math.round(o[1] * card.scale);
    var xp = Math.round(o[2] * (1 + state.level * 0.05));
    h += '<button class="opt" data-act="approve" data-uid="' + card.uid + '" data-oi="' + i + '">';
    h += '<span class="lbl">' + esc(o[0]) + '</span>';
    h += '<span class="rw"><span class="m">' + (m < 0 ? "-" : "+") + "₩" + won(Math.abs(m)) + '</span> ';
    h += '<span class="x">+' + xp + ' 경험치</span></span></button>';
  });
  return h + '</div></div>';
}
function logHTML(){
  if(!state.log.length) return '<div class="logbox"><div class="lh">자체 결재 · 상신 기록</div><div class="logrow"><span class="ls" style="color:#7f8db0">직원이 결재를 처리하면 여기에 쌓여요.</span></div></div>';
  var h = '<div class="logbox"><div class="lh">자체 결재 · 상신 기록</div>';
  var col = {self:"#7be08e", esc:"#5cc6e8", ceo:"#ff9f9f", promo:"#ffd479", hire:"#c3cfeb", meet:"#a98bff"};
  var nm = {self:"전결", esc:"상신", ceo:"대표", promo:"승진", hire:"채용", meet:"회의"};
  state.log.slice(0, 8).forEach(function(e){
    h += '<div class="logrow"><span class="lt" style="background:' + (col[e.k] || "#c3cfeb") + '">' +
         (nm[e.k] || "기록") + '</span><span class="ls">' + esc(e.s) + '</span></div>';
  });
  return h + '</div>';
}
function inboxSub(){
  var sb = $("sheetSub");
  if(sb && sheetKind === "inbox") sb.textContent = "대표님 결재 대기 " + state.inbox.length + "건 · 아래에 결재 기록";
}
function removeCardEl(uid){
  var el = document.querySelector('#sheetBody .card[data-uid="' + uid + '"]');
  if(el && el.parentNode) el.parentNode.removeChild(el);
  if(sheetKind === "inbox"){
    inboxSub();
    if(!state.inbox.length) renderSheet();
  }
}
function whoChip(p){
  return '<span class="who"><span class="w">' + esc(rankName(p.rank)) + '</span> ' + esc(p.name) + " · " + esc(p.dept) + '</span>';
}
function lineHTML(l, wait){
  return '<div class="ln' + (wait ? " wait" : "") + '"><b>' + esc(l.who) + ' <i>' + esc(rankName(l.rank)) + '</i></b>' +
         '<span class="say">' + esc(l.t) + '</span></div>';
}
function minutesHTML(){
  var h = "";
  if(mt && mt.phase !== "done"){
    var liveNow = mt.phase === "talk";
    h += '<div class="mt"><div class="mhead">' +
         (liveNow ? '<span class="live">회의 중</span>' : '<span class="pin">입장 중</span>') +
         '<h3>' + esc(mt.topic.t) + '</h3></div>';
    h += '<div class="meta">회의실 · 참석 ' + mt.parts.length + '명 · ' +
         (liveNow ? (mt.resolved.length + " / " + mt.lines.length + " 발언") : "자리로 이동 중") + '</div>';
    h += '<div class="chiprow">' + mt.parts.map(function(idx){
      return whoChip({name: ROLES[idx].name, rank: state.staff[idx].rank, dept: ROLES[idx].dept});
    }).join("") + '</div>';
    h += '<div>' + mt.resolved.map(function(l){ return lineHTML(l, false); }).join("");
    if(liveNow) h += '<div class="ln wait"><b>…</b><span class="say">다음 발언을 기다리는 중</span></div>';
    h += '</div></div>';
  }
  if(state.meetings.length){
    h += '<div class="logbox" style="background:#141c31"><div class="lh">지난 회의록 (' + state.meetings.length + ')</div></div>';
    state.meetings.forEach(function(m, idx){
      h += '<div class="mt"><div class="mhead"><span class="pin">회의록</span><h3>' + esc(m.title) + '</h3></div>';
      h += '<div class="meta">' + timeStr(m.at) + ' · 참석 ' + m.parts.length + '명 · 발언 ' + m.lines.length + '개</div>';
      h += '<div class="chiprow">' + m.parts.map(whoChip).join("") + '</div>';
      h += '<button class="mini grey" data-act="minutes" data-m="' + idx + '">대화 전문 보기</button></div>';
    });
  }
  if(!h){
    h = '<div class="empty">아직 회의록이 없어요.<br>직원이 2명 이상이면 회의실에서 회의가 열려요.<br><br>· 회의실을 눌러도 볼 수 있어요</div>';
  }
  return h;
}

function renderSheet(){
  if(!sheetKind) return;
  var body = $("sheetBody"), title = $("sheetTitle"), sub = $("sheetSub");
  var html = "", i;

  if(sheetKind === "inbox"){
    title.textContent = "결재함";
    sub.textContent = "대표님 결재 대기 " + state.inbox.length + "건 · 아래에 결재 기록";
    if(!state.inbox.length){
      html = '<div class="empty">대표님 결재로 올라온 서류가 없어요.<br>직원들이 작은 건은 자체 전결로 처리하고 있어요.<br><br>· 직급이 높은 직원일수록 큰 건까지 알아서 처리합니다</div>';
    } else {
      state.inbox.forEach(function(card){ html += cardHTML(card); });
    }
    html += logHTML();

  } else if(sheetKind === "staff"){
    var n = hiredCount();
    title.textContent = "AI 직원";
    sub.textContent = n + " / 12명 근무 · 총 " + won(ips()) + "원/초";
    var ns = nextSlot();
    for(i = 0; i < 12; i++){
      var s = state.staff[i], ro = ROLES[i];
      var lock = !s.hired && i !== ns;
      html += '<div class="row' + (lock ? " locked" : "") + '">';
      html += '<div class="swatch" style="background:' + ro.body + '"></div>';
      html += '<div class="meta"><div class="nm">';
      if(s.hired && s.rank > 0) html += '<span class="rk" style="color:' + rankColor(s.rank) + '">[' + rankName(s.rank) + ']</span> ';
      html += ro.name + (s.hired ? '<em>레벨 ' + s.lv + '</em>' : '') + '</div>';
      html += '<div class="jb">' + ro.dept + " · " + ro.job + '</div>';
      if(s.hired){
        html += '<div class="inc">+' + won(staffInc(i) * mult()) + '/초</div>';
        html += '<div class="scope">전결 ' + (s.rank >= MAXRANK ? "최고 등급" : rankName(s.rank) + "급 이하") + '</div>';
      }
      html += '</div><div class="act">';
      if(!s.hired){
        html += '<button class="mini" data-act="hire" data-i="' + i + '"' + (lock ? " disabled" : "") + '>₩' + won(hireCost(i)) + " 채용</button>";
      } else {
        html += '<div class="pips">';
        var pl = Math.min(10, s.lv);
        for(var q = 0; q < 10; q++) html += '<i class="' + (q < pl ? "on" : "") + '"></i>';
        html += '</div>';
        if(s.lv >= 10) html += '<span style="font-size:9px;color:#7be08e;font-weight:800">레벨 최대</span>';
        else html += '<button class="mini blue" data-act="lvup" data-i="' + i + '">₩' + won(lvCost(i)) + " 레벨업</button>";
        if(s.rank >= MAXRANK){
          html += '<span style="font-size:9px;color:#ffd479;font-weight:800">이사 · 최고 직급</span>';
        } else {
          var canLv = s.lv >= promoNeedLv(i);
          html += '<button class="mini purple" data-act="promo" data-i="' + i + '">승진 ₩' + won(promoCost(i)) +
                  (canLv ? "" : " · 레벨" + promoNeedLv(i) + "↑") + '</button>';
        }
      }
      html += '</div></div>';
    }

  } else if(sheetKind === "shop"){
    title.textContent = "사무실 시설";
    sub.textContent = "전체 수익 배율 ×" + mult().toFixed(2);
    UPGRADES.forEach(function(u){
      var lv = state.up[u.id], c = upCost(u), maxed = lv >= u.max;
      html += '<div class="row"><div class="swatch" style="background:#ffd479"></div>';
      html += '<div class="meta"><div class="nm">' + u.name + '<em>레벨 ' + lv + '</em></div>';
      html += '<div class="jb">' + u.desc + '</div>';
      html += '<div class="inc">수익 +' + Math.round(u.mult * 100) + '% / 단계</div></div><div class="act">';
      html += '<div class="pips">';
      for(var k = 0; k < u.max; k++) html += '<i class="' + (k < lv ? "on" : "") + '"></i>';
      html += '</div>';
      if(maxed) html += '<span style="font-size:9px;color:#7be08e;font-weight:800">최대</span>';
      else html += '<button class="mini" data-act="buy" data-id="' + u.id + '">₩' + won(c) + " 설치</button>";
      html += '</div></div>';
    });

  } else if(sheetKind === "mission"){
    title.textContent = "오늘 할 일";
    sub.textContent = state.mRound + "회차 · 달성하면 보너스";
    state.missions.forEach(function(m, i){
      var d = MDEF[i], prog = missionProg(m), done = prog >= m.target;
      var pct = Math.min(100, Math.round(prog / m.target * 100));
      html += '<div class="mis' + (m.got ? " done" : "") + '" data-mi="' + i + '">';
      html += '<div class="box">' + (m.got ? "✓" : "") + '</div>';
      html += '<div class="txt"><div class="t1">' + d.t(m.target) + '</div>';
      html += '<div class="t2" data-mi-t="' + i + '">' + won(Math.min(prog, m.target)) + ' / ' + won(m.target) + ' · 보상 ₩' + won(Math.round(480 * Math.pow(1.9, state.mRound - 1) * d.rw)) + '</div>';
      html += '<div class="bar"><i data-mi-bar="' + i + '" style="width:' + pct + '%"></i></div></div>';
      if(!m.got) html += '<button class="mini" data-act="claim" data-i="' + i + '"' + (done ? "" : " disabled") + '>받기</button>';
      else html += '<span style="font-size:9px;color:#7be08e;font-weight:800">완료</span>';
      html += '</div>';
    });

  } else if(sheetKind === "minutes"){
    title.textContent = "회의록";
    sub.textContent = mt && mt.phase === "talk" ? "회의가 진행 중이에요 · 실시간" : "회의실에서 열린 회의 기록";
    html = minutesHTML();
  }
  body.innerHTML = html;
}

function refreshMinutes(){
  if(sheetKind !== "minutes") return;
  var body = $("sheetBody");
  var box = body.querySelector(".mt");
  if(!box) return;
  body.innerHTML = minutesHTML();
}

function refreshLive(){
  if(!sheetKind) return;
  var i, k, el;
  if(sheetKind === "inbox"){
    inboxSub();
    var lb = $("sheetBody").querySelector(".logbox");
    if(lb) lb.outerHTML = logHTML();
  } else if(sheetKind === "staff"){
    var btns = document.querySelectorAll('#sheetBody [data-act="hire"], #sheetBody [data-act="lvup"]');
    for(i = 0; i < btns.length; i++){
      var b = btns[i], idx = parseInt(b.getAttribute("data-i"), 10);
      var isHire = b.getAttribute("data-act") === "hire";
      var cost = isHire ? hireCost(idx) : lvCost(idx);
      b.disabled = (isHire && idx !== nextSlot()) || state.money < cost;
    }
    var pb = document.querySelectorAll('#sheetBody [data-act="promo"]');
    for(i = 0; i < pb.length; i++){
      var pi = parseInt(pb[i].getAttribute("data-i"), 10);
      pb[i].disabled = state.money < promoCost(pi) || state.staff[pi].lv < promoNeedLv(pi);
    }
    var sb = $("sheetSub");
    if(sb) sb.textContent = hiredCount() + " / 12명 근무 · 총 " + won(ips()) + "원/초";
  } else if(sheetKind === "shop"){
    var ub = document.querySelectorAll('#sheetBody [data-act="buy"]');
    for(i = 0; i < ub.length; i++){
      var id = ub[i].getAttribute("data-id"), uu = null;
      for(k = 0; k < UPGRADES.length; k++) if(UPGRADES[k].id === id) uu = UPGRADES[k];
      if(uu) ub[i].disabled = state.money < upCost(uu);
    }
  } else if(sheetKind === "mission"){
    for(i = 0; i < state.missions.length; i++){
      var m = state.missions[i], d = MDEF[i];
      if(!d) continue;
      var prog = missionProg(m), done = prog >= m.target;
      var t = document.querySelector('[data-mi-t="' + i + '"]');
      if(t) t.textContent = won(Math.min(prog, m.target)) + " / " + won(m.target) +
        " · 보상 ₩" + won(Math.round(480 * Math.pow(1.9, state.mRound - 1) * d.rw));
      var bar = document.querySelector('[data-mi-bar="' + i + '"]');
      if(bar) bar.style.width = Math.min(100, Math.round(prog / m.target * 100)) + "%";
      var cb = document.querySelector('#sheetBody [data-act="claim"][data-i="' + i + '"]');
      if(cb) cb.disabled = !done;
    }
  }
}

function stampAt(x, y, text){
  var el = document.createElement("div");
  el.className = "stamp";
  el.textContent = text;
  el.style.left = Math.max(4, Math.min(window.innerWidth - 150, x - 56)) + "px";
  el.style.top = Math.max(40, y - 26) + "px";
  document.body.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add("go"); });
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 700);
}

}

   입력
   ========================================================= */
function wireUI(){
  $("tabs").addEventListener("click", function(e){
    var b = e.target.closest("button[data-tab]");
    if(!b) return;
    openSheet(b.getAttribute("data-tab"));
  });
  $("sheetClose").addEventListener("click", closeSheet);
  $("sheetWrap").addEventListener("click", function(e){
    if(e.target === $("sheetWrap")) closeSheet();
  });
  $("modal").addEventListener("click", function(e){
    if(e.target.closest("[data-close]")) hideModal();
  });
  $("meetBadge").addEventListener("click", function(){
    sheetKind = null;
    openSheet("minutes");
  });

  $("sheetBody").addEventListener("click", function(e){
    var btn = e.target.closest("[data-act]");
    if(!btn || btn.disabled) return;
    var act = btn.getAttribute("data-act");
    var r = btn.getBoundingClientRect();
    if(act === "approve"){
      var uid = parseInt(btn.getAttribute("data-uid"), 10);
      var oi = parseInt(btn.getAttribute("data-oi"), 10);
      var card = null;
      for(var i = 0; i < state.inbox.length; i++) if(state.inbox[i].uid === uid) card = state.inbox[i];
      if(!card) return;
      var res = approveCard(card, oi, false);
      if(res){
        stampAt(r.left + r.width / 2, r.top + r.height / 2, "승인");
        toast((res.gain >= 0 ? "+" : "") + "₩" + won(res.gain) + " · +" + res.xp + " 경험치", res.gain >= 0 ? "good" : "bad");
        removeCardEl(uid);
        updateBadges();
        save();
      }
    } else if(act === "hire"){
      var hi = parseInt(btn.getAttribute("data-i"), 10);
      if(hire(hi)){
        toast(ROLES[hi].name + " 채용 완료! 함께 일해요", "good");
        renderSheet(); updateBadges(); save();
      } else toast("자금이 부족해요", "bad");
    } else if(act === "lvup"){
      var li = parseInt(btn.getAttribute("data-i"), 10);
      if(levelUp(li)){
        toast(ROLES[li].name + " 레벨 " + state.staff[li].lv + " 달성!", "good");
        renderSheet(); save();
      } else toast("자금이 부족해요", "bad");
    } else if(act === "promo"){
      var pi = parseInt(btn.getAttribute("data-i"), 10);
      var pr = promote(pi);
      if(pr === true){
        toast(ROLES[pi].name + " " + rankName(state.staff[pi].rank) + " 승진! 전결 범위가 넓어졌어요", "gold");
        stampAt(r.left + r.width / 2, r.top + r.height / 2, "승진");
        renderSheet(); save();
      } else if(pr === "lv") toast("레벨 " + promoNeedLv(pi) + " 이상이어야 승진할 수 있어요", "bad");
      else toast("자금이 부족해요", "bad");
    } else if(act === "buy"){
      var uid2 = btn.getAttribute("data-id");
      var up = null;
      for(var u = 0; u < UPGRADES.length; u++) if(UPGRADES[u].id === uid2) up = UPGRADES[u];
      if(up && buyUp(up)){ renderSheet(); save(); }
      else if(up) toast("자금이 부족해요", "bad");
    } else if(act === "claim"){
      var mi = parseInt(btn.getAttribute("data-i"), 10);
      if(claimMission(mi)){ renderSheet(); save(); }
    } else if(act === "minutes"){
      var mi2 = parseInt(btn.getAttribute("data-m"), 10);
      openMinutesAt(mi2);
    }
  });

  $("quickApprove").addEventListener("click", function(){
    if(!state.inbox.length){ SFX.bad(); return; }
    var card = state.inbox[0];
    var res = approveCard(card, 0, true);
    var b = $("quickApprove").getBoundingClientRect();
    stampAt(b.left + b.width / 2, b.top - 30, "승인");
    if(res) toast("빠른 결재 · +₩" + won(res.gain) + " · +" + res.xp + " 경험치", "good");
    if(sheetKind === "inbox") removeCardEl(card.uid);
    updateBadges();
    save();
  });

  $("boostBtn").addEventListener("click", function(){ startBoost(); });

  $("muteBtn").addEventListener("click", function(){
    state.muted = !state.muted;
    soundOn = !state.muted;
    $("muteBtn").textContent = state.muted ? "🔇" : "🔊";
    if(!state.muted) SFX.tap();
    save();
  });

  cv.addEventListener("click", function(ev){
    var rect = cv.getBoundingClientRect();
    var lx = (ev.clientX - rect.left - view.ox) / view.s;
    var ly = (ev.clientY - rect.top - view.oy) / view.s;
    var i;
    for(i = 0; i < 12; i++){
      if(!state.staff[i].hired || !live[i]) continue;
      var l = live[i];
      if(Math.abs(lx - l.x) < 8 && ly > l.y - 24 && ly < l.y + 3){
        var s = state.staff[i];
        toast(ROLES[i].name + " " + rankName(s.rank) + " · " + ROLES[i].dept + " · 레벨 " + s.lv +
              " · +" + won(staffInc(i) * mult()) + "/초");
        say(i, s.rank === 0 ? "열심히 배울게요!" : "맡겨 주세요!", 2500, true);
        SFX.tap();
        return;
      }
    }
    /* 회의실 영역 */
    var mw3 = 58 + state.up.meeting * 10;
    if(lx > 3 && lx < 6 + mw3 + 4 && ly > 42 && ly < 84){
      openSheet("minutes");
      return;
    }
    /* 대표님 책상 */
    if(lx > 94 && lx < 174 && ly > 50 && ly < 82){
      openSheet("inbox");
      return;
    }
    for(var k = 0; k < 12; k++){
      var d = deskOf(k);
      if(lx >= d.x - 2 && lx <= d.x + 50 && ly >= d.y - 12 && ly <= d.y + 24){
        openSheet("staff");
        return;
      }
    }
  });

  document.addEventListener("visibilitychange", function(){
    if(document.hidden) save();
  });
  window.addEventListener("pagehide", save);
  window.addEventListener("resize", function(){ resize(); });
  window.addEventListener("orientationchange", function(){ setTimeout(resize, 220); });
}

/* =========================================================
   루프
   ========================================================= */
var lastT = 0, saveAcc = 0, hudAcc = 0, refreshAcc = 0;

function tick(dt){
  var now = Date.now();
  var gain = ips(now) * dt;
  if(gain > 0){
    state.money += gain;
    state.totalEarned += gain;
    state.ctr.earned += gain;
  }
  if(now >= state.nextCardAt){
    spawnCard();
    state.nextCardAt = now + cardInterval() * 1000;
  }
  updateActors(dt);
  updateMeeting();
}

function updateHUD(now){
  $("money").textContent = won(state.money);
  var buff = now < state.buffUntil ? " · 회의 +10%" : "";
  $("ips").textContent = "+" + won(ips(now)) + "/초" + (now < state.boostUntil ? " ×2" : "") + buff;
  $("lv").textContent = state.level;
  var need = needXp(state.level);
  $("xpfill").style.width = Math.min(100, state.xp / need * 100) + "%";
  if(now < state.boostUntil){
    $("boostLabel").textContent = "🔥 부스트 " + Math.ceil((state.boostUntil - now) / 1000) + "초";
    $("boostBtn").disabled = true;
  } else if(now < state.boostReadyAt){
    $("boostLabel").textContent = "🔥 대기 " + Math.ceil((state.boostReadyAt - now) / 1000) + "초";
    $("boostBtn").disabled = true;
  } else {
    $("boostLabel").textContent = "🔥 2배 부스트";
    $("boostBtn").disabled = false;
  }
  meetBadge();
}

function loop(ts){
  requestAnimationFrame(loop);
  if(!lastT) lastT = ts;
  var dt = Math.min(0.12, Math.max(0, (ts - lastT) / 1000));
  lastT = ts;
  tick(dt);
  var nb = (Math.floor(Date.now() / 560) % 2) === 0;
  if(nb !== ceoBob){ ceoBob = nb; drawBG(); }
  drawScene();
  hudAcc += dt;
  if(hudAcc > 0.1){ hudAcc = 0; updateHUD(Date.now()); }
  saveAcc += dt;
  if(saveAcc > 6){ saveAcc = 0; save(); }
  refreshAcc += dt;
  if(refreshAcc > 0.5){ refreshAcc = 0; refreshLive(); }
}

/* =========================================================
   시작
   ========================================================= */
function init(){
  var loaded = load();
  var offlineGain = 0, away = 0, updNote = "";
  if(loaded){
    state = loaded;
    updNote = state.updNote || "";
    state.updNote = "";
    away = (Date.now() - (state.savedAt || Date.now())) / 1000;
    if(away > 60 && state.staff.some(function(s){ return s.hired; })){
      offlineGain = ips() * Math.min(away, MAXH) * 0.5;
      if(offlineGain < 1) offlineGain = 0;
    }
    state.money += offlineGain;
    if(offlineGain > 0){ state.totalEarned += offlineGain; }
    state.savedAt = Date.now();
    if(!state.nextCardAt || state.nextCardAt < Date.now() - 60000) state.nextCardAt = Date.now() + 4000;
  } else {
    state = newState();
    state.nextCardAt = Date.now() + 5000;
  }
  if(!state.nextMeetAt || state.nextMeetAt < Date.now() - 60000) state.nextMeetAt = Date.now() + 22000;
  soundOn = !state.muted;
  $("muteBtn").textContent = state.muted ? "🔇" : "🔊";

  uidC = 0;
  for(var i = 0; i < state.inbox.length; i++) if(state.inbox[i].uid > uidC) uidC = state.inbox[i].uid;
  for(var j = 0; j < 12; j++) if(state.staff[j].hired) spawnLive(j);
  drawBG();
  resize();
  wireUI();
  updateBadges();
  updateHUD(Date.now());
  requestAnimationFrame(loop);

  setTimeout(function(){
    if(updNote){
      showModal(
        '<div class="kick">업데이트 · 버전 ' + VER + '</div>' +
        '<h2>사무실이 한 단계 커졌어요</h2>' +
        '<p>이제 AI 직원에게 <b>직급</b>이 생겼어요.</p>' +
        '<ul>' +
        '<li>🪪 <b>직급</b> — 인턴 → 대리 → 과장 → 차장 → 부장 → 이사</li>' +
        '<li>✅ <b>자체 전결</b> — 직급이 충분하면 직원이 알아서 처리</li>' +
        '<li>🏃 <b>상신</b> — 부족하면 상사 자리로 걸어가 결재를 받아요</li>' +
        '<li>🗣 <b>회의록</b> — 회의실에서 열린 회의를 실시간으로 읽을 수 있어요</li>' +
        '</ul>' +
        '<p style="font-size:10px;opacity:.7">기존 직원들은 그동안 쌓인 레벨만큼 직급을 인정받았어요.</p>' +
        '<button class="go" data-close>사무실 열기</button>'
      );
    } else if(!state.intro){
      state.intro = true; save();
      showModal(
        '<div class="kick">AI 사무실 · 사장실</div>' +
        '<h2>오늘도 바쁜 AI 사무실</h2>' +
        '<p>대표님, 오늘도 혼자 다 하실 건가요?<br>AI 직원을 채용하고, 결재만 눌러 주세요.</p>' +
        '<ul>' +
        '<li>📥 <b>결재함</b> — 직원이 올린 서류를 확인</li>' +
        '<li>🤖 <b>직원</b> — 채용 · 레벨업 · 승진</li>' +
        '<li>🏢 <b>시설</b> — 사무실 업그레이드</li>' +
        '<li>✅ <b>할 일</b> — 달성 보너스</li>' +
        '<li>🗣 <b>회의록</b> — 회의실 대화 엿보기</li>' +
        '</ul>' +
        '<p style="font-size:10px;opacity:.65">진행 상황은 자동으로 저장돼요.</p>' +
        '<button class="go" data-close>사무실 열기</button>'
      );
    } else if(offlineGain > 0){
      var hh = Math.floor(away / 3600), mm = Math.floor((away % 3600) / 60);
      showModal(
        '<div class="kick">오프라인 정산</div>' +
        '<h2>자리를 비운 사이</h2>' +
        '<p>직원들이 열심히 일했어요. (' + (hh ? hh + "시간 " : "") + mm + "분)" +
        (away > MAXH ? "<br><span style=\"opacity:.6\">최대 8시간까지만 정산돼요</span>" : "") + '</p>' +
        '<div class="big">+₩' + won(offlineGain) + '</div>' +
        '<p style="text-align:center;font-size:10px;opacity:.65">보관함에 자동으로 들어갔어요</p>' +
        '<button class="go" data-close>확인</button>'
      );
      SFX.coin();
    }
  }, 420);

  save();
}

init();
})();
</script>
